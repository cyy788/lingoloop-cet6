然后继续转弯。闪烁黄灯意味着让行或示意谨慎,就像在消防站外一 样。美国没有全向闪烁黄灯,因为这是被禁止的。如果你有闪烁黄灯,你应该让行迎面而来的车辆。 Q) Flashing Yellow Arrows are part of a four-signal traffic light. These are used in some states after a protected green turn signal, or arrow, but before a steady yellow arrow. When a flashing yellow arrow is shown, you can take the turn after yielding to pedestrians and traffic. Steady Yellow Arrows maintain the normal yellow light caution in three-light signals, meaning to stop or prepare to stop. In a four-signal system that has a flashing yellow arrow, the steady yellow arrow is a signal that the yield period is ending. The red arrow is about to start. Vehicles should stop if safely possible. Traffic tickets are possible for running a steady yellow arrow. 闪烁黄色箭头是四信号交通灯的一部分。在一些州,这些在受保护的绿色转向信号或箭头之后但在稳定 黄色箭头之前使用。当显示闪烁黄色箭头时,你可以在让行行人和车辆后转弯。稳定黄色箭头在三灯信 号中保持正常的黄灯警示,意味着停车或准备停车。在具有闪烁黄色箭头的四信号系统中,稳定黄色箭头 是让行期结束的信号。红色箭头即将开始。车辆应该在安全的情况下停车。闯稳定黄色箭头可能导致 交通罚单。 R) Traffic light meaning is fairly consistent across the board with various deviations. Green means it's safe to proceed (though you should still exercise caution). Yellow means caution and yield. Red means danger and stop. Always drive defensively and obey traffic signals. 交通灯的含义在各个方面相当一致,只有各种偏差。绿色意味着可以安全通行(尽管你仍应谨慎行事)。 黄色意味着谨慎和让行。红色意味着危险和停车。始终进行防御性驾驶并遵守交通信号。 陈述句与逐句解析 看 到 闪 烁 的 黄 色 箭 头 时 , 驾 驶 员 应 该 先 让 行 人 和 车 辆 通 过 , 然 后 再 转 弯 。"}}},"match":{"title":"The History and Meaning of Colored Traffic Lights","paragraphs":{"A":{"en":"Timed traffic lights are set according to schedules that are supposed to coordinate with peak traffic hours. Cities need to monitor and update signal light time schedules at least every two years to keep these systems effective. In Los Angeles, California, an ambitious project to go a step further and synchronize (使同步) every red light in Los Angeles cost over 400 million dollars. Ask a resident of the city and they are likely to agree that saving time on the road is well worth it. If implemented nationwide, synchronization could shave 10% off traffic congestion (堵 塞) and 20% off air pollution. Congestion costs time, money, and lives. Big data can help improve how millions of people safely share the road. However, none of this would be possible without the traffic light!","cn":"synchronize( 使同步 ) every red light in Los Angeles cost over 400 million dollars. Ask a resident of nationwide, synchronization could shave 10% off traffic congestion( 堵塞 ) and 20% off air pollution. 定时交通信号灯根据应当与高峰交通时段相协调的时刻表进行设置。城市需要至少每两年监测和更新 信号灯时间安排,以保持这些系统的有效性。在加利福尼亚州洛杉矶,一项更进一步同步洛杉矶每个红灯 的雄心勃勃的项目耗资超过4亿美元。问问这座城市的居民,他们很可能会认为节省道路上的时间非常 值得。如果在全国范围内实施,同步化可以减少10%的交通拥堵和20%的空气污染。拥堵浪费时间、金 钱和生命。大数据可以帮助改善数百万人安全共享道路的方式。然而,如果没有交通信号灯,这一切都不 可能实现!"},"B":{"en":"The first traffic light was invented in London in the 1860's, but it was hardly recognizable - or effective. It had been adapted from the railroad signal system by a railway manager, John Peak Knight, in 1868. The railroads used red gas lights at night to signal stops and green gas lights during the daytime. Knight installed a similar gas light, semaphore (臂板信号) system near London's Westminster Bridge in December of 1868.","cn":"the daytime. Knight installed a similar gas light, semaphore( 臂板信号 ) system near London's 第一个交通信号灯于19世纪60年代在伦敦发明,但它几乎无法辨认——也不有效。1868年,铁路管理者 John Peak Knight将铁路信号系统进行了改造。铁路在夜间使用红色气灯来示意停车,白天则使用绿色 气灯。Knight于1868年12月在伦敦威斯敏斯特桥附近安装了一套类似的气灯臂板信号系统。"},"C":{"en":"The life of the first traffic light signal was short-lived. A gas leak caused one of the signal lights to explode on its police officer operator within a month of being installed.","cn":"第一个交通信号灯的寿命很短。在安装后不到一个月,煤气泄漏导致其中一个信号灯在其警察操作员身 上爆炸。"},"D":{"en":"Automating traffic signals stalled after the London incident. Forty years passed before cars crowding city streets urged the development of traffic lights in the United States. London would not see another traffic light until 1929.","cn":"伦敦事故后,交通信号自动化陷入停滞。四十年过去了,拥挤城市街道的汽车才促使美国发展交通信号 灯。伦敦直到1929年才再次出现交通信号灯。"},"E":{"en":"The United States is a car culture like no other country. Unlike most European cities that started urban planning when horses were high-tech, many cities in the United States were designed around urban sprawl, suburban tracts, and motor cars.","cn":"美国的汽车文化不同于任何其他国家。与大多数欧洲城市在马匹还是高科技时代就开始城市规划不同, 美国的许多城市是围绕城市扩张、郊区地带和机动车辆设计的。"},"F":{"en":"As traffic and cities grew, so did the race to solve growing traffic problems. The first traffic signals were semaphores. Semaphores are towers with moving arms signaling for traffic to stop or go. They could be manual or automatic. There was no consistent design. V arious models were invented and put into place in cities as the need arose.","cn":"随着交通和城市的发展,解决日益严重的交通问题的竞赛也在进行。最早的交通信号是臂板信号。臂板 信号是带有移动臂的塔,示意交通停止或通行。它们可以是手动的或自动的。没有统一的设计。随着需 求的出现,各种型号被发明并安装在城市中。"},"G":{"en":"In 1912, Lester Wire was a police officer exhausted by traffic at Main Street and 200 South. He developed a manually switched stop light. The four-sided box, raised on a ten-foot pole, looked like a birdhouse and was operated manually by an officer. The officer would flip a switch to change between the dipped red and green lights.","cn":"1912年,Lester Wire是一名因Main Street和200 South的交通而疲惫不堪的警察。他开发了一种手动 切换的停车灯。这个四面的盒子安装在十英尺高的杆子上,看起来像鸟屋,由警察手动操作。警察会拨动 开关在倾斜的红灯和绿灯之间切换。"},"H":{"en":"Like the 1910 semaphore, the first electric signal used words. However, the words were no longer written on arms that raised and fell. The words \\"stop\\" or \\"move\\" were on lights. The posts lit up on each of four corner- posts around an intersection (十字路口). It was not automated, though. A booth with an operator was required to flip the switches.","cn":"each of four corner-posts around an intersection( ⼗字路⼝ ). It was not automated, though. A booth 与1910年的臂板信号一样,第一个电子信号使用文字。然而,文字不再写在升降的臂上。'停止'或'通 行'的字样在灯上。灯柱在十字路口周围的四个角柱上点亮。但它不是自动化的。需要一个带操作员的 岗亭来拨动开关。"},"I":{"en":"The system allowed police officers to move from the middle of the street to a corner. From that vantage (有利地 位), an officer could oversee the crowd. If an emergency vehicle came, the officer could flip a switch and clear the intersection by triggering all red lights. The emergency vehicle could now pass effortlessly. Finally, in San Francisco the first red and green electric light system that could be operated automatically (or manually) was introduced in 1917.","cn":"vantage( 有利地位 ), an officer could oversee the crowd. If an emergency vehicle came, the officer 该系统使警察能够从街道中间移动到角落。从那个有利位置,警察可以监督人群。如果有紧急车辆到来, 警察可以拨动开关,通过触发所有红灯来清空十字路口。紧急车辆现在可以毫不费力地通过。最后,1917 年在旧金山引入了第一个可以自动(或手动)操作的红绿电子灯系统。"},"J":{"en":"In 1920, the first three-color light system was introduced in Detroit - also known as Motor City, USA. The evolution of traffic light signals could not have a more appropriate context than Motor City. Ford Motor Company was founded in Detroit in 1903 (and other motor companies followed). Ford made cars affordable for more common people, rather than the wealthy, by creating larger scale factory production.","cn":"1920年,第一个三色灯系统在底特律引入——也被称为美国汽车城。交通信号灯的演变在汽车城这个背 景下再合适不过了。福特汽车公司于1903年在底特律成立(其他汽车公司随后跟进)。福特通过创建更 大规模的工厂生产,使汽车对更普通的人而非富人来说变得可负担。"},"K":{"en":"Stop and go were insufficient for the new volumes of cars zooming through intersections. Streets were full of new numbers of cars in addition to delivery wagons, bustling crowds, bicycles, horse-drawn carriages, and street cars. The introduction of the cautionary yellow light helped increase driver safety, decreasing accidents that come from running red lights.","cn":"对于呼啸通过十字路口的新增车辆数量来说,停止和通行是不够的。街道上除了满载的新车数量外,还有 送货马车、熙攘的人群、自行车、马车和有轨电车。警示黄灯的引入有助于提高驾驶员安全性,减少闯 红灯造成的事故。"},"L":{"en":"Stop lights were incredibly important in chaotic city streets. Crosswalks weren't even introduced until 1951. The first pedestrian fatality in the United States was in 1899.","cn":"停车灯在混乱的城市街道上极其重要。人行横道甚至直到1951年才被引入。美国第一起行人死亡事故 发生在1899年。"},"M":{"en":"The development of the modern traffic light may have started in London, but it grew up in the United States. In Cleveland, an African-American inventor named Garrett Morgan came up with an affordable, patented traffic signal. The yellow light made intersections safer than the old stop and go system. The new design was inexpensive enough that it allowed the installation of a lot more lights.","cn":"现代交通信号灯的发展可能始于伦敦,但它在美国成长起来。在克利夫兰,一位名叫Garrett Morgan的 非裔美国发明家提出了一种经济实惠、获得专利的交通信号。黄灯使十字路口比旧的停止和通行系统 更安全。新设计足够便宜,使得可以安装更多的灯。"},"N":{"en":"Morgan sold the patent to General Electric - and the spread of the traffic light was green lighted. Green means go. It is that simple, but it's still best to check both ways for oncoming traffic that may not be paying attention or is running the light. Yellow means slow down and prepare to stop. It does not mean full-throttle (全 速) ahead. While you may get away with gunning it into the intersection, running a yellow can lead to tickets and dangerous accidents. Red lights are a clear and consistent warning to stop. Even where right turns are allowed on red lights, you must come to a complete stop before turning right. You must also yield to any through traffic, which has the right of way. In most states and cities, you can take a right on red unless otherwise indicated. New York City does not allow a right on red.","cn":"not mean full-throttle( 全速 ) ahead. While you may get away with gunning it into the intersection, Morgan将专利出售给通用电气——交通信号灯的推广获得了绿灯。绿色意味着通行。就这么简单,但 最好还是向两边查看可能没有注意或正在闯灯的迎面而来的车辆。黄色意味着减速并准备停车。它不 意味着全速前进。虽然你可能侥幸冲进十字路口,但闯黄灯可能导致罚单和危险事故。红灯是明确且一 致的停车警告。即使在允许红灯右转的地方,你也必须在右转前完全停车。你还必须让行任何直行车辆, 它们拥有通行权。在大多数州和城市,除非另有说明,你可以在红灯时右转。纽约市不允许红灯右转。"},"O":{"en":"Red arrows mean you cannot turn right on a red in most states. The green arrow, in these cases, is the only time you can make the turn. However, you can take a right on a red arrow after a full stop in the states of Illinois, Kansas, Louisiana, Maryland, Michigan, New Hampshire, North Dakota, Oregon, South Carolina, Utah, Washington State and Wyoming.","cn":"在大多数州,红色箭头意味着你不能在红灯时右转。在这些情况下,只有绿色箭头才是你可以转弯的时 机。然而,在伊利诺伊州、堪萨斯州、路易斯安那州、马里兰州、密歇根州、新罕布什尔州、北达科 他州、俄勒冈州、南卡罗来纳州、犹他州、华盛顿州和怀俄明州,你可以在完全停车后在红色箭头时 右转。"},"P":{"en":"Flashing Red is the same as a stop sign, generally used at four-way intersections where there is minimal traffic. When arriving at a flashing red light, make a full and complete stop. Flashing Red Arrows similarly mean to stop and then proceed to take the turn. Flashing Yellow lights mean yield or signal caution, like outside of a fire station. There are no all-direction flashing yellow lights, since it is prohibited in the United States. If you have a flashing yellow light, you are to yield to oncoming traffic.","cn":"闪烁红灯与停车标志相同,通常用于交通流量最小的四向十字路口。当遇到闪烁红灯时,要完全彻底地停 车。闪烁红色箭头同样意味着停车然后继续转弯。闪烁黄灯意味着让行或示意谨慎,就像在消防站外一 样。美国没有全向闪烁黄灯,因为这是被禁止的。如果你有闪烁黄灯,你应该让行迎面而来的车辆。"},"Q":{"en":"Flashing Yellow Arrows are part of a four-signal traffic light. These are used in some states after a protected green turn signal, or arrow, but before a steady yellow arrow. When a flashing yellow arrow is shown, you can take the turn after yielding to pedestrians and traffic. Steady Yellow Arrows maintain the normal yellow light caution in three-light signals, meaning to stop or prepare to stop. In a four-signal system that has a flashing yellow arrow, the steady yellow arrow is a signal that the yield period is ending. The red arrow is about to start. Vehicles should stop if safely possible. Traffic tickets are possible for running a steady yellow arrow.","cn":"闪烁黄色箭头是四信号交通灯的一部分。在一些州,这些在受保护的绿色转向信号或箭头之后但在稳定 黄色箭头之前使用。当显示闪烁黄色箭头时,你可以在让行行人和车辆后转弯。稳定黄色箭头在三灯信 号中保持正常的黄灯警示,意味着停车或准备停车。在具有闪烁黄色箭头的四信号系统中,稳定黄色箭头 是让行期结束的信号。红色箭头即将开始。车辆应该在安全的情况下停车。闯稳定黄色箭头可能导致 交通罚单。"},"R":{"en":"Traffic light meaning is fairly consistent across the board with various deviations. Green means it's safe to proceed (though you should still exercise caution). Yellow means caution and yield. Red means danger and stop. Always drive defensively and obey traffic signals.","cn":"交通灯的含义在各个方面相当一致,只有各种偏差。绿色意味着可以安全通行(尽管你仍应谨慎行事)。 黄色意味着谨慎和让行。红色意味着危险和停车。始终进行防御性驾驶并遵守交通信号。"}},"statements":[{"num":36,"text":"Upon seeing a flashing yellow arrow, a driver should let pedestrians and traffic pass first before","answer":"Q","locateEn":"When a flashing yellow arrow is shown, you can take the turn after yielding to pedestrians and traffic.","locateCn":"出现闪烁的黄色箭头时，你可以在先给行人和过往车辆让行之后再转弯。","anchor":"强锚点"},{"num":37,"text":"The red and green automatic traffic light system originated in an American city.","answer":"I","locateEn":"Finally, in San Francisco the first red and green electric light system that could be operated automatically (or manually) was introduced in 1917.","locateCn":"最后，在旧金山，首套可自动（或手动）运行的红绿电灯系统于 1917 年问世。","anchor":"强锚点"},{"num":38,"text":"Residents of an American city tend to share the opinion that time saved on the road justifies the cost","answer":"A","locateEn":"Ask a resident of the city and they are likely to agree that saving time on the road is well worth it.","locateCn":"你去问问这座城市的居民，他们多半会同意：在路上省下的时间，绝对值回投入。","anchor":"强锚点"},{"num":39,"text":"Mass production of cars made it possible for ordinary people to buy them.","answer":"J","locateEn":"Ford made cars affordable for more common people, rather than the wealthy, by creating larger scale factory production.","locateCn":"福特通过创立更大规模的工厂生产，使汽车不再只属于富人，而是变成普通人也买得起的 东西。 38.Residents of an American city tend to share the opinion that time saved on the road justifies the cost of upgrading its traffic light system. 39.Mass production of cars made it possible for ordinary people to buy them.","anchor":"强锚点"},{"num":40,"text":"What a traffic light means is almost the same everywhere despite some variations.","answer":"R","locateEn":"Traffic light meaning is fairly consistent across the board with various deviations.","locateCn":"总体来看，红绿灯的含义大体上保持一致，只是存在一些差异。","anchor":"强锚点"},{"num":41,"text":"Pedestrian crossings came into being only in the mid-twentieth century.","answer":"L","locateEn":"Crosswalks weren't even introduced until 1951.","locateCn":"人行横道甚至直到 1951 年才出现。","anchor":"强锚点"},{"num":42,"text":"People raced to address increasing traffic problems along with the expansion of cities and traffic.","answer":"F","locateEn":"As traffic and cities grew, so did the race to solve growing traffic problems.","locateCn":"随着交通和城市的扩张，解决日益严重的交通问题的竞赛也愈演愈烈。","anchor":"强锚点"},{"num":43,"text":"When the warning yellow light was introduced, driving became safer and traffic accidents reduced.","answer":"K","locateEn":"The introduction of the cautionary yellow light helped increase driver safety, decreasing accidents that come from running red lights.","locateCn":"警示性黄灯的引入帮助提高了驾驶者的安全，减少了因闯红灯导致的事故。","anchor":"强锚点"},{"num":44,"text":"The signal system on the railroad served as the basis for the first traffic light.","answer":"B","locateEn":"It had been adapted from the railroad signal system by a railway manager, John Peak Knight, in 1868.","locateCn":"它是 1868 年由铁路经理 John Peak Knight 仿照铁路信号系统改造而来的。","anchor":"强锚点"},{"num":45,"text":"Even though a green light signals \\"go\\", attention should be paid to traffic on either side in case some","answer":"N","locateEn":"Green means go. It is that simple, but it's still best to check both ways for oncoming traffic that may not be paying attention or is running the light.","locateCn":"绿灯表示通行。就这么简单，但最好还是双向都看一下，留意那些可能心不在焉、或者正在 闯灯的对向车辆。","anchor":"强锚点"}]},"careful":[{"paragraphs":[{"en":"Mindfulness has been shown to have a number of meaningful health benefits - it can help reduce anxiety and promote healing in those suffering from chronic illness.","cn":"正念已被证明具有许多重要的健康益处——它可以帮助减少焦虑,并促进慢性疾病患者的康复。"},{"en":"The practice is based on an insight first described in ancient Buddhist texts that human beings have the capacity to observe experience without being caught up in it. This means simply that it is possible to observe ourselves having a craving, or a happy thought, or even a scary emotion, without reacting in the moment in a way that amplifies the feeling or sends the mind spiraling off into thinking about old memories or anticipating events.","cn":"这种练习基于古代佛教文本中首次描述的一种洞见,即人类有能力观察体验而不陷入其中。这简单地意味 着,我们可以观察自己产生渴望、快乐的想法,甚至可怕的情绪,而不在当下以放大这种感受或使思绪陷入对 旧回忆的思考或对未来事件的预期的方式做出反应。"},{"en":"This practice of mindfulness can help calm the mind and the body as we learn not to react to experience with likes and dislikes or judgments of good and bad. It does not make us cold or indifferent but more fully present.","cn":"这种正念练习可以帮助平静身心,因为我们学会不以好恶或好坏的判断来回应体验。它不会使我们变得冷漠 或漠不关心,而是让我们更充分地活在当下。"},{"en":"One of the challenges of practicing mindfulness in our contemporary world is that there has been a profound transformation in human attention. The artist Jenny Odell argues that in our \\"attention economy\\" human attention has been transformed into a commodity that big corporations buy and sell. This economy rests on a technological revolution of mobile phones and social media that makes it possible for corporations to target our attention with their content at every moment.","cn":"在当代世界练习正念的挑战之一是人类注意力发生了深刻的转变。艺术家Jenny Odell认为,在我们的\\"注意 力经济\\"中,人类注意力已经转变为大公司买卖的商品。这种经济依赖于移动电话和社交媒体的技术革命,使 公司能够在每时每刻用其内容瞄准我们的注意力。"},{"en":"The devices most people use are a perpetual diversion from the present moment. The result is that it can feel as though our ability to focus, and be fully present, has been stolen. But mindfulness can help us resist the attention economy and relish the things that make life special, like being together with those we love.","cn":"大多数人使用的设备是对当下时刻的永久分散。其结果是,我们的专注能力和充分活在当下的能力似乎被偷 走了。但正念可以帮助我们抵制注意力经济,并珍视那些使生活特别的事物,比如与我们所爱的人在一起。"},{"en":"Most mindfulness research focuses on the individual benefits of the practice, but some scholars assert that we can not only practice mindfulness for ourselves but also practice it for others. It can help us build stronger, healthier relationships.","cn":"大多数正念研究关注这种练习的个人益处,但一些学者断言,我们不仅可以为自己练习正念,也可以为他人练 习正念。它可以帮助我们建立更牢固、更健康的关系。"},{"en":"The sad truth is that living in the attention economy, most of us have become bad listeners. However, just as it is possible to watch ourselves having an experience without reacting, it's possible to watch another person have an experience without getting tied up in reactivity and judgment.","cn":"可悲的事实是,生活在注意力经济中,我们大多数人已经成为糟糕的倾听者。然而,正如我们可以观察自己拥 有一种体验而不做出反应一样,我们也可以观察另一个人拥有一种体验而不陷入反应性和判断之中。"},{"en":"The gift of mindfulness is a practice of listening with compassion to others describe their experiences. To give this gift means putting away your phone, turning off social media, and setting aside other common distractions. It means practicing being fully present in another person's presence and listening to them with complete attention without judgment, while resisting the urge to make the interaction about you.","cn":"正念的馈赠是一种带着同情心倾听他人描述其体验的练习。给予这份馈赠意味着收起手机,关闭社交媒体, 并放下其他常见的干扰。它意味着练习在他人面前充分活在当下,并以完全的注意力倾听他们而不加判断, 同时抵制使互动围绕自己的冲动。"},{"en":"If we judge the value of gifts based on their price, this gift may seem worthless, but in a distracted world, it is a precious one.","cn":"如果我们根据价格来判断礼物的价值,这份礼物可能看起来毫无价值,但在一个分心的世界里,它是珍贵的。"}],"questions":[{"num":46,"prompt":"What do we learn from the passage about practicing mindfulness?","options":["It triggers our mind to reflect on past experiences or anticipate future events.","It focuses our attention on the present moment without making judgments.","It concentrates our mind on our personal feelings, happy or scary.","It helps our mind to stay calm when facing judgments from others."],"answer":"B","qtype":"细节题","locateEn":"This means simply that it is possible to observe ourselves having a craving, or a happy thought, or even a scary emotion, without reacting in the moment in a way that amplifies the feeling or sends the mind spiraling off into thinking about old memories or anticipating events.","locateCn":"这意味着，我们可以观察自己产生渴望、愉快念头甚至恐惧情绪，而无需在当下作出反应、 不放大该情绪，也不让心思滑向旧时记忆或对未来事件的预期。 46.What do we learn from the passage about practicing mindfulness? A)It triggers our mind to reflect on past experiences or anticipate future events. B)It focuses our attention on the present moment without making judgments. C)It concentrates our mind on our personal feelings, happy or scary. D)It helps our mind to stay calm when facing judgments from others.","translation":""},{"num":47,"prompt":"What do we see in today's \\"attention economy\\" according to Jenny Odell?","options":["Focus on technological advances continuously updates products and services.","People's attention is turned into something that can be bought and sold.","Businesses profit from selling mobile phones and revolutionizing social media.","People tend to purchase products and services without careful thinking."],"answer":"B","qtype":"细节题","locateEn":"The artist Jenny Odell argues that in our \\"attention economy\\" human attention has been transformed into a commodity that big corporations buy and sell.","locateCn":"艺术家 Jenny Odell 论述道：在我们的「注意力经济」中，人的注意力已经被转化成大公司 买卖的商品。","translation":""},{"num":48,"prompt":"What happens with the prevalent use of mobile phones or social media?","options":["They keep distracting users from the here and now.","They render users incapable of resisting temptation.","They rob users of their ability to observe experience.","They tempt users to endorse the attention economy."],"answer":"A","qtype":"细节题","locateEn":"The devices most people use are a perpetual diversion from the present moment.","locateCn":"大多数人使用的这些设备是一种让人持续偏离当下的干扰。","translation":""},{"num":49,"prompt":"What benefit can practicing mindfulness bring to us according to some scholars?","options":["It prevents us from making arbitrary judgments about others.","It shifts our attention from material things to spiritual pursuits.","It is conducive to our forging better interpersonal relationships.","It is helpful in regaining our ability to enjoy what we have in life."],"answer":"C","qtype":"细节题","locateEn":"Most mindfulness research focuses on the individual benefits of the practice, but some scholars assert that we can not only practice mindfulness for ourselves but also practice it for others. It can help us build stronger, healthier relationships.","locateCn":"多数正念研究关注其个人层面的益处，但一些学者论断：正念不仅可为己练，也可为他人而 练；它能帮我们建立更稳固、更健康的人际关系。","translation":""},{"num":50,"prompt":"What does the author suggest we do in another person's presence?","options":["Share each other's experience frankly and compassionately.","Pay full attention to establishing close relationships with them.","Be attentive listeners while refraining from making judgments.","Remind them of the distraction from mobile phones and social media."],"answer":"C","qtype":"细节题","locateEn":"It means practicing being fully present in another person's presence and listening to them with complete attention without judgment, while resisting the urge to make the interaction about you.","locateCn":"这意味着练习在另一个人面前全然临在，全神贯注地倾听他们，不作评判，同时克制把对话 焦点拉回到自己身上的冲动。","translation":""}]},{"paragraphs":[{"en":"The other day I had to log into a service I hadn't used before. Since I was a new user, the website decided that it needed to check I wasn't a robot and so set me a Captcha test to determine whether the user is a person or a machine.","cn":"前几天我不得不登录一个之前从未使用过的服务。由于我是新用户,该网站决定需要检查我不是机器人,于 是让我完成一项验证码测试来确定用户是人还是机器。"},{"en":"I was presented with an image of a roadside scene over which was laid a grid. My \\"challenge\\" was to click on each cell in the grid that contained a traffic sign. I did so, a bit irritated. Then I was presented with another image and another grid - also with a request to identify road signs. Like a lamb, I complied, after which the website accepted my input.","cn":"我看到一张路边场景的图片,上面覆盖着一个网格。我的\\"挑战\\"是点击网格中包含交通标志的每个单元格。 我有点恼火地照做了。然后我又看到另一张图片和另一个网格——同样要求识别道路标志。我像只羔羊一 样顺从了,之后网站接受了我的输入。"},{"en":"And then I realised what I had been doing was adding to a dataset for training the machine-learning software that guides self-driving cars. So, to gain access to an automated service that will benefit financially from my input, I first have to do some unpaid labor to help improve the performance of autonomous vehicles.","cn":"然后我意识到我一直在做的事情是为训练指导自动驾驶汽车的机器学习软件添加数据集。所以,为了获得 一项将从我的输入中获得经济利益的自动化服务,我首先必须做一些无偿劳动来帮助提高自动驾驶车辆的 性能。"},{"en":"Neat, eh? But note also the delicious additional irony that the Captcha is described as an \\"automated Turing test\\". The Turing test was conceived, you may recall, as a way of enabling humans to determine whether a machine could respond in such a way that one couldn't tell whether it was a human or a robot. So we have wandered into a world in which machines make us do tricks to prove that we are humans!","cn":"巧妙,是吧?但也请注意额外的绝妙讽刺,验证码被描述为\\"自动化图灵测试\\"。你可能记得,图灵测试的设想是 一种让人类能够确定机器是否能以一种无法分辨它是人还是机器人的方式做出反应的方法。所以我们已经 步入了一个机器让我们做把戏来证明我们是人类的世界!"},{"en":"The strangest aspect of this unparalleled shift is how under-discussed it has been. The metaphor of the boiling frog comes to mind. Have we become so subtly conditioned by digital technology that we don't see what's been happening to us? Have we been conditioned to accept a world governed by \\"smart\\" tech, trading convenience to the point where we become a bit like machines ourselves?","cn":"这一史无前例转变最奇怪的方面是它讨论得如此之少。温水煮青蛙的比喻浮现在脑海中。我们是否已经被 数字技术如此微妙地训化,以至于我们看不到发生在我们身上的事情?我们是否已经被训化到接受一个由\\"智 能\\"技术统治的世界,为了便利而交易到我们自己都变得有点像机器的地步?"},{"en":"In a recent startling and thoughtful book, two scholars - Brett Frischmann, a law professor, and Evan Selinger, a philosopher - argue that the answer to that question is \\"yes\\".","cn":"在最近一本令人震惊且发人深省的书中,两位学者——法学教授Brett Frischmann和哲学家Evan Selinger ——认为这个问题的答案是\\"是的\\"。"},{"en":"And they're right. There's nothing technophobic (技术恐惧的) about that. We shape our tools and then our tools shape us. Technology is supposed to provide tools that serve human ends. But, as the machine-learning Captcha demonstrates, a significant proportion of digital tech now sees (and uses) humans as means to ends that are not ours. In the process, they reduce us to the status of cheery rats running on treadmills (踏车) designed by people who do not have our interests at heart. So back to the frog metaphor. Are we smart enough to jump out before it's too late? You don't even have to Google it to know the answer.","cn":"他们是对的。这并没有任何技术恐惧的成分。我们塑造我们的工具,然后我们的工具塑造我们。技术本应提 供服务于人类目的的工具。但是,正如机器学习验证码所展示的,相当大比例的数字技术现在将人类视为(并 利用为)达成并非我们自己目的的手段。在这个过程中,它们把我们降低到快乐地在由不以我们利益为重的 人设计的踏车上奔跑的老鼠的地位。所以回到青蛙的比喻。我们是否足够聪明在为时已晚之前跳出来?你 甚至不必谷歌搜索就知道答案。"}],"questions":[{"num":51,"prompt":"How did the author respond to the Captcha test?","options":["He clicked on the cells randomly.","He accepted the challenge readily.","He completed it confidently.","He worked on it submissively."],"answer":"D","qtype":"细节题","locateEn":"Like a lamb, I complied, after which the website accepted my input.","locateCn":"我像一只羔羊一样照办了，之后网站接受了我的输入。","translation":""},{"num":52,"prompt":"What is ironic about the Captcha test?","options":["A machine can respond to the test as well as humans do.","A machine can outperform humans in object identification.","A test designed to test machines is now used by machines to test humans.","A test conceived to tell a human from a robot can now do tricks humans can't."],"answer":"C","qtype":"细节题","locateEn":"But note also the delicious additional irony that the Captcha is described as an \\"automated Turing test\\". The Turing test was conceived, you may recall, as a way of enabling humans to determine whether a machine could respond in such a way that one couldn't tell whether it was a human or a robot. So we have wandered into a world in which machines make us do tricks to prove that we are humans!","locateCn":"但还要注意一个绝妙的额外讽刺：Captcha 被称作\\"自动化的图灵测试\\"。你或许记得，图灵 测试当初的设想，是让人类来判断机器能否做出让人分不清是人还是机器人的回应。结果， 我们如今竟漂入了这样一个世界——机器反过来让我们耍把戏，以证明我们是人类！","translation":""},{"num":53,"prompt":"Why does the author use the metaphor of the boiling frog?","options":["To show that humans are unwilling to trade convenience for control by smart tech.","To show that humans are unaware of the potential danger brought by smart tech.","To question whether humans are conditioned to accept digital tech.","To question whether humans are as vulnerable as the boiling frog."],"answer":"B","qtype":"推断题","locateEn":"The metaphor of the boiling frog comes to mind. Have we become so subtly conditioned by digital technology that we don't see what's been happening to us?","locateCn":"脑海里浮现出\\"温水煮青蛙\\"的比喻。我们是不是已经被数字技术悄悄驯化，以至于看不到自 己身上正在发生什么？","translation":""},{"num":54,"prompt":"Why does the author think that Brett Frischmann and Evan Selinger are right?","options":["A large part of digital tech is now making use of humans to meet its own ends.","Humans are now fast locked in a race against digital tech to control the world.","Digital tech can serve human needs in ways previously thought impossible.","Digital tech is now doing thinking while humans are doing repetitive work."],"answer":"A","qtype":"细节题","locateEn":"And they're right. There's nothing technophobic about that. We shape our tools and then our tools shape us. Technology is supposed to provide tools that serve human ends. But, as the machine-learning Captcha demonstrates, a significant proportion of digital tech now sees (and uses) humans as means to ends that are not ours.","locateCn":"他们说得没错。这并不是什么技术恐惧。我们塑造工具，反过来工具也塑造我们。技术本应 提供服务于人类目的的工具。但是，正如机器学习版 Captcha 所展示的那样，相当一部分 数字技术如今把人类当作（并加以利用为）实现非人类目的之手段。 54.Why does the author think that Brett Frischmann and Evan Selinger are right? A)A large part of digital tech is now making use of humans to meet its own ends. B)Humans are now fast locked in a race against digital tech to control the world. C)Digital tech can serve human needs in ways previously thought impossible. D)Digital tech is now doing thinking while humans are doing repetitive work.","translation":""},{"num":55,"prompt":"What does the author imply by asking \\"Are we smart enough to jump out before it's too late?\\" at the","options":["It is not sensible to expect digital tech to take humans' interest to heart.","It is hard to say whether technology or humans will get the upper hand.","We may have to search the web to get the answer to the question.","We may not awake in time to the danger digital tech poses to us."],"answer":"D","qtype":"推断题","locateEn":"So back to the frog metaphor. Are we smart enough to jump out before it's too late? You don't even have to Google it to know the answer.","locateCn":"那么回到青蛙的比喻。我们够聪明，能在为时已晚之前跳出来吗？这个问题，你甚至都不用 上网搜就能知道答案。","translation":""}]}],"listeningRef":"2025-12-1"}`),"2026-06-2":JSON.parse(`{"id":"2026-06-2","label":"2026年6月 · 第2套","writing":{"modelEssay":"In an era of rapid social development, it is vitally important to enhance young people's sense of responsibility.\\nAs society changes at an unprecedented pace, young people often face distractions and pressures that weaken\\ntheir commitment to family, community, and the future. Without a strong sense of responsibility, they may\\nbecome self-centered and short-sighted.\\nThe decline of responsibility among youth is partly caused by the instant gratification culture brought by\\ntechnology and social media. Many young people are used to receiving immediate rewards and may avoid\\nduties that require long-term effort. To address this problem, schools and families should work together to\\ncultivate accountability through real tasks and role models. For example, involving students in community\\nservice can help them understand the value of contributing to society.\\nIn conclusion, enhancing young people's sense of responsibility is not only a personal virtue but also a social\\nnecessity. Only when the younger generation takes responsibility seriously can society achieve sustainable\\ndevelopment and harmony.","modelCn":"在社会快速发展的时代，提升年轻人的责任感至关重要。随着社会以前所未有的速度变化，年轻人常常面\\n临分散注意力和压力，这些因素削弱了他们对家庭、社区和未来的承诺。如果没有强烈的责任感，他们可\\n能会变得以自我为中心、目光短浅。\\n年轻人责任感的下降，部分是由科技和社交媒体带来的即时满足文化造成的。许多年轻人习惯于获得即时\\n回报，可能会回避需要长期付出的职责。为解决这一问题，学校和家庭应共同努力，通过真实任务和榜样\\n示范来培养责任意识。例如，让学生参与社区服务，可以帮助他们理解为社会做贡献的价值。\\n总之，提升年轻人的责任感不仅是个人美德，也是社会必需。只有当年轻一代认真对待责任时，社会才能\\n实现可持续发展与和谐。"},"translation":{"source":"电子商务的蓬勃发展正在深刻改变中国农村的面貌。随着互联网和物流网络快速向农村延伸，  越来越多的农村居民通过电子商务平台将农产品直接销售给城市消费者。近年来，直播带货  ( live-streaming commerce) 使城市消费者能够与卖家实时互动，已成为促进农村发展的一种新方式。电子商务打破了城乡之间的信息壁垒，拓宽了农产品销售渠道，帮助农村居民增收致富。数字经济与乡村振兴的深度融合，正在为中国农村发展注入前所未有的活力。","reference":"The booming development of e-commerce is profoundly changing the face of rural China. As the Internet and logistics networks rapidly extend into rural areas, more and more rural residents are selling their agricultural products directly to urban consumers through e-commerce platforms. In recent years, live-streaming commerce, which enables urban consumers to interact with sellers in real time, has become a new way to promote rural development. E-commerce has broken down the information barriers between urban and rural areas and expanded sales channels for agricultural products, helping rural residents increase their incomes and achieve prosperity. The deep integration of the digital economy with rural revitalization is injecting unprecedented vitality into China's rural development."},"cloze":{"passage":"Most financial crises have plenty in common: they tend to start in the banking sector and involve excessive borrowing, together with an asset bubble. The __26__ crisis of 2008 was no different, with the asset bubble focused on US real estate. But my research suggests this crisis had another __27__ cause — that some people in the banking sector were playing or “gaming” the system for their own financial gain. The game being played had several important features. The first was the deliberate complexity of the financial products at its core. Then there are the __28__ biases that permeate decision-making at all levels of the banking industry. Banking often attracts people with certain personality __29__ , including those who are overconfident and take excessive risks. Such people tend to like complexity for its own sake, but they often do not fully understand the __30__ of that complexity for the stability of the financial system as a whole. Often they do not care — they are primarily interested in gaming the system to __31__ their bonuses. The next element is risk. There are parts of the banking sector that will always be __32__ to risk, but many bankers have come to feel immune to its potential impact, because they __33__ that, however recklessly banks behave, governments will always be there to bail them out. Gaming in the banking sector seems virtually impossible to __34__ . The only effective measure to end it would be to make bankers __35__ liable for losses, but no government has ever passed such a law, and no single 4 https://zhenti.burningvocabulary.cn government could do so on its own, since this would immediately cause their entire national banking sector to move wholesale to another jurisdiction.","bank":{"A":"behavioural","B":"eliminate","C":"fragile","D":"global","E":"implications","F":"maximise","G":"overlapping","H":"personally","I":"presume","J":"prone","K":"prototypes","L":"reassure","M":"skeptically","N":"traits","O":"underlying"},"answers":{"26":{"letter":"D","word":"global","pos":"形容词","explanation":"2008年全球金融危机 \\"2008年全球金融危机\\"是常识性固定表述；文本证据同样充分——上句 Most financial crises have plenty in common 谈\\"多数金融危机\\"的共性，本句说这场危机 no different （也不例外），是在把单场危机放进普遍、整体的尺度里讨论，global 与 Most financial crises 的宏阔范围呼应。"},"27":{"letter":"O","word":"underlying","pos":"形容词","explanation":"表层共性之下的根本原因 首段先说这场危机与多数危机有共性（银行业、过度借贷、资产泡沫），随即 But 转折： But my research suggests this crisis had another __(27)__ cause——在众目所见的共性 原因**之外/之下**还有一个\\"根本的\\"原因。underlying（根本的、潜藏的）正好承载 But 的对比：表面原因人尽皆知，underlying cause 才是作者研究的新发现；破折号后\\"银行从 业者为私利操纵系统\\"正是这个深层原因的内容。"},"28":{"letter":"A","word":"behavioural","pos":"形容词","explanation":"行为偏差渗透各级决策 behavioural biases（行为偏差）是行为经济学/金融学的标准术语，指人的系统性心理偏 差；下句 Banking often attracts people with certain personality traits, including those who are overconfident and take excessive risks 的\\"过度自信、冒大险\\"正是 behavioural biases 的具体表现，与空后的 permeate decision-making（渗透各级决策） 浑然一体。"},"29":{"letter":"N","word":"traits","pos":"名词","explanation":"personality traits固定搭配 personality traits（人格特质）是心理学与日常英语的固定搭配；更直接的证据在空后： including those who are overconfident and take excessive risks 用 including 举例 ——过度自信、冒大险正是\\"人格特质\\"的具体内容，例子在给空位下定义。"},"30":{"letter":"E","word":"implications","pos":"名词","explanation":"复杂性对稳定的后果 implications of A for B（A对B的影响/后果）是高频双介词搭配，与空后的 of that complexity for the stability 框架完全吻合；\\"他们并不完全理解那种复杂性对整个金融体 系稳定性的影响\\"，又与下句 Often they do not care 衔接自然——不理解影响，所以不 在乎。"},"31":{"letter":"F","word":"maximise","pos":"动词","explanation":"操纵系统为了奖金最大化 全文主旨即银行家为私利操纵系统：playing or \\"gaming\\" the system for their own financial gain。操纵系统的目的自然是让自己的奖金**最大化**，maximise their bonuses 与 for their own financial gain 同义呼应，主旨与搭配双重锁定。"},"32":{"letter":"J","word":"prone","pos":"形容词","explanation":"be prone to固定搭配 be prone to sth（易于遭受……）是词典级固定搭配，\\"银行业总有些部分永远容易遭受风 险\\"；且与后半句 but many bankers have come to feel immune to its potential impact 的 immune to（对……免疫）形成对照：客观上 prone to risk、主观上 feel immune—— but 转折严丝合缝。"},"33":{"letter":"I","word":"presume","pos":"动词","explanation":"他们认定政府必兜底 that 从句的内容 however recklessly banks behave, governments will always be there to bail them out（无论银行多鲁莽，政府总会救助）正是银行家一种想当然的认定；正因 为 presume 如此，上句 many bankers have come to feel immune to its potential impact（觉得风险伤不到自己）才成立，因果链完整。"},"34":{"letter":"B","word":"eliminate","pos":"动词","explanation":"操纵行为几乎无法消除 主语 Gaming（操纵行为）是空位的逻辑宾语，\\"银行业的操纵行为几乎不可能被__\\"；下句 The only effective measure to end it 的 end it（终结它）正是 eliminate 的同义改写， 语义直接锁定——只有\\"消除/终结\\"才接得上\\"唯一有效办法\\"。"},"35":{"letter":"H","word":"personally","pos":"副词","explanation":"personally liable法律追责搭配 本段谈\\"终结操纵的唯一有效办法是让银行家__对损失负责\\"，下句 but no government has ever passed such a law 表明这是在讲法律层面的追责；personally liable（个人承担法律 责任）是法律英语惯用搭配，\\"追到个人\\"才解释了为何没有政府敢立此法。"}}},"match":{"title":"How do you bring a forest back to life?","paragraphs":{"A":{"en":"Five hundred years ago, forests covered much of the Iberian peninsula. But that soon changed. Centuries of wars and invasions, agricultural expansion and woodcutting for firewood and shipping wiped out most of the woods and transformed places like Matamorisca, a small village in northern Spain, into degraded landscapes.","cn":"五百年前，森林覆盖了伊比利亚半岛的大部分地区。但这种情况很快发生了改变。数百年的战争和入 侵、农业扩张，以及为取暖和造船而砍伐木材，使大部分森林消失，并将西班牙北部的小村庄 Matamorisca等地变成了退化的景观。"},"B":{"en":"The region's dry climate and depleted soils would be a recipe for disaster in your average program to replant trees, but for the Amsterdam-based Land Life Company it's an ideal place. \\"We typically operate where nature does not come back by itself,\\" says Jurrian Ruys, its CEO. \\"We go where there are rougher conditions in terms of weather, with rough or very hot summers.\\" In Matamorisca, they intervened in 17 barren hectares owned by the regional government and peppered them with their signature device: a biodegradable (可生 物 降 解的) cardboard container they call the cocoon which can hold 25 litres of water underground to aid a seedling's first year. Around 16,000 trees, including oaks, ashes, walnuts, rowans, and whitebeams, were planted in May 2018, and the company reports that 96% of them survived that year's burning hot summer without extra irrigation, a critical milestone for a young tree.","cn":"signature device: a biodegradable( 可⽣物降解的 ) cardboard container they call the cocoon which can 该地区干燥的气候和贫瘠的土壤，对于一般的植树造林计划来说将是灾难的根源，但对于总部位于阿 姆斯特丹的Land Life Company而言，这里却是理想之地。该公司的首席执行官Jurrian Ruys说：“我 们通常在自然无法自行恢复的地方开展工作。我们会前往天气条件更为恶劣、夏季较为艰苦或极其炎 热的地方。”在Matamorisca，他们对地方政府拥有的17公顷贫瘠土地进行了干预，并在其中布置了 他们的标志性设备：一种可生物降解的纸板容器，他们称之为“茧”，可以在地下储存25升水，以帮助 幼苗度过第一年。2018年5月，他们种下了约1.6万棵树，包括橡树、白蜡树、核桃树、花楸树和白檀 树。公司报告称，其中96%的树木在当年酷热的夏季中没有额外灌溉也存活了下来，这对幼树而言是 一个关键的里程碑。"},"C":{"en":"\\"Does nature return by itself?\\" asks Arnout Asjes, Land Life Company's chief technology officer, who oversees a mix of drone (无人机) and satellite imagery, big data analysis, soil enhancement, QR (二维码) tagging and site-specific tree configuration designs. \\"Probably, but it can take decades or hundreds of years, so we are speeding things up.\\"","cn":"oversees a mix of drone( ⽆⼈机 ) and satellite imagery, big data analysis, soil enhancement, QR( ⼆维 Land Life Company的首席技术官Arnout Asjes负责统筹无人机和卫星影像、大数据分析、土壤改 良、二维码标记以及因地制宜的树木配置设计。他问道：“自然会自行恢复吗？或许会，但可能需要几 十年甚至几百年，所以我们正在加快这一进程。”"},"D":{"en":"His company belongs to a global movement of organisations trying to save degraded or deforested areas, ranging from fertile tropical lowlands to dry hills in temperate (温带的) regions. Spurred by global biodiversity loss and climate change, these groups are pushing the boundary of how to revive forest cover. \\"It's not a theoretical proposition,\\" says Walter Vergara, a forest and climate specialist at the World Resources Institute (WRI). \\"It requires the right incentives, the right stakeholders, the right analysis and sufficient capital, but it can happen.\\"","cn":"areas, ranging from fertile tropical lowlands to dry hills in temperate( 温带的 ) regions. Spurred by 他的公司属于一个全球性运动，该运动由一系列试图拯救退化或遭到砍伐的地区的组织组成，这些地 区从肥沃的热带低地到温带地区的干燥丘陵不等。在全球生物多样性丧失和气候变化的推动下，这些 组织正在拓展恢复森林覆盖的可能性。世界资源研究所（WRI）的森林与气候专家Walter Vergara 说：“这不是一个理论上的设想。它需要正确的激励机制、正确的利益相关者、正确的分析和充足的资 金，但这是可以实现的。”"},"E":{"en":"How these factors come together for a particular project - and whether saving destroyed woods is even possible - depends on what kind of ecosystem you have in mind. Secondary forests in the Amazon are different from Texas pines recovering after wildfires or the Arctic timber woods that cover much of Sweden. Each provides different reasons for reforestation programs and each has particular needs. In the dry conditions around Matamorisca and similar areas in Spain, Land Life Company worries about rapid desertification (沙漠化). As its focus is on restoring an ecosystem, it works with organisations that don't expect their money back.","cn":"Company worries about rapid desertification( 沙漠化 ). As its focus is on restoring an ecosystem, it 这些因素如何结合到某个具体项目中，以及拯救遭到破坏的森林是否真的可行，取决于你设想的生态 系统类型。亚马孙地区的次生林，与野火后正在恢复的得克萨斯州松林，或覆盖瑞典大部分地区的北 极森林，都各不相同。每种生态系统都有不同的理由促使人们实施重新造林计划，也各自有特别的需 求。在Matamorisca周边及西班牙类似地区的干燥环境中，Land Life Company担心的是迅速发生的 沙漠化。由于该公司的重点是恢复生态系统，因此它与那些不指望收回资金的组织合作。"},"F":{"en":"With around 600 hectares replanted around the world since 2015 and another 1,100 planned for this year, the company's drive fits into the Bonn Challenge, a global effort to restore 150 million hectares of the world's deforested and degraded land by 2020. That's an area roughly the size of Iran or Mongolia. By 2030, the goal is to reach 350 million hectares - 20% more land than India. These targets include both the rehabilitation of forested areas that have lost density or look a bit weak (a process known as \\"restoration\\" in forestry jargon) and the recovery of forest cover in areas where it was completely cleared (what's known as \\"reforestation\\").","cn":"自2015年以来，该公司已在世界各地重新种植了约600公顷土地，今年还计划再种植1100公顷，这项 事业与“波恩挑战”相契合。“波恩挑战”是一项全球性行动，旨在到2020年恢复世界上1.5亿公顷被砍伐 和退化的土地。这一面积大致相当于伊朗或蒙古的国土面积。到2030年，目标是达到3.5亿公顷，比印 度的国土面积多20%。这些目标既包括对森林密度下降或状况有所衰退的林区进行修复（林业术语称 为“恢复”），也包括在森林覆盖曾被完全清除的地区恢复森林覆盖（即所谓的“重新造林”）。"},"G":{"en":"That global target is broken into smaller pieces and takes shape in Latin America as the 20x20 Initiative, an effort to contribute 20 million hectares to the overall goal by initiating small to medium projects with the political backing of governments. Unlike Land Life Company, this region-wide project makes the economic and business case for reforestation, even though they are after biodiversity conservation. \\"You need to bring in private sector money,\\" says WRI's Vergara, who leads the initiative, \\"and that capital needs to see a return on their investment.\\" A study he led predicts Latin America would see an estimated net present value of about $23 bn over a 50-year period if it reaches its goal.","cn":"这一全球目标被分解成更小的部分，在拉丁美洲则以“20x20倡议”的形式展开。这项倡议在各国政府的 政治支持下，通过启动中小型项目，为总体目标贡献2000万公顷土地。与Land Life Company不同， 这一覆盖整个地区的项目着眼于重新造林的经济和商业价值，尽管其目的在于保护生物多样性。负责 领导该倡议的世界资源研究所Vergara说：“你需要引入私营部门的资金，而这些资金需要看到投资回 报。”他领导的一项研究预测，如果拉丁美洲实现这一目标，那么在50年间预计可获得约230亿美元的 净现值。"},"H":{"en":"Money can come from timber sales in sustainably managed forests or from harvesting \\"non-wood products\\" like nuts, oils and fruits from the trees. You can take note of how much carbon dioxide your forest is capturing and sell carbon credits to companies keen to offset their emissions. Or you can even grow the forest hoping that biodiversity will attract ecotourists who'd pay for lodging, birdwatching tours and meals.","cn":"资金可以来自可持续经营森林的木材销售，也可以来自采集树上的坚果、油料和水果等“非木材产 品”。你可以记录森林吸收了多少二氧化碳，并向那些急于抵消自身排放的公司出售碳信用额度。或 者，你甚至可以培育森林，希望生物多样性能够吸引生态旅游者，让他们为住宿、观鸟之旅和餐饮 付费。"},"I":{"en":"Still, these backers are not your high-street bank. Money for the 20x20 Initiative comes mostly from financial organisations with triple goals - a modest return on their investment, environmental benefits and social gains - known as impact investors. Take the German fund 12Tree for instance, one of the 20x20 partners. It put $9.5 million into Cuango, a 1,455-hectare property on the Caribbean coast of Panama that combines a commercial cocoa tree plantation with timber extraction from a sustainably managed secondary forest. With their money, they reforested a former cattle ranch, provided high-quality jobs for the surrounding communities and made a return on their investment.","cn":"不过，这些支持者并不是普通的商业银行。“20x20倡议”的资金主要来自具有三重目标的金融机构：获 得适度的投资回报、取得环境效益以及实现社会收益，这些机构被称为影响力投资者。以德国基金 12Tree为例，它是“20x20倡议”的合作伙伴之一。该基金向Cuango投入了950万美元。Cuango位于巴 拿马加勒比海沿岸，占地1455公顷，将商业可可种植园与从可持续经营的次生林中采伐木材结合起 来。借助这笔资金，他们在一处曾经的牧牛场上重新造林，为周边社区提供了高质量的就业机会，并获 得了投资回报。"},"J":{"en":"Even on land cleared decades ago and currently used by farmers, some crops can coexist with the forest, if you find the right balance. Although not technically reforestation, agroforestry (a system of land use in which harvestable trees or shrubs are grown among or around crops or on pasture land, as a means of preserving or enhancing the productivity of the land) provides an opportunity for small-holder farmers to sustain their livelihoods while adding some forest cover to their farms.","cn":"即使是在数十年前被清理、目前由农民使用的土地上，只要找到适当的平衡，一些农作物也可以与森 林共存。农林业虽然在技术上不属于重新造林，但它是一种土地利用系统，即在农作物之间或周围、 或者牧场上种植可采收的树木或灌木，以保持或提高土地的生产力。它为小农户维持生计提供了机 会，同时也能在农场中增加一定的森林覆盖。"},"K":{"en":"A global project called Breedcafs is studying how trees behave in coffee farms, hoping to find crop varieties that manage to grow under the shade of trees. Coffee grows naturally in such forests, so copying that in farms is taking the crop back to its roots. \\"By reintroducing trees in the landscape, we impact positively humidity, rain capture, soil conservation and biodiversity preservation,\\" says coffee expert Benoît Bertrand, who leads the project from the French Agricultural Research Centre for International Development. Bertrand is analysing which of dozens of coffee varieties fits better for this system. A similar approach can be applied to land with cocoa, vanilla and fruit trees.","cn":"一项名为Breedcafs的全球性项目正在研究树木在咖啡农场中的生长状况，希望找到能够在树荫下生 长的作物品种。咖啡在这类森林中自然生长，因此在农场中复制这种环境，就是让这种作物回归其根 源。该项目由法国国际发展农业研究中心的咖啡专家Benoit Bertrand负责。他说：“通过在景观中重 新引入树木，我们能够积极改善湿度、雨水截留、土壤保护和生物多样性保护。”Bertrand正在分析 数十种咖啡品种，以确定哪一种更适合这一系统。类似的方法也可以应用于种植可可、香草和果树的 土地。"},"L":{"en":"Not every piece of land is fit for reforestation. Vergara's partners look for safe investments, and even Land Life Company only runs major projects in what they consider \\"low-risk\\" countries. \\"We tend to avoid large-scale operations in countries in some parts of the Middle East or Africa where the permanence is not secured,\\" says Ruys.","cn":"并非每一块土地都适合重新造林。Vergara的合作伙伴寻找的是安全的投资，甚至Land Life Company也只在他们认为“低风险”的国家开展大型项目。Ruys说：“在中东或非洲的一些国家，由于 无法确保森林的长期存续，我们往往会避免在那里开展大规模项目。”"},"M":{"en":"But in the right location, perhaps all you need is time. In the Central Pacific of Costa Rica, the 330-hectare National Wildlife Refuge Barú looks nothing like the cattle ranch it was before 1987, when Jack Ewing decided to turn this large estate into an ecotourism destination. Instead of intervening, a friend told him to let nature have its way. Barú's former grazing lands are now thriving woods and the property boasts over 150 hectares of secondary forests with no intervention from humans. In the past 10 years, animals such as howling monkeys, scarlet macaws and even migratory cougars have returned to the refuge's land, boosting tourism and revitalising the ecosystem. Ewing, now 75, explains this success using the words his friend chose three decades ago: \\"In Costa Rica, when you stop managing the shrubs, the jungle comes back for its revenge.\\"","cn":""}},"statements":[{"num":36,"text":"Land Life Company's efforts fit into the global goal to restore millions of hectares of the world's","answer":"F","locateEn":"With around 600 hectares replanted around the world since 2015 and another 1,100 planned for this year, the company's drive fits into the Bonn Challenge, a global effort to restore 150 million hectares of the world's deforested and degraded land by 2020.","locateCn":"自2015年以来，该公司已在全球重植约600公顷土地，今年还计划再植1100公顷；这一 努力契合了「波恩挑战」——一项到2020年恢复全球1.5亿公顷被砍伐与退化土地的全球 目标。","anchor":"强锚点"},{"num":37,"text":"Planting trees or shrubs together with crops can help improve the yield of the land, while offering","answer":"J","locateEn":"Although not technically reforestation, agroforestry (a system of land use in which harvestable trees or shrubs are grown among or around crops or on pasture land, as a means of preserving or enhancing the productivity of the land) provides an opportunity for small- holder farmers to sustain their livelihoods while adding some forest cover to their farms.","locateCn":"虽然严格来说不算重新造林，但农林业（一种土地利用体系，即在作物周围或之间、或牧场 上种植可采收的树木或灌木，以保持或提高土地生产力）为小农提供了在维持生计的同时为 农场增加些许森林覆盖的机会。","anchor":"弱锚点"},{"num":38,"text":"One reforestation project bases its argument on economic benefits and investment returns.","answer":"G","locateEn":"Unlike Land Life Company, this region-wide project makes the economic and business case for reforestation, even though they are after biodiversity conservation. 'You need to bring in private sector money,' says WRI's Vergara, who leads the initiative, 'and that capital needs to see a return on their investment.' A study he led predicts Latin America would see an estimated net present value of about $23bn over a 50-year period if it reaches its goal.","locateCn":"与 Land Life Company 不同，这个覆盖全区域的项目为重新造林提出了经济与商业理由， 尽管他们也追求生物多样性保护。「你需要引入私营部门资金，」主持该倡议的 WRI 的 Vergara 说，「而且这笔资本需要看到投资回报。」他主导的一项研究预测，若目标达成， 拉丁美洲在50年内将获得约230亿美元的净现值。 38.One reforestation project bases its argument on economic benefits and investment returns.","anchor":"强锚点"},{"num":39,"text":"With time, nature may return to its original state without human intervention if the location is","answer":"M","locateEn":"But in the right location, perhaps all you need is time. In the Central Pacific of Costa Rica, the 330-hectare National Wildlife Refuge Baru looks nothing like the cattle ranch it was before 1987, when Jack Ewing decided to turn this large estate into an ecotourism destination. Instead of intervening, a friend told him to let nature have its way. Baru's former grazing lands are now thriving woods and the property boasts over 150 hectares of secondary forests with no intervention from humans.","locateCn":"但在合适的地点，或许你所需要的只是时间。在哥斯大黎加中太平洋地区，330公顷的 Baru 国家野生动物保护区看起来已完全不像1987年之前的那片牧场——当时 Jack Ewing 决定将 这片大产地改为生态旅游目的地。一位朋友告诉他不要干预，让自然自行其是。Baru 曾经 的放牧地如今已是茂盛的林地，该地产拥有超过150公顷未经人类干预的次生林。","anchor":"弱锚点"},{"num":40,"text":"According to a forest and climate expert, the revival of forest cover can take place under the","answer":"D","locateEn":"Spurred by global biodiversity loss and climate change, these groups are pushing the boundary of how to revive forest cover. 'It's not a theoretical proposition,' says Walter Vergara, a forest and climate specialist at the World Resources Institute(WRI). 'It requires the right incentives, the right stakeholders, the right analysis and sufficient capital, but it can happen.'","locateCn":"受全球生物多样性丧失和气候变化的驱使，这些组织正在突破如何恢复森林覆盖的边界。 「这不是一个理论命题，」世界资源研究所（WRI）的森林与气候专家 Walter Vergara 说，「它需要正确的激励、正确的利益相关者、正确的分析和充足的资本，但这是可以实 现的。」","anchor":"强锚点"},{"num":41,"text":"One company runs its major operations exclusively in countries where risks are not high.","answer":"L","locateEn":"Vergara's partners look for safe investments, and even Land Life Company only runs major projects in what they consider 'low-risk' countries. 'We tend to avoid large-scale operations in countries in some parts of the Middle East or Africa where the permanence is not secured,' says Ruys. Vergara","locateCn":"的合作伙伴寻找安全投资，就连 Land Life Company 也只在他们认为「低风险」 的国家开展重大项目。「我们倾向于避免在中东或非洲部分国家开展大规模行动，因为那里 的持久性无法得到保障，」Ruys 说。","anchor":"强锚点"},{"num":42,"text":"Left alone, nature may take scores of years or even centuries to repair itself.","answer":"C","locateEn":"\\"Does nature return by itself?\\" asks Arnout Asjes, Land Life Company's chief technology officer, who oversees a mix of drone and satellite imagery, big data analysis, soil enhancement, QR tagging and site-specific tree configuration designs. \\"Probably, but it can take decades or hundreds of years, so we are speeding things up.\\"","locateCn":"自然能自行恢复吗？Land Life Company 的首席技术官 Arnout Asjes 问道，他负责监 管无人机与卫星图像、大数据分析、土壤改良、二维码标签和因地制宜的树木配置设计。 可能可以，但这需要数十年或数百年，所以我们正在加速这一过程。","anchor":"强锚点"},{"num":43,"text":"Economic returns can be derived from selling timber and non-wood products as well as carbon","answer":"H","locateEn":"Money can come from timber sales in sustainably managed forests or from harvesting 'non- wood products' like nuts, oils and fruits from the trees. You can take note of how much carbon dioxide your forest is capturing and sell carbon credits to companies keen to offset their emissions. Or you can even grow the forest hoping that biodiversity will attract ecotourists who'd pay for lodging, birdwatching tours and meals.","locateCn":"资金可以来自可持续管理森林中的木材销售，或从树上收获「非木材产品」如坚果、油和水 果。你可以记录森林吸收了多少二氧化碳，然后把碳信用卖给希望抵消排放的公司。或者你 甚至可以培育森林，寄望生物多样性会吸引愿意支付住宿、观鸟旅行和餐饮费用的生态旅 游者。","anchor":"强锚点"},{"num":44,"text":"A study is under way across the world to look for crops that can grow among trees.","answer":"K","locateEn":"A global project called Breedcafs is studying how trees behave in coffee farms, hoping to find crop varieties that manage to grow under the shade of trees. Coffee grows naturally in such forests, so copying that in farms is taking the crop back to its roots. 'By reintroducing trees in the landscape, we impact positively humidity, rain capture, soil conservation and biodiversity preservation,' says coffee expert Benoit Bertrand, who leads the project from the French Agricultural Research Centre for International Development. Bertrand is analysing which of dozens of coffee varieties fits better for this system.","locateCn":"一个名为 Breedcafs 的全球项目正在研究咖啡农场中树木的生长情况，希望找到能在树荫下 生长的作物品种。咖啡天然生长于这样的森林中，因此在农场中模仿这种做法等于让作物回 归本源。「通过在景观中重新引入树木，我们积极影响湿度、雨水截留、土壤保护和生物多 样性保护，」在法国农业国际合作研究中心领导该项目的咖啡专家 Benoit Bertrand 说。 Bertrand 正在分析数十种咖啡品种中哪一种更适合这一系统。","anchor":"强锚点"},{"num":45,"text":"Land Life Company's operations are usually located where reforestation is impossible without human","answer":"B","locateEn":"The region's dry climate and depleted soils would be a recipe for disaster in your average program to replant trees, but for the Amsterdam-based Land Life Company it's an ideal place. 'We typically operate where nature does not come back by itself,' says Jurrian Ruys, its CEO. 'We go where there are rougher conditions in terms of weather, with rough or very hot summers.'","locateCn":"该地区干燥的气候和贫瘠的土壤对普通的植树项目来说会是灾难配方，但对总部位于阿姆斯 特丹的 Land Life Company 而言却是理想之地。「我们通常在大自然无法自行恢复的地方 作业，」其首席执行官 Jurrian Ruys 说，「我们去气候条件更恶劣的地方，那里夏季炎热 或酷暑。」 45.Land Life Company's operations are usually located where reforestation is impossible without human intervention.","anchor":"弱锚点"}]},"careful":[{"paragraphs":[{"en":"What does self-discipline look like at work? Sometimes, it's the ability to resist temptation, such as distractions to avoid a particular task. Other times it's the ability to persist with a task when your energy and motivation seem low.","cn":"在工作中，自律是什么样的表现？有时，它是抵制诱惑的能力，比如抵制那些让你逃避某项特定任务的干 扰。还有些时候，它是在精力和动力似乎都很低的时候，仍然坚持完成一项任务的能力。"},{"en":"What do you believe about the nature of your own self-discipline? Is it something that runs on internal energy that is spent with use? Or is it something that is bolstered as you apply it and persist?","cn":"你如何看待自身自律的本质？它是否依靠一种会随着使用而消耗的内在能量运行？还是说，它会在你运用 自律并坚持下去的过程中得到增强？"},{"en":"Your answer matters, as it determines how much self-discipline you experience. For years, research in psychology pointed to self-control as a resource that is depleted with use and needs to be restored through breaks, rest, or sleep. More recently, however, research points to the importance of mindset. If you view self-discipline as an expendable resource, your willpower tends to fade with use. If you believe that exercising your self-control strengthens and fuels it, that is more likely to be your experience as you resist temptation or push yourself to get something done that is not appealing.","cn":"你的答案很重要，因为它决定了你能体验到多少自律。多年来，心理学研究认为，自我控制是一种会因使 用而消耗、需要通过休息、放松或睡眠来恢复的资源。然而，近来的研究更加重视思维方式的重要性。如 果你把自律看作一种会耗尽的资源，你的意志力往往会随着使用而减弱。如果你相信运用自我控制能够 增强并补充它，那么当你抵制诱惑，或迫使自己完成一件并不吸引人的事情时，你更有可能获得这样的 体验。"},{"en":"If you don't already view self-discipline as a force that feeds itself, what might you do? Reflect on times that you had initial difficulty resisting temptation, getting started on something, or sticking with it, but pushed ahead and accomplished the task or met the goal. That's the kind of experience we're talking about with this particular belief about self-discipline, and you've already had such an experience, so you've shown that it's possible. When you feel your willpower and motivation fading, remind yourself of those previous experiences and imagine the same happening now.","cn":"如果你还没有把自律看作一种能够自我补充的力量，可以做些什么呢？回想一下这样的时刻：起初你很难 抵制诱惑、开始做某件事，或者坚持做下去，但后来你还是继续努力，完成了任务或实现了目标。这正是 我们所说的关于自律的这种特定信念所对应的经历，而你已经有过这样的经历，所以你已经证明了这是可 能的。当你感到意志力和动力逐渐消退时，提醒自己想起以往的这些经历，并想象现在也会发生同样的 情况。"},{"en":"What if your experiences have always seemed to indicate that your self-control diminishes with use, and you need breaks to recharge? There's nothing wrong with that as long as you can afford to take those breaks. If not, remind yourself that not everyone experiences self-discipline as a depletable resource and that your experience might be different if you focus on gathering more energy at this point rather than focusing on how difficult it is to continue or the need for a break.","cn":"如果你的经历一直表明，你的自我控制会随着使用而减弱，需要通过休息来充电，那该怎么办？只要你有 条件休息，这本身没有什么问题。如果没有条件，那么就提醒自己，并非每个人都会把自律体验为一种会 耗尽的资源；如果此时你把注意力放在积蓄更多能量上，而不是关注继续下去有多么困难或认为自己需要 休息，你的体验可能会有所不同。"},{"en":"Also, if you know someone who is a role model of self-discipline, picture that person in your situation, persisting in the task. Regardless of how you do it, as you push forward to continue to accomplish progress, be sure to mentally reinforce yourself by taking pride in your ability to exert more willpower as you persist.","cn":"此外，如果你认识一位自律方面的榜样，可以想象那个人处在你的情境中，坚持完成这项任务。无论你采 用什么方式，当你继续向前、不断取得进展时，一定要通过为自己能够在坚持过程中发挥出更强的意志力 而感到自豪，在心理上不断强化自己。"},{"en":"The benefits of exerting willpower are cumulative. Your self-discipline is akin to a muscle, and each time you resist temptation or persist in a task despite a lack of motivation, you strengthen that muscle, leading to less effort and resistance in similar instances in the future.","cn":"发挥意志力所带来的益处会不断累积。你的自律就像一块肌肉，每当你抵制诱惑，或在缺乏动力的情况下 仍坚持完成一项任务时，你都会锻炼并强化这块肌肉，从而使自己在今后遇到类似情况时付出更少的努 力，也能减少阻力。"}],"questions":[{"num":46,"prompt":"What plays an important role in determining how much self-discipline people experience?","options":["Their belief about the nature of motivation.","Their use of internal energy for persisting.","Their conception of self-discipline.","Their ability to resist temptation."],"answer":"C","qtype":"细节题","locateEn":"Your answer matters, as it determines how much self-discipline you experience.","locateCn":"你的答案很重要，因为它决定了你体验到多少自律。","translation":""},{"num":47,"prompt":"What did years of research suggest about self-discipline?","options":["It is a depletable resource.","It is bolstered through use.","Its strength is dependent on willpower.","Its exercise is an exhausting experience."],"answer":"A","qtype":"细节题","locateEn":"For years, research in psychology pointed to self-control as a resource that is depleted with use and needs to be restored through breaks, rest, or sleep.","locateCn":"多年来，心理学研究把self-control视为一种会随使用而耗尽、需要通过休息、睡眠来恢复 的资源。","translation":""},{"num":48,"prompt":"Why does the author ask us to reflect on our experience of meeting the goal despite initial difficulty?","options":["To show the urgency of abandoning outdated beliefs about self-control.","To show the feasibility of viewing self-discipline as a force fueling itself.","To support the argument for persistence in workplace accomplishments.","To add evidence to consistent findings in previous psychological research."],"answer":"B","qtype":"细节题","locateEn":"Reflect on times that you had initial difficulty resisting temptation, getting started on something, or sticking with it, but pushed ahead and accomplished the task or met the goal. That's the kind of experience we're talking about with this particular belief about self- discipline, and you've already had such an experience, so you've shown that it's possible.","locateCn":"回想那些你起初难以抵制诱惑、难以开始或难以坚持，但最终推进并完成任务或达成目标的 时刻。这正是我们所说的关于自律的那种特定信念所对应的体验，而且你已经有过这样的体 验，所以你已证明这是可能的。","translation":""},{"num":49,"prompt":"What are we advised to do if we cannot afford to take breaks to recharge?","options":["Figure out what has gone wrong.","Focus on the hardest part of our task.","Exert ourselves to go on with the work.","Gather new energy from people around."],"answer":"C","qtype":"细节题","locateEn":"If not, remind yourself that not everyone experiences self-discipline as a depletable resource and that your experience might be different if you focus on gathering more energy at this point rather than focusing on how difficult it is to continue or the need for a break.","locateCn":"如果不能休息，提醒自己并非所有人都把自律体验为会耗尽资源；如果你此刻专注于积聚更 多能量，而不是专注于继续有多难或需要休息，你的体验可能会不同。","translation":""},{"num":50,"prompt":"Why does the author compare our self-discipline to a muscle?","options":["The more it is applied, the more resistance it encounters.","The more it is exerted, the more proud we become.","The more it is enforced, the stronger our willpower proves.","The more it is exercised, the more strengthened it gets."],"answer":"D","qtype":"细节题","locateEn":"Your self-discipline is akin to a muscle, and each time you resist temptation or persist in a task despite a lack of motivation, you strengthen that muscle, leading to less effort and resistance in similar instances in the future.","locateCn":"你的自律 akin to 肌肉，每次你抵制诱惑或在缺乏动力时坚持任务，你都在强化那块肌肉， 从而在未来类似情况下减少努力和阻力。","translation":""}]},{"paragraphs":[{"en":"Smartphones have always posed challenges for parents of teens. From social media apps to excessive screen time, the digital world is as threatening as the physical.","cn":"智能手机一直给青少年父母带来挑战。从社交媒体应用到过度使用屏幕，数字世界和现实世界一样具有威 胁性。"},{"en":"A new study shows that about half of parents of teens are worried about their teens being exposed to explicit content online. This is a valid concern, of course. But there are ways to alleviate the spread of explicit content, from changing the settings in their kids' phone to monitoring such content with apps like Bark.","cn":"一项新的研究显示，大约一半的青少年父母担心自己的孩子会在网上接触到露骨内容。当然，这种担忧是 合理的。但是，有一些方法可以减缓露骨内容的传播，比如更改孩子手机中的设置，或使用 Bark 等应用 监控这类内容。"},{"en":"Just as alarming, if not more so, is that the amount of time teens spend on social media can lead to anxiety and depression.","cn":"同样令人担忧，甚至更加令人担忧的是，青少年花在社交媒体上的时间可能会导致焦虑和抑郁。"},{"en":"Excessive screen time has detrimental effects, for a lot of obvious reasons. Constant media consumption inhibits healthy activities associated with childhood, like spending time outside, exercising, talking to friends and family. If it interferes with sleep, that's even worse.","cn":"过度使用屏幕会产生不利影响，原因有很多，而且显而易见。持续接触媒体会妨碍童年时期与健康相关的 活动，例如待在户外、锻炼以及与朋友和家人交谈。如果它还干扰睡眠，那就更糟糕了。"},{"en":"Ample research shows too much smartphone use produces significant anxiety, depression, and feelings of isolation in teens. Teens log on to social media or spend time online trying to make connections, but end up feeling more alone and sadder than ever. Faceless communication not only produces feelings of isolation and loneliness but increases instances of online bullying and susceptibility to criminal conducts.","cn":"大量研究表明，过度使用智能手机会使青少年产生严重的焦虑、抑郁和孤立感。青少年登录社交媒体或上 网，试图建立联系，但最终却比以往任何时候都感到更加孤独和悲伤。无面对面的交流不仅会产生孤立感 和孤独感，还会增加网络欺凌事件以及受犯罪行为影响的可能性。"},{"en":"Though I've banned most social media, I've still battled smartphone time with my own kids. A lot of the time I wish I could throw my kids' smartphones into the nearest lake. The convenience of communication - when they need a ride home from school after practice, for instance - often feels like it isn't worth the battle to keep their screen time low and productive, and continue to encourage \\"real-life\\" activities outside and with friends and family. I understand the addiction and often tell them I'm not sure how I would have handled having a smartphone as a teen. As an adult, I too, struggle with overuse.","cn":"虽然我已经禁止使用大多数社交媒体，但我仍然一直在和自己的孩子争论使用智能手机的时间。很多时 候，我真希望能把孩子们的智能手机扔进最近的湖里。通信的便利性——比如他们课外活动结束后需要搭 车回家时——常常让人觉得，为了控制他们的屏幕使用时间，使其保持较低水平并发挥积极作用，同时继 续鼓励他们在户外以及与朋友和家人进行“现实生活”活动，并不值得这样争斗。我理解这种成瘾，而且常 常告诉他们，我不知道自己在青少年时期拥有一部智能手机会如何应对。作为一个成年人，我也在努力应 对过度使用的问题。"},{"en":"In a recent TV interview to promote a new film about a mother and daughter navigating social media use, actress Kate Winslet expressed her view on teens and social media - and her concern mirrors the trends. \\"I do definitely feel that the world of social media is frightening to parents because we don't really know what's there,\\" she said. \\"We don't know how our children are using it. We don't know the effects that it's really having on them.\\"","cn":"在最近一次为宣传一部讲述母女共同应对社交媒体使用问题的新电影而进行的电视采访中，女演员凯特·温 斯莱特表达了她对青少年和社交媒体的看法，而她的担忧与相关趋势相一致。她说：“我确实觉得，社交 媒体的世界令父母感到害怕，因为我们并不真正知道那里有什么。我们不知道自己的孩子是如何使用它 的。我们不知道它究竟会对他们产生什么影响。”"},{"en":"I don't think the US government should regulate social media and teen smartphone use, but it is a vital topic for parents to understand and take seriously. Unfortunately, now, parents don't just have to worry about real-world dangers, but all the ones sneaking online and the effects they have on teenagers and their mental health.","cn":"我认为美国政府不应监管社交媒体和青少年使用智能手机的问题，但这是一个父母必须了解并认真对待的 重要话题。遗憾的是，如今父母不仅要担心现实世界中的危险，还要担心所有悄悄潜入网络的危险，以及 这些危险对青少年及其心理健康造成的影响。"}],"questions":[{"num":51,"prompt":"What do around half of parents of teens do according to a new study?","options":["They set their kids' phones to filter out obscene information.","They try to alleviate the spread of explicit scenes on the internet.","They feel concerned about their kids' viewing indecent content online.","They strive to prevent their kids from spending excessive screen time."],"answer":"C","qtype":"细节题","locateEn":"A new study shows that about half of parents of teens are worried about their teens being exposed to explicit content online.","locateCn":"一项新研究显示，约半数青少年父母担心自己的孩子在网上接触露骨内容。","translation":""},{"num":52,"prompt":"What does a large amount of research show about teens' excessive smartphone use?","options":["It allows them less time for meaningful activities.","It renders them more lonely and low-spirited.","It gives them less time for social interactions.","It makes them more alert to online bullying."],"answer":"B","qtype":"细节题","locateEn":"Ample research shows too much smartphone use produces significant anxiety, depression, and feelings of isolation in teens. Teens log on to social media or spend time online trying to make connections, but end up feeling more alone and sad than ever.","locateCn":"大量研究表明，过度使用智能手机会给青少年带来严重的焦虑、抑郁和孤独感。青少年登录 社交媒体或上网试图建立联系，但最终感到比以往更加孤独和悲伤。","translation":""},{"num":53,"prompt":"What do we learn about the author's feelings regarding smartphones and screen time?","options":["They are deep-seated.","They are instinctive.","They are unique.","They are mixed."],"answer":"D","qtype":"态度题","locateEn":"","locateCn":"","translation":""},{"num":54,"prompt":"What does actress Kate Winslet think about the world of social media?","options":["It poses increasing challenges to parents trying to ensure internet safety.","It scares parents because they don't really know what is on the screen.","It is a sphere difficult for parents and their teens to navigate.","It is full of uncertainties frightful to parents and their teens."],"answer":"B","qtype":"细节题","locateEn":"\\"I do definitely feel that the world of social media is frightening to parents because we don't really know what's there,\\" she said.","locateCn":"她（Kate Winslet）说：我确实觉得社交媒体世界对父母来说很可怕，因为我们真的不知道 那里面有什么。","translation":""},{"num":55,"prompt":"What message does the author try to convey in the last paragraph?","options":["Parents have to be concerned about dangers to their teens in both real and virtual worlds.","Governments have responsibilities in regulating social media and teens' smartphone use.","Parents should provide guidance to their teens in the use of social media.","Online dangers are as serious as problems with teenagers' mental health."],"answer":"A","qtype":"主旨题","locateEn":"","locateCn":"","translation":""}]}],"listening":[{"kind":"conversation","segments":[{"speaker":"W","en":"Hi, Frank, are you working through your lunch hour again?","cn":"嗨，弗兰克，你又在午餐时间工作吗？"},{"speaker":"M","en":"No, not at all. It's my 10th wedding anniversary next week, and I promised Jane that I would book a city break for us, as I have annual leave to take, and it would be nice to celebrate somewhere warm. So, I'm trying to book something in Barcelona.","cn":"不，完全不是。我和简下周要过结婚十周年纪念日了，我答应过她要为我们预订一次城市短途旅行， 因为我还有年假要休，而且能找个温暖的地方庆祝一下也不错。所以，我正在设法预订去巴塞罗那的 行程。"},{"speaker":"W","en":"That sounds so romantic. I adore Barcelona. It's such a fabulous cosmopolitan city. There's so much to do there, excellent food, and that cathedral that they are still building after about 150 years. Very cool.","cn":"听起来真浪漫。我非常喜欢巴塞罗那。那是一座非常棒的国际化城市。那里有很多事情可做，美食也 很棒，还有那座已经修建了大约150年、至今仍在建造的教堂。太酷了。"},{"speaker":"M","en":"I know. But the anniversary is looming, and I'm still scrambling to find accommodation. Everything is either wildly expensive or already fully booked. I'm starting to feel a bit frantic.","cn":"我知道。但纪念日就要到了，我还在手忙脚乱地找住宿。要么贵得离谱，要么已经全部订满。我开始 有点慌了。"},{"speaker":"W","en":"Well, if you are going for a whole week, why don't you do a couple of nights in somewhere really glamorous, and then do the rest of the week a bit further up the coast, where the accommodation is cheaper, and that will offset the cost of the expensive place?","cn":"这样吧，如果你们要去整整一周，为什么不先在一个非常豪华的地方住几个晚上，然后把剩下的时间 安排在海岸线再往北一点的地方，那里住宿更便宜，这样就能抵消住昂贵地方的费用了？"},{"speaker":"M","en":"That might be a good plan. It's not too expensive to rent a car, so we could still drive into the city. Yes, there are lots of places outside the city that have pools and are all inclusive, so we wouldn't even need to pay for food or drinks. I'll send a query now about the dates we're interested in.","cn":"这或许是个不错的计划。租车也不算太贵，所以我们还是可以开车进城。对了，城外有很多地方带游 泳池，而且提供全包服务，这样我们连吃饭和饮料的钱都不用另外付了。我现在就发个咨询，问问我们感 兴趣的日期是否有空。"},{"speaker":"W","en":"That sounds perfect. I'm sure that Jane will be absolutely thrilled to bits. I really do recommend visiting that cathedral. You can go all the way up to the top of it, but you need to go up a really steep spiral staircase to get there.","cn":"听起来太完美了。我相信简一定会高兴坏的。我真的很推荐去参观那座教堂。你们可以一直登到顶 部，但要到那里必须爬一段非常陡的螺旋楼梯。"},{"speaker":"M","en":"Considering Jane is terrified of heights, I think if I tried to make her do that, I would come back divorced. Thanks for the help though; it was turning into a logistical nightmare.","cn":"考虑到简恐高，我要是想让她去爬那个，我回来时可能就已经离婚了。不过还是谢谢你的帮助；这件 事本来都快变成一场后勤噩梦了。"}],"questions":[{"prompt":"What is the man planning to do?","translation":"这个男人计划做什么？","options":["Celebrate his 10th wedding anniversary.","Celebrate his promotion in Barcelona.","Give his wife a pleasant surprise.","Ask for leave to visit Barcelona."],"answer":"A","qtype":"细节题","locateEn":"It's my 10th wedding anniversary next week, and I promised Jane that I would book a city break for us, as I have annual leave to take, and it would be nice to celebrate somewhere warm.","locateCn":"下周是我结婚十周年纪念日，我答应 Jane 会给我们订一次城市短途旅行，因为我有年假要 休，而且去个暖和的地方庆祝会很好。","signal":"承诺句+原因铺陈。男士用 I promised Jane that I would book a city break for us 直接","num":1},{"prompt":"Why is the man starting to feel a bit frantic?","translation":"这个男人为什么开始感到有些慌乱？","options":["He is unable to find some inexpensive accommodation.","There are few warm places to go at this time of the year.","There is so much for him to do before going on vacation.","He is afraid Barcelona may not be so fabulous as expected."],"answer":"A","qtype":"细节题","locateEn":"But the anniversary is looming, and I'm still scrambling to find accommodation. Everything is either wildly expensive or already fully booked. I'm starting to feel a bit frantic.","locateCn":"但纪念日越来越近，我还在拼命找住宿。要么贵得离谱，要么已经订满。我开始有点慌了。","signal":"问题铺陈+情绪词。I'm still scrambling to find accommodation 点明困难，Everything","num":2},{"prompt":"What does the woman suggest the man do?","translation":"这个女人建议这个男人做什么？","options":["Rent a car to drive into the city and scenic spots so as to save the expenses on transportation.","Spend a couple of nights in a glamorous hotel and the rest of the week in inexpensive places.","Find all-inclusive accommodation to eliminate the need to pay for food and drinks.","Stay in a hotel away from the coast where the accommodation is less expensive."],"answer":"B","qtype":"细节题","locateEn":"Well, if you are going for a whole week, why don't you do a couple of nights in somewhere really glamorous, and then do the rest of the week a bit further up the coast, where the accommodation is cheaper, and that will offset the cost of the expensive place?","locateCn":"嗯，如果你要去一整周，为什么不先找家很华丽的地方住两晚，然后剩下的时间住到海岸更 北一点的地方，那里住宿更便宜，可以抵消贵地方的费用。","signal":"建议句型 why don't you。why don't you do a couple of nights in somewhere really","num":3},{"prompt":"What does the man say about his wife Jane?","translation":"这个男人怎样评价他的妻子简？","options":["She is sure to like the cathedral.","She is a romantic at heart.","She is no good at logistics.","She is scared of heights."],"answer":"D","qtype":"细节题","locateEn":"Considering Jane is terrified of heights, I think if I tried to make her do that, I would come back divorced.","locateCn":"考虑到 Jane 恐高，我觉得如果我硬让她上去，回来就得离婚了。","signal":"人物评价形容词 terrified。Jane is terrified of heights 直接给出 Jane 的特征，是题干所","num":4}]},{"kind":"conversation","segments":[{"speaker":"W","en":"Hey there, Paul. How's it going?","cn":"嗨，保罗。最近怎么样？"},{"speaker":"M","en":"Hi, Suzanne. Just keeping busy with the usual stuff, filling prescriptions, talking to patients about their medications, that kind of thing. How about you?","cn":"嗨，苏珊。就是忙着做平常的事，开处方药、和患者聊聊他们的用药情况之类的。你呢？"},{"speaker":"W","en":"Same here, although I did have an interesting case come in this morning. A patient came in, inquiring about a medication that had a potential interaction with another medication she was already taking.","cn":"我也一样，不过今天早上来了一个挺有意思的病例。一位患者来咨询一种药，而这种药可能会和她已 经在服用的另一种药产生相互作用。"},{"speaker":"M","en":"Oh, that's always tricky. What did you do?","cn":"哦，这种情况总是很棘手。你怎么处理的？"},{"speaker":"W","en":"I explained the issue to her as best I could, and recommended she double-check with her doctor. And you know what? She actually followed my advice, and the doctor ended up switching the patient's medication.","cn":"我尽可能向她解释了这个问题，并建议她再向医生确认一下。你猜怎么着？她真的听从了我的建议， 最后医生给这位患者换了药。"},{"speaker":"M","en":"Ah, that's great. You must feel quite accomplished.","cn":"啊，那太好了。你一定很有成就感。"},{"speaker":"W","en":"Totally. These moments are the highlights of my routine work, employing my pharmaceutical expertise to the benefit of people's health and well-being.","cn":"完全是。这些时刻是我日常工作中最精彩的部分，运用我的药学专业知识来促进人们的健康和福祉。"},{"speaker":"M","en":"I fully agree. Unfortunately, the opposite is true when the patient is too stubborn and they refuse to listen to us.","cn":"我完全同意。遗憾的是，当患者太固执、不肯听我们的话时，情况就正好相反。"},{"speaker":"W","en":"So true. In other developments, we've had a lot of people coming in to get their flu shots, which is always good to see.","cn":"确实如此。另外，最近有很多人来接种流感疫苗，这总是件令人高兴的事。"},{"speaker":"M","en":"Good, good. I've been working on a new medication therapy management program for our patients with chronic conditions. It helps patients manage their medications more effectively.","cn":"很好，很好。我一直在为患有慢性疾病的患者制定一个新的药物治疗管理项目，帮助患者更有效地管 理他们的用药。"},{"speaker":"W","en":"That sounds interesting.","cn":"听起来很有意思。"},{"speaker":"M","en":"We review all of their medications, and make sure that they're taking them as prescribed. We also look for any potential drug interactions or side effects. Patient response has so far been very positive. Some have reported seeing improvements in their health, which is really rewarding to see.","cn":"我们会检查他们所有的药物，确保他们按照处方服用。我们还会查找任何潜在的药物相互作用或副 作用。到目前为止，患者的反响非常积极。有些人说自己的健康状况有所改善，看到这一点真的很令人 欣慰。"},{"speaker":"W","en":"That's great to hear. Do you use text message reminders?","cn":"听到这个真好。你们会使用短信提醒吗？"},{"speaker":"M","en":"Yes, absolutely.","cn":"是的，当然会。"},{"speaker":"W","en":"It's a great idea. Medication non-adherence is a big problem, especially for older patients.","cn":"这是个很好的主意。用药依从性差是个大问题，尤其是对老年患者来说。"},{"speaker":"M","en":"We're still in the early stages of the program, but I'm hopeful that it will make a real difference for our patients.","cn":"这个项目还处于早期阶段，但我希望它能真正改善我们患者的情况。"}],"questions":[{"prompt":"What do we learn about the speakers?","translation":"我们了解到关于说话者的什么情况？","options":["They often share each other's experiences.","They enjoy interacting with patients.","They always do things tricky.","They are both pharmacists."],"answer":"D","qtype":"细节题","locateEn":"Hi, Suzanne. Just keeping busy with the usual stuff, filling prescriptions, talking to patients about their medications, that kind of thing.","locateCn":"嗨，苏珊娜。就是忙着平常的活儿，配药、跟病人聊他们的用药情况，诸如此类的事。","signal":"工作内容即身份。男性说话者在开场问候后直接描述日常工作：filling prescriptions,","num":5},{"prompt":"What does the woman say about an interesting case she had?","translation":"关于她遇到的一起有趣的病例，女子说了些什么？","options":["The doctor ended up admitting his mistake.","The patient consulted another doctor.","The patient actually took her advice.","The doctor double-checked with her."],"answer":"C","qtype":"细节题","locateEn":"I explained the issue to her as best I could, and recommended she double-check with her doctor. And you know what? She actually followed my advice, and the doctor ended up switching the patient's medication.","locateCn":"我尽可能向她解释了这个问题，并建议她和医生再确认一下。你知道吗？她真的听从了我的 建议，医生最终更换了病人的药物。","signal":"强调词后出结果。女士先说建议内容，然后用 And you know what? 引出关键结果，再用","num":6},{"prompt":"What does the man say he has been working on?","translation":"男子说他一直在进行什么工作？","options":["A proposal for applying flu shots more effectively.","A new medication therapy management program.","A novel strategy to persuade stubborn patients.","A therapy for patients with similar conditions."],"answer":"B","qtype":"细节题","locateEn":"Good, good. I've been working on a new medication therapy management program for our patients with chronic conditions. It helps patients manage their medications more effectively.","locateCn":"好，好。我一直在为我们的慢性病病人开发一个新的药物治疗管理项目。它帮助病人更有效 地管理他们的药物。","signal":"题干关键词复现。题干中的 has been working on 与录音中的 I've been working on 直接","num":7},{"prompt":"What is a big problem, especially for older patients according to the woman?","translation":"据女子所说，尤其是对老年患者而言，一个大问题是什么？","options":["Inability to send text messages.","Distrust in pharmaceutical experts.","Medication non-adherence.","Need for constant reminding."],"answer":"C","qtype":"细节题","locateEn":"Medication no
