n-adherence is a big problem, especially for older patients.","locateCn":"用药不依从是一个大问题，尤其对老年患者来说。","signal":"判断句与题干一一对应。女士直接说 Medication non-adherence is a big problem,","num":8}]},{"kind":"passage","segments":[{"speaker":"","en":"In America, at least, passion is a word that often comes up on job descriptions and in interviews. On the whole, passionate people are thought of in a positive light and considered likely to achieve their goals. But when it comes to predicting achievement, has the importance of passion been overstated?","cn":"至少在美国，求职描述和面试中经常会提到“热情”一词。总的来说，人们对有热情的人持正面看法，认为 他们很可能实现自己的目标。但说到预测成就时，热情的重要性是否被夸大了？"},{"speaker":"","en":"According to a new study from Stanford University, passion may be less important in certain cultures, and the fact that passion is often seen as a key to achievement may reflect a distinctly Western model of motivation. The chief factor explored in the study was how individualistic a society was. In individualistic cultures, the researchers assert, people are more motivated by pursuing paths related to their passions, but those in collectivistic cultures are more likely to see themselves as part of a network. They often place fulfilling obligations to others above focusing on their own interests.","cn":"根据斯坦福大学的一项新研究，热情在某些文化中的重要性可能较低，而热情常被视为成就关键这一事 实，或许反映了一种明显具有西方特色的动机模式。研究考察的主要因素是一个社会的个人主义程度。研 究人员断言，在个人主义文化中，人们更容易受到追求与自身热情相关道路的激励；而集体主义文化中的 人则更可能将自己视为某个社会网络的一部分。他们往往更重视履行对他人的义务，而不是专注于自身的 兴趣。"},{"speaker":"","en":"The researchers looked at data from nearly 60 countries. They found that in science subjects, passion was positively correlated with academic achievements. Higher levels of enjoyment and interest also bolstered test scores.","cn":"研究人员考察了来自近60个国家的数据。他们发现，在科学类学科中，热情与学业成就呈正相关。更高程 度的愉悦感和兴趣也会提高测试成绩。"},{"speaker":"","en":"But the strength of this correlation wasn't the same across cultures. Those in individualistic societies such as the U.S., Australia, and the UK showed a stronger link between passion and achievement. The effect of passion on performance was more subtle for those in more collectivistic societies such as Colombia or Thailand.","cn":"但这种相关性的强度在不同文化之间并不相同。在美国、澳大利亚和英国等个人主义社会中，热情与成 就之间的联系更为紧密。而对于哥伦比亚或泰国等更加集体主义的社会而言，热情对表现的影响则更为 微妙。"},{"speaker":"","en":"These findings were mirrored in achievement in both mathematics and reading. It's clear from the findings that passion isn't the only thing that motivates people to achieve their goals.","cn":"数学和阅读方面的成就也呈现出同样的情况。从这些研究结果可以清楚看出，热情并不是激励人们实现目 标的唯一因素。"}],"questions":[{"prompt":"What are passionate people considered likely to do in America?","translation":"在美国，人们认为有激情的人可能会做什么？","options":["Accomplish their goals.","View things positively.","Overstate their importance.","Dominate job interviews."],"answer":"A","qtype":"细节题","locateEn":"On the whole, passionate people are thought of in a positive light and considered likely to achieve their goals.","locateCn":"总体而言，有热情的人被认为形象正面，且被认为很可能实现他们的目标。","signal":"直接描述句。passionate people are thought of in a positive light and considered","num":9},{"prompt":"What does a new study from Stanford show about the importance of passion in","translation":"斯坦福大学的一项新研究表明，热情在预测成就方面的重要性如何？","options":["It reflects a strong sense of obligation to others.","It signifies a universal model of motivation.","It may differ in various cultures.","It may have been underestimated."],"answer":"C","qtype":"细节题","locateEn":"According to a new study from Stanford University, passion may be less important in certain cultures, and the fact that passion is often seen as a key to achievement may reflect a distinctly Western model of motivation.","locateCn":"根据斯坦福大学的一项新研究，热情在某些文化中可能不那么重要，而且热情常被视为成就 关键这一事实，可能反映的是一种明显西方化的动机模式。","signal":"研究来源+结论句。According to a new study from Stanford University是典型的研究结","num":10},{"prompt":"What did the researchers find about the effect of passion on academic achievement for","translation":"对于生活在更加集体主义社会中的人来说，研究人员发现热情对学业成就的影响如何？","options":["It was under-investigated.","It was more predictable.","It was taken for granted.","It was more subtle."],"answer":"D","qtype":"细节题","locateEn":"The effect of passion on performance was more subtle for those in more collectivistic societies such as Colombia or Thailand.","locateCn":"对于那些更具集体主义文化的社会（如哥伦比亚或泰国）的人来说，热情对表现的影响更为 微妙。","signal":"对比结论句。The effect of passion on performance was more subtle for those in","num":11}]},{"kind":"passage","segments":[{"speaker":"","en":"Why does nature create patterns? The reason patterns often appear in nature is simple: the same basic physical or chemical processes occur in many pattern substances and organisms as they form. Whether in plants and animals or rocks, foams and ice crystals, the intricate patterns that happen in nature come down to what's happening at the level of atoms and molecules.","cn":"为什么自然界会形成各种图案？图案之所以经常出现在自然界中，原因很简单：在许多形成图案的物质和 生物中，相同的基本物理或化学过程会反复发生。无论是在植物和动物中，还是在岩石、泡沫和冰晶中， 自然界中出现的复杂图案，归根结底都与原子和分子层面发生的事情有关。"},{"speaker":"","en":"A pattern in nature is any regularly repeated arrangement of shapes or colors. Some of the most striking examples include the six-sided arrays of rocks at Giant's Causeway in the United Kingdom, and the colorful stripes and spots on tropical fish. Patterns like these begin to form at a small scale when materials undergo processes like drying, freezing, wrinkling, diffusing and reacting. Those changes then give rise to complex patterns at a larger scale that people can see.","cn":"自然界中的图案，是指形状或颜色有规律地重复排列的任何形式。其中一些最引人注目的例子包括英国巨 人之路上六边形的岩石阵列，以及热带鱼身上色彩斑斓的条纹和斑点。这类图案在材料经历干燥、冻结、 起皱、扩散和反应等过程时，会先在微小尺度上开始形成。随后，这些变化会在更大尺度上产生人们能够 看见的复杂图案。"},{"speaker":"","en":"Imagine delicate frozen crystals on a window during winter. What creates that pattern? When water freezes, its molecules begin clustering together. Water molecules have a particular bent shape that causes them to stack into clusters as they freeze. As the cluster grows, many outside factors, including humidity and temperature, begin to affect its overall shape. If the water is freezing on a window, for example, random imperfections on the glass surface affect the stacking and create the larger pattern.","cn":"想象一下冬天窗户上精致的冰晶。是什么形成了这种图案？水结冰时，其中的分子开始聚集在一起。水分 子具有特殊的弯曲形状，这使它们在冻结时会堆叠成团。随着团簇不断增大，包括湿度和温度在内的许多 外部因素开始影响它的整体形状。例如，如果水是在窗户上结冰，玻璃表面的随机瑕疵就会影响分子的堆 叠，并形成更大的图案。"},{"speaker":"","en":"But scientists do not always know the purpose of a pattern, or even if there is one. The molecular processes involved are simple enough that they might generate a pattern by coincidence.","cn":"但科学家并不总是知道某种图案的作用，甚至不知道它是否具有作用。相关的分子过程足够简单，因此它 们可能只是偶然形成了某种图案。"}],"questions":[{"prompt":"What does the passage say is a pattern in nature?","translation":"文章所说的自然界中的模式是什么？","options":["It is any incidental happening in plants and animals or ice crystals.","It is any basic physical or chemical work in designing substances.","It is any symmetrical and colorful stripes or spots on organisms.","It is any regularly repeated arrangement of shapes or colors."],"answer":"D","qtype":"细节题","locateEn":"A pattern in nature is any regularly repeated arrangement of shapes or colors.","locateCn":"自然界中的图案是指形状或颜色的任何有规律重复排列。","signal":"定义句直接作答。句中 A pattern in nature is 是典型的下定义句式，题干问 what is a","num":12},{"prompt":"What gives rise to complex patterns at a larger scale?","translation":"是什么产生了更大尺度上的复杂图案？","options":["Materials undergoing certain processes.","Materials exposed to various natural forces.","Materials impacted by any change of molecules.","Materials going through extremely radical transformations."],"answer":"A","qtype":"细节题","locateEn":"Patterns like these begin to form at a small scale when materials undergo processes like drying, freezing, wrinkling, diffusing and reacting. Those changes then give rise to complex patterns at a larger scale that people can see.","locateCn":"这类图案在小尺度上开始形成，当材料经历干燥、冻结、起皱、扩散和反应等过程时。这些 变化随后产生了人们能看到的大尺度复杂图案。","signal":"过程链中的因果承接。前句讲 materials undergo processes，后句用 Those changes","num":13},{"prompt":"What does the example of frozen crystals on a window show?","translation":"窗户上冻结的晶体这一例子说明了什么？","options":["The beauty of molecular clustering.","The way for appreciating patterns.","The creation of patterns.","The factors affecting clusters."],"answer":"C","qtype":"细节题","locateEn":"Imagine delicate frozen crystals on a window during winter. What creates that pattern? When water freezes, its molecules begin clustering together. Water molecules have a particular bent shape that causes them to stack into clusters as they freeze. As the cluster grows, many outside factors, including humidity and temperature, begin to affect its overall shape. If the water is freezing on a window, for example, random imperfections on the glass surface affect the stacking and create the larger pattern.","locateCn":"想象冬天窗户上精致的冰晶。是什么创造了那种图案？水结冰时，其分子开始聚集。水分子 具有特殊的弯曲形状，使它们在结冰时堆叠成簇。随着簇的生长，包括湿度和温度在内的许 多外部因素开始影响其整体形状。例如，如果水在窗户上结冰，玻璃表面的随机缺陷会影响 堆叠并创造出更大的图案。","signal":"设问句引出例子主旨。段落以 What creates that pattern? 设问，随后整段解释水分子","num":14},{"prompt":"What might molecular processes produce, according to the passage?","translation":"根据文章，分子过程可能产生什么？","options":["A pattern by accident.","Patterns for specific purposes.","Patterns with random imperfections.","A pattern with artificial intervention."],"answer":"A","qtype":"推断题","locateEn":"But scientists do not always know the purpose of a pattern, or even if there is one. The molecular processes involved are simple enough that they might generate a pattern by coincidence.","locateCn":"但科学家并不总是知道某种图案的目的，甚至不知道它是否有目的。所涉及的分子过程足够 简单，以至于它们可能偶然产生一种图案。","signal":"转折后给可能性结论。But scientists do not always know the purpose of a pattern, or","num":15}]},{"kind":"lecture","segments":[{"speaker":"","en":"Many people, myself included, have multiple areas of life they would like to improve. For example, I would like to reach more people with my writing, to lift heavier weights at the gym, and to start practising mindfulness more consistently. Those are just a few of the goals I find desirable, and you probably have a long list yourself. The problem is, even if we are committed to working hard on our goals, our natural tendency is to return to our old habits at some point. Making a permanent lifestyle change is really difficult.","cn":"包括我在内，许多人都希望改善生活中的多个方面。例如，我希望通过写作让更多人读到我的作品，希望 在健身房举起更重的重量，也希望开始更加持续地练习正念。这些只是我认为值得追求的几个目标，而你 自己可能也列有一长串目标。问题在于，即使我们决心为目标努力奋斗，我们的自然倾向仍然是在某个时 候回到旧有习惯。要永久改变生活方式确实非常困难。"},{"speaker":"","en":"Recently I've come across a few studies that will make these difficult lifestyle changes a bit easier. As you'll see, however, the approach to mastering many areas of life is somewhat counterintuitive. Research has shown that you are two to three times more likely to stick with your habits if you make a specific plan for when, where, and how you will perform the behavior. For example, in one study, scientists asked people to fill out a sentence to specify during the next week they would do at least 20 minutes of vigorous exercise on which day, at what time of day, and at or in what place. Researchers found that people who filled out this sentence were two to three times more likely to actually exercise compared to a control group who did not make plans for their future behavior. Psychologists call these specific plans implementation intentions because they state when, where, and how you intend to implement a particular behavior.","cn":"最近，我接触到了一些研究，这些研究将使这些艰难的生活方式改变变得稍微容易一些。不过，正如你将 看到的，掌握生活中许多方面的方法有些违背直觉。研究表明，如果你针对自己将在何时、何地以及如何 实施某种行为制订具体计划，那么坚持这些习惯的可能性会提高到原来的两到三倍。例如，在一项研究 中，科学家要求人们填写一个句子，具体说明自己将在下一周的哪一天、一天中的什么时间，以及在什么 地点进行至少20分钟的剧烈运动。研究人员发现，与没有为未来行为制订计划的对照组相比，填写了这个 句子的人实际进行锻炼的可能性高出两到三倍。心理学家将这些具体计划称为“执行意图”，因为它们说明 了你打算在何时、何地以及如何实施某种特定行为。"},{"speaker":"","en":"However, follow-up research has discovered implementation intentions only work when you focus on one thing at a time. In fact, researchers found that people who tried to accomplish multiple goals were less committed and less likely to succeed than those who focused on a single goal.","cn":"然而，后续研究发现，执行意图只有在你一次专注于一件事时才会奏效。事实上，研究人员发现，试图实 现多个目标的人，比专注于单一目标的人投入程度更低，成功的可能性也更小。"},{"speaker":"","en":"Another science-based reason to focus on one thing at a time is that when you begin practising a new habit, it requires a lot of conscious effort to remember to do it. After a while, however, the pattern of behavior becomes easier. Eventually, your new habit becomes a normal routine, and the process is more or less mindless and automatic. The most important thing to note is that there is some tipping point at which new habits become more or less automatic. The time it takes to build a habit depends on many factors, including how difficult the habit is, your genetics, and more.","cn":"一次专注于一件事还有一个基于科学的理由，那就是当你开始练习一种新习惯时，记得去做这件事需要付 出大量有意识的努力。然而，过一段时间之后，这种行为模式会变得更加容易。最终，你的新习惯会成为 一种日常惯例，而这一过程或多或少会变得无需意识参与，并且自动进行。需要注意的最重要一点是，存 在这样一个临界点：在此之后，新习惯会或多或少地变得自动化。养成一个习惯所需的时间取决于许多因 素，包括习惯的难度、你的遗传因素，以及其他因素。"}],"questions":[{"prompt":"What does the speaker say is really difficult?","translation":"说话者说什么是真正困难的？","options":["Eliminating all the old habits at once.","Making a permanent lifestyle change.","Realizing all the life goals one has set.","Improving multiple areas of one's life."],"answer":"B","qtype":"细节题","locateEn":"The problem is, even if we are committed to working hard on our goals, our natural tendency is to return to our old habits at some point. Making a permanent lifestyle change is really difficult.","locateCn":"问题是，即使我们致力于努力实现目标，我们的自然倾向还是在某个时刻回到旧习惯。永久 改变生活方式真的很难。","signal":"题眼词复现 + 总结句。题干中的 difficult 在 Making a permanent lifestyle change is","num":16},{"prompt":"What did researchers find about people with implementation intentions?","translation":"研究人员发现，具有执行意图的人有什么特点？","options":["They were more likely to implement a particular behavior.","They were more likely to make plans for their future.","They tended to be committed to a single goal.","They tended to focus on one thing at a time."],"answer":"A","qtype":"细节题","locateEn":"Researchers found that people who filled out this sentence were two to three times more likely to actually exercise compared to a control group who did not make plans for their future behavior.","locateCn":"研究人员发现，填写了这句话的人真正去锻炼的可能性是对照组的两到三倍，而对照组没有 为他们未来的行为制定计划。","signal":"研究结论标志词。题干问 researchers find，原文 Researchers found that 正是结论信","num":17},{"prompt":"According to the speaker, what is required of you when you begin practising a","translation":"说话者认为，当你开始培养一种新习惯时，对你有什么要求？","options":["The ability to make the process automatic.","A practical timetable for implementation.","A lot of conscious effort to remember to do it.","Concentration on the benefits it will provide."],"answer":"C","qtype":"细节题","locateEn":"Another science-based reason to focus on one thing at a time is that when you begin practising a new habit, it requires a lot of conscious effort to remember to do it.","locateCn":"另一个一次只专注一件事的科学依据是，当你开始练习一个新习惯时，你需要付出大量有意 识的努力去记住去做这件事。","signal":"时间状语 + 需求动词。题干中的 when you begin practising a new habit 在 when you","num":18}]},{"kind":"lecture","segments":[{"speaker":"","en":"It was a lazy, hazy, crazy day on the dwarf planet Pluto when New Horizons, a spacecraft from Earth, flew by at a speed of 31,000 mph (miles per hour) two years ago. The spacecraft took a bunch of photos, made some quick measurements of Pluto's atmosphere, and sent them all back here, giving planetary scientists their first up-close look of the distant dwarf planet.","cn":"两年前，在新视野号这艘来自地球的航天器以每小时31,000英里（英里/小时）的速度飞掠而过时，矮行 星冥王星度过了慵懒、朦胧而疯狂的一天。这艘航天器拍摄了大量照片，对冥王星的大气层进行了一些快 速测量，并将这些数据全部传回地球，使行星科学家们首次近距离观察到这颗遥远的矮行星。"},{"speaker":"","en":"One of the more bizarre things they found was that the haze in Pluto's atmosphere was much thicker than previously thought. The planet also had an atmosphere much cooler than earlier estimates, topping out at −333.4°F.","cn":"他们发现的较为奇异的现象之一，是冥王星大气层中的霾比先前认为的厚得多。这颗行星的大气层也比早 先估计的冷得多，最高温度仅为−333.4°F。"},{"speaker":"","en":"Now, a study published in Nature links those two atmospheric observations. A computer model developed by planetary scientist Xi Zhang and colleagues shows the haze of tiny droplets in the upper atmosphere is likely scattering light from the Sun, preventing heat from reaching the planet below. We see hazy skies on Earth too, from time to time, whenever solid particles get suspended in the air—from water-based fogs, to ash from fires, to the toxic droplets that make up a thick smog. But on Earth, the overall temperature of the planet is dominated by the distribution of gases in our atmosphere.","cn":"如今，《自然》杂志发表的一项研究将这两项大气观测结果联系了起来。行星科学家张希及其同事开发的 一种计算机模型显示，高层大气中由微小液滴形成的霾很可能会散射来自太阳的光，阻止热量抵达下方的 行星。地球上也会不时出现雾霾天气，每当固体颗粒悬浮在空气中时，就可能形成这种现象，从含水雾气 到火灾产生的灰烬，再到构成浓重烟雾的有毒液滴，都是如此。但在地球上，行星的整体温度主要由大气 层中气体的分布决定。"},{"speaker":"","en":"On Pluto, the authors suggest, haze might be more influential. Particles can reflect light from the Sun here on Earth: It happens after volcanoes erupt, emitting clouds of particles that reflect the Sun's rays into the atmosphere. Some people even propose imitating this phenomenon to alleviate the effects of climate change. But our planet isn't dominated by that process, or at least it hasn't been for a few billion years.","cn":"作者认为，在冥王星上，霾的影响可能更大。在地球上，颗粒物能够反射来自太阳的光：火山喷发后会释 放出由颗粒物组成的云团，将太阳光线反射回大气层。有些人甚至提出模仿这一现象，以减轻气候变化的 影响。但我们的行星并不是由这一过程主导的，至少在过去几十亿年里不是如此。"},{"speaker":"","en":"If Pluto's atmosphere is very different from ours and from that of other nearby planets, it could help scientists expand their understanding of planetary atmospheres. But right now, this is just a good guess based on data from New Horizons and a sophisticated computer model, not direct observations of the haze's composition.","cn":"如果冥王星的大气层与地球以及其他邻近行星的大气层截然不同，这将有助于科学家拓展对行星大气层的 认识。但目前，这只是基于新视野号获得的数据和一个复杂计算机模型提出的合理推测，而不是对霾的成 分进行直接观测所得出的结论。"},{"speaker":"","en":"There are other theories floating around to explain Pluto's cool temperatures, including blaming the cold air on gases in the atmosphere.","cn":"关于解释冥王星低温的理论还有其他一些，包括把寒冷的空气归因于大气层中的气体。"},{"speaker":"","en":"Luckily, the authors will get a chance to test their notions when the James Webb Space Telescope launches later. That observatory can detect different spectrums of light, which the hazy Plutonian atmosphere would be positively glowing with as it scattered sunlight. The researchers just have to wait and see if the light from the telescope validates their bright idea.","cn":"幸运的是，詹姆斯·韦布空间望远镜稍后发射后，作者们将有机会检验他们的观点。这座天文台能够探测不 同光谱的光，而冥王星朦胧的大气层在散射阳光时很可能会发出大量这样的光。研究人员只需等待并观察 望远镜接收到的光是否会验证他们的这个妙想。"}],"questions":[{"prompt":"What was one of the more bizarre findings about Pluto's atmosphere?","translation":"关于冥王星大气层较为离奇的发现之一是什么？","options":["It resembles that of Earth in many inconceivable ways.","It has a haze much thicker than previously believed.","It is 333.4°F cooler than earlier estimates.","It is far beyond any quick measurements."],"answer":"B","qtype":"细节题","locateEn":"One of the more bizarre things they found was that the haze in Pluto's atmosphere was much thicker than previously thought.","locateCn":"他们发现的一件更离奇的事情是，冥王星大气中的霾层比之前认为的要厚得多。","signal":"题干关键词复现 + 比较级信息。录音中 One of the more bizarre things they found 与题","num":19},{"prompt":"What is said to determine the overall temperature on Earth?","translation":"据说是什么决定了地球的整体温度？","options":["The accumulation of solid particles in the air.","The distribution of gases in its atmosphere.","The clouds of particles reflecting sun rays.","The aggravated effects of climate change."],"answer":"B","qtype":"细节题","locateEn":"But on Earth, the overall temperature of the planet is dominated by the distribution of gases in our atmosphere.","locateCn":"但在地球上，行星的整体温度是由大气中气体的分布所主导的。","signal":"转折后给出地球情况的结论。录音先用 Pluto 的 haze 机制做铺垫，随后用 But on Earth","num":20},{"prompt":"What does the speaker say the researchers have to wait and see?","translation":"讲话者说研究人员必须等待并观察什么？","options":["If spectrums of light can be better detected by telescope.","If Pluto's hazy atmosphere can be more easily observed.","If Pluto's hazy atmosphere scatters strong sunlight.","If the light from the telescope confirms their idea."],"answer":"D","qtype":"细节题","locateEn":"The researchers just have to wait and see if the light from the telescope validates their bright idea.","locateCn":"研究者们只能等待并观察，来自望远镜的光线是否会证实他们那个不错的想法。","signal":"题干关键词 wait and see 原词复现。录音末句 The researchers just have to wait and","num":21}]},{"kind":"lecture","segments":[{"speaker":"","en":"Parents have a small window where they can influence their 8- to 10-year-old children's music taste, researchers have concluded. The 24-month time frame comes at an age when youngsters are old enough to appreciate poetic lyrics and snappy tunes, but have not yet started to be embarrassed by their mother and father's preferences. Dr. Hauke Egermann, a lecturer in music at the University of York, carried out a literature review into more than a dozen studies looking at parental musical influence. \\"Children have an openness to new music, and this means parents have an important role to play in developing the musical preferences of their kids,\\" he said.","cn":"研究人员得出结论，父母有一个短暂的窗口期，可以影响8至10岁孩子的音乐品味。这段24个月的时期处 于这样一个年龄阶段：孩子已经足够大，能够欣赏富有诗意的歌词和朗朗上口的曲调，但还没有开始因 父母的音乐偏好而感到尴尬。约克大学音乐讲师豪克·埃格尔曼博士对十多项有关父母音乐影响的研究进 行了文献综述。他说：“孩子对新音乐持开放态度，这意味着父母在培养孩子的音乐偏好方面扮演着重要 角色。”"},{"speaker":"","en":"However, time is of the essence as parental influence is most likely to be effective during the critical time period before age ten. During adolescence, children tend to gravitate away from their parents' choices and are more influenced by their peers. A separate survey of 2,000 British parents by music streaming service Deezer also found that nearly four-fifths of parents agreed that their children were far more receptive to their musical suggestions before the age of ten. In contrast, just 10 percent of parents reported positive reactions from their teenage children when they shared their favorite music. Some 79 percent of fathers said they had tried to influence their children's music, but just 69 percent of mothers. However, mothers were more effective, with 38 percent reporting that their kids loved the tunes they shared, compared to 30 percent of dads who, in some cases, said their children cried or even fell asleep.","cn":"然而，时间至关重要，因为父母的影响最有可能在十岁以前这一关键时期发挥作用。进入青春期后，孩子 往往会逐渐远离父母的选择，并更多地受到同龄人的影响。音乐流媒体服务Deezer对2000名英国父母进 行的另一项调查也发现，近五分之四的父母认为，孩子在十岁以前更容易接受他们的音乐建议。相比之 下，只有10%的父母表示，孩子进入青少年时期后，在他们分享自己喜爱的音乐时会作出积极反应。约 79%的父亲表示曾试图影响孩子的音乐选择，而母亲的这一比例仅为69%。不过，母亲的影响更有效： 38%的母亲表示孩子喜欢她们分享的曲调，而父亲中只有30%的人得到这样的反馈；有些父亲甚至表示， 孩子听着听着哭了起来，或者睡着了。"},{"speaker":"","en":"Dr. Egermann claims introducing children to a variety of musical styles is the key to fostering good taste in later life. \\"By playing children a variety of genres before this critical period, research on familiarization suggests they will enjoy lots of different types of music as adults,\\" he added. The benefits of having a wider taste in music include the ability to manage their emotions more effectively, socialize and bond with others more easily, and to have a better understanding of other cultures as well.","cn":"埃格尔曼博士认为，让孩子接触各种各样的音乐风格，是培养他们日后良好音乐品味的关键。他补充说： “有关熟悉化的研究表明，在这一关键时期之前让孩子聆听多种音乐类型，他们成年后将会喜欢许多不同 种类的音乐。”拥有更广泛的音乐品味所带来的益处包括更有效地管理情绪、更容易与他人交往并建立联 系，以及更好地理解其他文化。"},{"speaker":"","en":"Dr. Egermann advises parents not to push their favorite music too hard on their children, but instead play it as background music while a child is playing. They can also help create positive memories about artists and bands by going to concerts and live music events together.","cn":"埃格尔曼博士建议，父母不要过分强迫孩子接受自己喜爱的音乐，而应在孩子玩耍时将其作为背景音乐播 放。他们还可以通过一起参加音乐会和现场音乐活动，帮助孩子对音乐家和乐队形成积极的记忆。"}],"questions":[{"prompt":"What do we learn from researchers' conclusion at the beginning of the talk?","translation":"演讲开头研究人员的结论让我们了解到什么？","options":["Parents can play a decisive role in cultivating their children's musical talent.","Children are embarrassed by parents' failure to appreciate their music.","Parents can mould their 8- to 10-year-old children's music taste.","Children aged 8 to 10 are old enough to produce poetic lyrics."],"answer":"C","qtype":"细节题","locateEn":"Parents have a small window where they can influence their 8- to 10-year-old children's music taste, researchers have concluded.","locateCn":"研究人员得出结论：父母有一个短暂的窗口期，可以影响8到10岁孩子的音乐品味。","signal":"研究结论标志词。答案句以researchers have concluded结尾，是典型的研究结论标志；同","num":22},{"prompt":"What does Dr. Hauke Egermann say about adolescents?","translation":"Hauke Egermann博士对青少年有何看法？","options":["They start to show their own musical preference.","They tend to be more influenced by their peers.","They tend to gravitate away from their homes.","They are more open to new genres of music."],"answer":"B","qtype":"细节题","locateEn":"During adolescence, children tend to gravitate away from their parents' choices and are more influenced by their peers.","locateCn":"在青春期，孩子们往往会偏离父母的选择，更受同龄人的影响。","signal":"题干关键词复现+比较级。原文During adolescence与题干adolescents直接对应，句中","num":23},{"prompt":"What is the key to fostering good taste in later life, according to Dr. Hauke Egermann?","translation":"据Hauke Egermann博士说，培养日后良好品味的关键是什么？","options":["Enabling children to be receptive to music experts' suggestions.","Helping children develop the ability to manage their emotions.","Familiarising children with different schools of music.","Introducing children to a variety of musical styles."],"answer":"D","qtype":"细节题","locateEn":"Dr. Egermann claims introducing children to a variety of musical styles is the key to fostering good taste in later life.","locateCn":"埃格曼博士称，让孩子接触多种多样的音乐风格是培养其日后良好品味的关键。","signal":"专家观点+the key to结构。原文Dr. Egermann claims是专家观点标志，紧接着出现is the","num":24},{"prompt":"How can parents help children create positive memories about artists and bands?","translation":"父母如何帮助孩子对艺术家和乐队留下积极的记忆？","options":["By enhancing children's appreciation of their music.","By pushing their music hard enough upon children.","By attending their concerts and live music events with children.","By introducing their music to children as early as possible."],"answer":"C","qtype":"细节题","locateEn":"They can also help create positive memories about artists and bands by going to concerts and live music events together.","locateCn":"他们还可以通过带孩子一起去听音乐会和现场音乐演出来帮助创造关于艺人和乐队的积极 记忆。","signal":"题干关键词复现+by doing方式状语。原文help create positive memories about artists","num":25}]}]}`),"2026-06-3":JSON.parse(`{"id":"2026-06-3","label":"2026年6月 · 第3套","writing":{"modelEssay":"Faced with growing globalization,students realize that a deep understanding of traditional Chinese culture\\nhelps cultivate cultural confidence. In an age when Western brands, movies and festivals flood daily life, many\\nyoung people begin to look back at their own roots. They find that cultural confidence cannot be borrowed\\nfrom outside; it must grow from real knowledge of what their ancestors created.\\nThe reason is not hard to understand. Globalization exposes us to different values, yet it also makes us question\\nwho we are. Only by learning the ideas behind Confucianism, the beauty of calligraphy, or the spirit of\\ntraditional festivals can we answer that question with pride. Take the Spring Festival as an example: those who\\nunderstand its meaning of reunion and renewal celebrate it not out of habit, but out of identity.\\nTherefore, college students should actively read classics, visit museums and practice folk arts. The deeper we\\nunderstand traditional Chinese culture, the more confident we become in facing the world.","modelCn":"面对日益增长的全球化，学生们意识到深入理解中国传统文化有助于培养文化自信。在这个西方品牌、电\\n影和节日充斥着日常生活的时代，许多年轻人开始回望自己的文化根脉。他们发现文化自信无法从外界借\\n来，而必须建立在对先辈所创造文化的真正了解之上。\\n其原因不难理解。全球化让我们接触到不同的价值观，但也让我们反思自己是谁。只有了解儒家思想背后\\n的理念、书法之美或传统节日的精神，我们才能自豪地回答这个问题。以春节为例：真正理解其团圆与更\\n新内涵的人，庆祝春节不是出于习惯，而是出于身份认同。\\n因此，大学生应积极阅读经典、参观博物馆并参与民俗艺术实践。我们对中国传统文化理解得越深入，在\\n面对世界时就越自信。"},"translation":{"source":"近年来，中国无人机 (drone) 产业蓬勃发展，出口量跃升为全球第一。中国的无人机以出色的稳定性、高清  (high-definition) 拍摄能力和便捷的操作，受到全球消费者的喜爱，在民用领域得到广泛应用。无人机已被国家纳入战略性新兴产业，逐步成为能满足多种场景需求的智能助手。在农村，无人机可精准识别农作物病虫害，高效喷洒农药。在城市，无人机可快速运送生鲜食品。在不久的将来，无人机能够在更多领域实现其独特价值，为经济社会发展注入新动能。","reference":"In recent years, China's drone industry has been booming, with its export volume ranking first in the world. Chinese drones are popular with consumers around the world for their excellent stability, high- definition shooting capability and convenient operation, and have been widely used in civilian fields. Drones have been included by the state in strategic emerging industries, and are gradually becoming intelligent assistants that can meet the needs of various scenarios. In rural areas, drones can accurately identify crop diseases and pests, and efficiently spray pesticides. In cities, drones can quickly deliver fresh food. In the near future, drones will be able to realize their unique value in more fields, injecting new momentum into economic and social development."},"cloze":{"passage":"Imagine you and a stranger are sitting on a couch. How close would you sit to them? It turns out that how much of a __26__ zone you prefer may reveal a lot about your personality. In one study, researchers sought to __27__ how our personality may be linked to our preferred amount of personal space. The researchers found that people who scored higher in the __28__ of agreeableness tended to sit closer to others, as did people who were more open and outgoing. Other individual differences, such as gender and age, can also affect how much personal space we __29__ . Women tend to prefer more physical distance from strangers or acquaintances and older adults also generally tend to prefer to keep more distance between themselves and others. Beyond reflecting our personality and __30__ , the amount of personal space we prefer is also linked to our cultural backgrounds. In a study involving participants from 42 countries, researchers found that around the world people’s desired amount of personal space varied __31__ . For example, in Romania, the average amount of personal space people said they would prefer from a stranger was more than 4 feet, whereas in Argentina it was roughly half that. What might __32__ this variation? The researchers looked at a number of __33__ factors, but the only one that was significantly __34__ with preferred interpersonal distance was average temperature. The warmer the place, it seems, the “warmer” the people and the less space they needed between them and others. Personal space may also reflect interpersonal attraction. Researchers have found that our chosen physical __35__ also appears to reflect how much we like others. The more people would like to be friends with the other person, the closer they sat to them.","bank":{"A":"ascertain","B":"buffer","C":"correlated","D":"crave","E":"demographics","F":"entail","G":"legitimately","H":"mandated","I":"potential","J":"proximity","K":"rigid","L":"statistics","M":"substantially","N":"trait","O":"underlie"},"answers":{"26":{"letter":"B","word":"buffer","pos":"名词","explanation":"buffer zone 是固定搭配，指人和人之间的\\"缓冲地带\\" Imagine you and a stranger are sitting on a couch. How close would you sit to them? 讲的是与陌生人保持的距离，buffer 与 zone 构成固定搭配 buffer zone（缓冲地 带），代进去即\\"你偏好多大的缓冲距离\\"，与全文 personal space 主题严丝合缝。"},"27":{"letter":"A","word":"ascertain","pos":"动词","explanation":"研究者\\"着手查明\\"性格与空间偏好的关联 ascertain 意为\\"查明、弄清\\"，后接 how 从句正合\\"研究者试图弄清性格如何与个人空间偏 好相关联\\"；下一句 The researchers found that people who scored higher 的 found （发现）正是 ascertain 的结果，前后动作链吻合。"},"28":{"letter":"N","word":"trait","pos":"名词","explanation":"agreeableness 是一种性格\\"特质\\"，the trait of 搭配地道 trait 意为\\"（性格）特质\\"，agreeableness（亲和性）正是心理学\\"大五人格\\"里的一种 trait；the trait of agreeableness = \\"亲和性这一特质\\"。后半句 as did people who were more open and outgoing 列举的 open、outgoing 也都是 trait，同范畴复现是强信号。"},"29":{"letter":"D","word":"crave","pos":"动词","explanation":"crave = 内心\\"需要/想要\\"多少空间，与 prefer 同义线 crave 意为\\"渴望、需要\\"，how much personal space we crave = \\"我们需要/想要多少个 人空间\\"。下文 Women tend to prefer more physical distance from strangers 反复用 prefer（偏好）谈同一概念，crave 正是 prefer 的同义复现，扣住全文\\"偏好\\"主线。"},"30":{"letter":"E","word":"demographics","pos":"名词","explanation":"demographics 正是上一段 gender and age 的总称 demographics 意为\\"人口统计特征\\"。第 3 段 Other individual differences, such as gender and age, can also affect 讲的性别、年龄正是 demographics 的内容；本 句\\"Beyond reflecting our personality and demographics\\"用 Beyond 把前两段（性格 + 人口特征）一并收进，再引出文化背景——行文是\\"性格→人口属性→文化\\"的递进， demographics 正好是中间那一环。"},"31":{"letter":"M","word":"substantially","pos":"副词","explanation":"substantially 修饰 varied 表\\"差异巨大\\"，与跨国数据呼应 substantially 意为\\"大幅度地\\"，varied substantially = \\"差异悬殊\\"。紧接的对比例证 in Romania, the average amount of personal space people said they would prefer from a stranger was more than 4 feet, whereas in Argentina it was roughly half that（4 英 尺 vs 约 2 英尺）正是\\"差很多\\"的实据。"},"32":{"letter":"O","word":"underlie","pos":"动词","explanation":"underlie this variation = 是什么\\"造成/构成\\"了这种差异 underlie 意为\\"构成……的基础、是……背后的原因\\"。本段正是追问成因：下一句 The researchers looked at a number of __(33)__ factors 到\\"唯一相关的是气温\\"，整段在找差 异背后的原因——What might underlie this variation? 正是这一问句的总起。"},"33":{"letter":"I","word":"potential","pos":"形容词","explanation":"potential factors = 排查\\"候选的、可能的因素\\"，正对研究筛选语境 potential 意为\\"潜在的、可能的\\"。本句讲研究者排查若干可能因素，下句 but the only one that was significantly __(34)__ with preferred interpersonal distance was average temperature 的\\"只剩一个\\"正是\\"从潜在因素中筛选\\"的结果——potential 与 looked at… only one 的筛选叙事严丝合缝。"},"34":{"letter":"C","word":"correlated","pos":"形容词","explanation":"be correlated with = 与……相关，科学研究高频搭配 correlated 与 was…with 构成 be correlated with（与……相关），代进去即\\"唯一与偏好 的人际距离显著相关的因素\\"。下句 The warmer the place, it seems, the \\"warmer\\" the people and the less space they needed 正说明气温与距离此消彼长的相关关系，语义 闭环。"},"35":{"letter":"J","word":"proximity","pos":"名词","explanation":"physical proximity = 身体上的靠近，正对\\"坐多近\\" proximity 意为\\"接近、邻近\\"，physical proximity 是地道搭配（身体距离上的靠近）。下 一句 The more people would like to be friends with the other person, the closer they sat to them 的 closer they sat 正是 proximity 的行为化表达，首尾呼应。"}}},"match":{"title":"It's never too early to teach children about money","paragraphs":{"A":{"en":"The cost of a mortgage or rents, meeting monthly utility bills, paying for a new car - all headaches most people get to worry about from their 20s. But while some may struggle to pay their bills after a few too many nights out at the start of the month, others will have a tightly followed plan for their repayments. So what is the difference between the shrewd saver and the more reckless spender?","cn":"抵押贷款或房租的费用、每月缴纳水电等生活账单、支付一辆新车的费用——这些都是大多数人从二 十多岁起就要操心的头疼事。不过，有些人可能会因为月初外出玩乐的夜晚太多而难以支付账单，另 一些人却会严格遵循还款计划。那么，精明的储蓄者与更为鲁莽的花钱者之间究竟有什么区别呢？"},"B":{"en":"Experts believe it is all about the age you learn how to spend responsibly. Adult money habits are typically set by the age of seven, according to a large-scale study by the government's Money Advice Service and behaviour experts at Cambridge University. By then, most children have grasped how to recognise the value of money and are capable of complex functions such as planning ahead, delaying a decision until later and understanding that some choices are irreversible.","cn":"专家认为，这一切都取决于你在什么年龄学会负责任地消费。政府的金钱咨询服务机构与剑桥大学的 行为专家开展的一项大规模研究显示，成年人的金钱习惯通常在七岁时就已经形成。到那时，大多数 孩子已经掌握了如何识别金钱价值，并且能够进行一些复杂的思考，例如提前规划、将决定推迟到以 后再做，以及理解有些选择是不可逆的。"},"C":{"en":"Tomorrow marks the start of Global Money Week, a worldwide initiative to help children make smart financial decisions and learn that \\"money matters matter\\". But for many young people in the UK, it's a matter of too little, too late. \\"The habits of mind which influence the ways children approach complex problems and decisions, including financial ones, are largely determined in the first few years of life,\\" says Dr David Whitebread, the co- author of the study. And this core behaviour is very likely to influence their financial decisions when they are adults, he says.","cn":"明天将迎来全球金钱周的开始。这是一项旨在帮助儿童作出明智的财务决定，并让他们懂得“金钱问题 很重要”的全球性倡议。但对英国的许多年轻人来说，这已经是一个太少、太晚的问题。“影响儿童处 理复杂问题和作出决定，包括财务决定的思维习惯，很大程度上是在生命最初几年形成的，”该研究的 共同作者戴维·怀特布雷德博士说。他表示，这种核心行为很可能会影响他们成年后的财务决定。"},"D":{"en":"The study also urges parents not to underestimate their own good and bad money habits. \\"Since young children have few monetary resources they control independently, it is the basic approaches and skills which are modelled, discussed and demonstrated by parents that are likely to be influential levers, breeding efficient habits and practices,\\" it says.","cn":"这项研究还敦促父母不要低估自己良好或不良金钱习惯的影响。“由于幼儿能够独立支配的金钱资源很 少，因此，父母所示范、讨论和展示的基本方法与技能，很可能是促成有效习惯和做法的重要影响因 素，”研究报告称。"},"E":{"en":"Parents who choose to help their children learn how to plan ahead, reflect on the past and self-regulate car make a huge difference in promoting good financial behaviour in the future, explains Whitebread. According to a survey by M&G Investments, the vast majority (83%) of parents recognise the value of teaching their children about money. However, this concern does not always carry through to practice - one in six do not feel confident enough to do it. More than one in every four parents think children should take responsibility for understanding money themselves.","cn":"怀特布雷德解释说，选择帮助孩子学会提前规划、反思过去并进行自我调节的父母，可以在促进孩子 未来良好财务行为方面发挥巨大作用。M&G投资公司的一项调查显示，绝大多数父母（83%）都认识 到教孩子了解金钱的价值。然而，这种关注并不总能落实到实践中——六分之一的父母觉得自己没有 足够的信心去做这件事。超过四分之一的父母认为，孩子应该自己负责了解金钱。"},"F":{"en":"\\"There's joy in the fact that young children are spontaneous and live life in the moment, unrestrained by adult problems. But teaching children about money when they are young is a good way for parents to help them learn to delay satisfaction, so that the child thinks: 'I'd like to do this but I'm not going to.' Hard evidence suggests, if you want your child to do well in life, the earlier you can start trying to teach them inhibition and self-discipline, the better,\\" says Whitebread, pointing to research that has shown people in prison frequently have poor impulse control, a personality trait that can affect relationships and long-term health.","cn":"“幼儿 spontanes地生活在当下，不受成年人的烦恼束缚，这其中自有乐趣。但在孩子年幼时教他们认 识金钱，是父母帮助他们学会延迟满足的一种好方法，这样孩子就会想：‘我想做这件事，但我不会去 做。’确凿的证据表明，如果你希望孩子一生过得好，那么越早开始尝试教他们克制和自律，效果就越 好，”怀特布雷德说。他指出，有研究显示，监狱中的人往往缺乏控制冲动的能力，而这种人格特征可 能影响人际关系和长期健康。"},"G":{"en":"But how should a parent try to teach their child to spend responsibly? One simple way is to give them pocket money and then help them to analyse and learn from any foolish spending decisions.","cn":"但是，父母应该怎样教孩子负责任地消费呢？一个简单的方法是给孩子零花钱，然后帮助他们分析并 从任何不理智的消费决定中吸取教训。"},"H":{"en":"Another is through board games which can help teach financial responsibility. Pop to the Shops, a shopping board game for five-to-nine-year-olds, has been one of Orchard Toys' top 10 bestselling board games every year for the past 15 years. To win, players must use fake coins to purchase everyday grocery items from various shops around the board, and give the other players who visit their shop the correct change. If they don't have enough money, they must purchase a cheaper item. \\"It acts as a conversation starter about money - parents can fill in the gaps,\\" says Orchard Toys product manager Rachael Sutcliffe.","cn":"另一种方法是通过棋盘游戏来帮助孩子学习财务责任感。面向五至九岁儿童的购物棋盘游戏《去商店 吧》在过去15年中每年都跻身Orchard Toys最畅销的十大棋盘游戏之列。为了获胜，玩家必须使用假 硬币，在棋盘周围的不同商店购买日常食品，并且要给到访自己商店的其他玩家找对零钱。如果钱不 够，他们就必须购买更便宜的商品。Orchard Toys的产品经理蕾切尔·萨克利夫说：“它可以成为一个 谈论金钱的开端，父母可以补充其中的不足。”"},"I":{"en":"There are also some pocket-money-tracking and payment apps, such as RoosterMoney and goHenry, which are designed to be used by under-sevens, and which boast that they can help children develop good money habits. This is dependent on the children receiving enough pocket money to need an app to track their spending, which research suggests is not always the case.","cn":"还有一些追踪零花钱和支付的应用程序，例如RoosterMoney和goHenry，它们面向七岁以下儿童设 计，并声称能够帮助孩子养成良好的金钱习惯。不过，这取决于孩子是否能获得足够多的零花钱，以至 于需要使用应用程序来追踪支出，而研究表明，情况并不总是如此。"},"J":{"en":"Surprisingly, given the research about habit-forming in young children, there are very few gaming apps that can help under-sevens - Pigby's Fair, developed by NatWest, being a notable exception. In this, children who solve basic puzzles will earn virtual money selling what they have made at different stalls in a fair, then spend or save it. But the need to shift virtual money around, and take into account interest payments and pocket money bonuses, makes it a complex financial education tool.","cn":"鉴于有关幼儿养成习惯的研究，令人意外的是，能够帮助七岁以下儿童学习的游戏应用程序非常少， 由NatWest开发的Pigby's Fair是一个值得注意的例外。在这款游戏中，解开基础谜题的孩子可以通过 在集市的不同摊位出售自己制作的东西来赚取虚拟货币，然后把钱花掉或存起来。不过，转移虚拟货 币、同时考虑利息支付和零花钱奖励的需要，使它成为一种复杂的金融教育工具。"},"K":{"en":"There are plenty of online games which focus on coin recognition and counting with money, such as the Igloo Shopping game or Top Marks' Coins Game. So what if children find such games boring? An exciting (and free) real-world option for parents to use is a visit to Metro Bank. Although, like most banks, it does not allow children to open an account until they turn 11, it specifically tries to offer young children a chance to learn about money inside its branches by inviting kids to use the \\"magic money machines\\" to count their coins. Children who accurately guess how much was in their piggy bank (猪形储钱罐) get a prize, and free candies are handed out when the coins are exchanged for banknotes. The bank does not take a commission from the transaction.","cn":"piggy bank( 猪形储钱罐 ) get a prize, and free candies are handed out when the coins are exchanged 有许多在线游戏专门训练儿童识别硬币以及用钱进行计算，例如Igloo Shopping游戏或Top Marks的 Coins Game。那么，如果孩子觉得这类游戏很无聊，该怎么办呢？父母可以选择一个令人兴奋且免 费的现实体验：去Metro Bank。虽然和大多数银行一样，Metro Bank不允许儿童在年满11岁之前开 户，但它专门努力为幼儿提供在银行网点内学习金钱知识的机会，邀请孩子使用“神奇点钞机”清点硬 币。准确猜出自己的猪形储钱罐里有多少钱的孩子可以获得奖品；将硬币兑换成纸币时，还会免费发 放糖果。银行不会从这笔交易中收取佣金。"},"L":{"en":"At six years old, my daughter Flora is getting to grips with her finances early. She tested out a number of games aimed at teaching children her age the value of money. She enjoyed them all, but best, in her view, is Money Match Cafe, a board game where she must work out the value of different denominations (面额) of coin in her imaginary restaurant, her \\"customers\\" being her stuffed toys. \\"It was really fun because you get to serve food to your own toys on a little tray with a napkin on it, and then you can hug them,\\" she says.","cn":"我六岁的女儿弗洛拉正在很早地学习打理自己的财务。她体验了几款旨在教同龄儿童认识金钱价值的 游戏。她喜欢所有这些游戏，但在她看来，最棒的是《Money Match Cafe》，这是一款棋盘游戏。 在游戏中，她必须在自己想象中的餐馆里算出不同面额硬币的价值，而她的“顾客”是她的毛绒玩具。 她说：“这真的很有趣，因为你可以用一个铺着餐巾的小托盘给自己的玩具上菜，然后还可以拥抱 它们。”"},"M":{"en":"\\"If you're six and you play this game, you'll learn that you might not have the right amount of money for what you want to buy. You just have to cross your fingers and hope. It's a good challenge, and I enjoyed adding the coins up to see how much they made. But I don't like the name. Money Match Cafe is not a good name for a café. I would have liked it more if it had been Flora's Cafe or Fantastically Baked Lunches.\\"","cn":"“如果你六岁并且玩这款游戏，你会学到：你可能没有足够的钱买自己想要的东西。你只能祈祷并抱着 希望。这是一个很好的挑战，我喜欢把硬币加起来，看看它们总共值多少钱。但我不喜欢这个名字。 Money Match Cafe不是一个适合咖啡馆的好名字。如果它叫Flora's Cafe或Fantastically Baked Lunches，我会更喜欢。”"},"N":{"en":"Seven out of ten teachers think children are now faced with financial decisions earlier. On Wednesday, Lifesavers - a new project which promotes financial education in primary schools - is hosting a conference to encourage teachers to join its programme and get free classroom resources and training. Almost two-thirds of millennials (千禧一代) wish they had received more money advice at a younger age, according to a Santander survey.","cn":"and training. Almost two-thirds of millennials( 千禧⼀代 ) wish they had received more money advice 十分之七的教师认为，儿童现在更早就要面对财务决定。周三，Lifesavers将举办一场会议。这是一 个促进小学金融教育的新项目，旨在鼓励教师加入该项目，并获得免费的课堂资源和培训。桑坦德银 行的一项调查显示，近三分之二的千禧一代希望自己在更年轻时就接受过更多的金钱方面的建议。"},"O":{"en":"Only a third of parents involve their children in discussions about their household finances, even though less than half of young people aged seven to seventeen receive financial education at school, another survey shows.","cn":"另一项调查显示，尽管七至十七岁的年轻人中接受过学校金融教育的不到一半，但只有三分之一的父 母会让孩子参与讨论家庭财务问题。"},"P":{"en":"Most adults believe their parents have had the biggest influence on their money behaviour. So when should they start trying to instil (灌输) good habits? As early as possible before the age of seven, research suggests.","cn":"should they start trying to instil( 灌输 ) good habits? As early as possible before the age of seven, 大多数成年人认为，父母对他们金钱行为的影响最大。那么，父母应该从什么时候开始努力灌输良好 习惯呢？研究表明，应当在七岁之前尽可能早地开始。"}},"statements":[{"num":36,"text":"Most parents realise the importance of teaching their children how to handle money, but many of","answer":"E","locateEn":"According to a survey by M&G Investments, the vast majority (83%) of parents recognise the value of teaching their children about money. However, this concern does not always carry through to practice—one in six do not feel confident enough to do it. More than one in every four parents think children should take responsibility for understanding money themselves.","locateCn":"根据 M&G Investments 的一项调查，绝大多数（83%）家长认识到教孩子理财的价值，但 这种关注并未总能付诸实践——六分之一的人没有足够的信心去做，超过四分之一的家长则 认为孩子应自行承担起理解金钱的责任。","anchor":"强锚点"},{"num":37,"text":"People differ substantially in their way of managing finance.","answer":"A","locateEn":"The cost of a mortgage or rents, meeting monthly utility bills, paying for a new car—all headaches most people get to worry about from their 20s. But while some may struggle to pay their bills after a few too many nights out at the start of the month, others will have a tightly followed plan for their repayments. So what is the difference between the shrewd saver and the more reckless spender?","locateCn":"房贷或租金、每月水电账单、购买新车的开销——这些都是大多数人从二十多岁起就要操心 的烦心事。但有人月初花天酒地后月底捉襟见肘，也有人严格按计划还款。那么精明储蓄者 与挥霍者之间的区别何在？","anchor":"弱锚点"},{"num":38,"text":"Parents can easily teach children how to spend responsibly by helping them draw lessons from bad","answer":"G","locateEn":"But how should a parent try to teach their child to spend responsibly? One simple way is to give them pocket money and then help them to analyse and learn from any foolish spending decisions.","locateCn":"但家长应如何教孩子负责任地消费呢？一个简单方法是给他们零花钱，然后帮助他们分析并 从任何愚蠢的消费决定中吸取教训。 38.Parents can easily teach children how to spend responsibly by helping them draw lessons from bad decisions on spending.","anchor":"强锚点"},{"num":39,"text":"Many young British people badly lack money management skills and they don't learn them early","answer":"C","locateEn":"Tomorrow marks the start of Global Money Week, a worldwide initiative to help children make smart financial decisions and learn that \\"money matters matter\\". But for many young people in the UK, it's a matter of too little, too late. \\"The habits of mind which influence the ways children approach complex problems and decisions, including financial ones, are largely determined in the first few years of life,\\" says Dr David Whitebread, the co-author of the study. And this core behaviour is very likely to influence their financial decisions when they are adults, he says.","locateCn":"明天是全球理财周的启动日，这是一项旨在帮助孩子做出明智财务决策并认识到\\"金钱问题 很重要\\"的全球倡议。但对英国许多年轻人来说，这太少、也太晚了。研究合著者 David Whitebread 博士表示：\\"影响儿童处理复杂问题和决策（包括财务决策）的思维习惯，主要 在生命最初几年形成。\\"他还说，这种核心行为很可能影响他们成年后的财务决策。 39.Many young British people badly lack money management skills and they don't learn them early enough.","anchor":"强锚点"},{"num":40,"text":"The majority of adults believe that their spending habits have been influenced the most by their","answer":"P","locateEn":"Most adults believe their parents have had the biggest influence on their money behaviour. So when should they start trying to instil good habits? As early as possible before the age of seven, research suggests.","locateCn":"多数成年人认为他们的父母对其金钱行为影响最大。那么他们应该何时开始培养好习惯呢？ 研究表明，尽可能早，最好在七岁之前。","anchor":"强锚点"},{"num":41,"text":"There are apps designed specifically for children under 7 to help them track pocket money spending.","answer":"I","locateEn":"There are also some pocket-money-tracking and payment apps, such as RoosterMoney and goHenry, which are designed to be used by under-sevens, and which boast that they can help children develop good money habits.","locateCn":"还有一些零花钱追踪和支付应用，如 RoosterMoney 和 goHenry，专为七岁以下儿童设 计，并声称能帮助孩子养成良好理财习惯。","anchor":"强锚点"},{"num":42,"text":"According to experts, the age a person learns to manage finance responsibly determines the way they","answer":"B","locateEn":"Experts believe it is all about the age you learn how to spend responsibly. Adult money habits are typically set by the age of seven, according to a large-scale study by the government's Money Advice Service and behaviour experts at Cambridge University.","locateCn":"专家认为，关键在于你学会负责任消费的年龄。根据政府货币咨询服务机构和剑桥大学行为 专家开展的一项大规模研究，成年人的金钱习惯通常在七岁时就已形成。","anchor":"强锚点"},{"num":43,"text":"Most teachers are of the opinion that children today need to make financial decisions at a younger","answer":"N","locateEn":"Seven out of ten teachers think children are now faced with financial decisions earlier.","locateCn":"十分之七的教师认为，孩子们现在更早地面临财务决策。","anchor":"强锚点"},{"num":44,"text":"Parents serve as effective role models in shaping children's money management habits.","answer":"D","locateEn":"The study also urges parents not to underestimate their own good and bad money habits. \\"Since young children have few monetary resources they control independently, it is the basic approaches and skills which are modelled, discussed and demonstrated by parents that are likely to be influential levers, breeding efficient habits and practices,\\" it says.","locateCn":"该研究还敦促家长不要低估自身良好和不良的理财习惯。报告指出：\\"由于幼儿独立掌控的 货币资源很少，因此父母示范、讨论和展示的基本方法与技能很可能成为有影响力的杠杆， 培养出高效的习惯和做法。\\"","anchor":"弱锚点"},{"num":45,"text":"According to one study, about 30% of parents allow their children to participate in discussions on","answer":"O","locateEn":"Only a third of parents involve their children in discussions about their household finances, even though less than half of young people aged seven to seventeen receive financial education at school, another survey shows.","locateCn":"另一项调查显示，只有三分之一的家长让孩子参与家庭财务讨论，尽管七至十七岁的年轻人 中不到一半在学校接受过理财教育。","anchor":"强锚点"}]},"careful":[{"paragraphs":[{"en":"Three artists have brought a lawsuit against Stability AL, DeviantArt, and Midjourney, alleging that the text- to-image AI tools have infringed the rights of thousands of artists.","cn":"三位艺术家已对 Stability AI、DeviantArt 和 Midjourney 提起诉讼，指控这些文本生成图像的人工智能 工具侵犯了数千名艺术家的权利。"},{"en":"The lawsuit claims that the Stable Diffusion tool used by Stability AI, DeviantArt, and Midjourney was trained on billions of copyrighted images downloaded from the internet and used by the companies \\"without compensation or consent from the artists\\".","cn":"诉讼称，Stability AI、DeviantArt 和 Midjourney 使用的 Stable Diffusion 工具，是利用从互联网下载 的数十亿张受版权保护的图像进行训练的，而这些公司使用这些图像时“没有向艺术家提供补偿，也未获 得他们的同意”。"},{"en":"The artists are represented by The Joseph Saveri Law Firm and Matthew Butterick.","cn":"这些艺术家由 The Joseph Saveri Law Firm 和 Matthew Butterick 代理。"},{"en":"\\"If Stable Diffusion and similar products are allowed to continue to operate as they do now, the foreseeable result is they will replace the very artists whose stolen works power these AI products with whom they are competing,\\" the law firm wrote in a press release. \\"AI image products are not just an infringement of artists' rights; they will eliminate 'artist' as a viable career path. In addition to obtaining compensation for the wrongful conduct, this lawsuit seeks to prevent that outcome and ensure these products follow the same rules as any other new technology that involves the use of massive amounts of intellectual property. If streaming music can be accomplished within the law, so can AI products.\\"","cn":"该律师事务所在一份新闻稿中写道：“如果允许 Stable Diffusion 及类似产品继续以目前的方式运营，那 么可以预见的结果是，它们将取代那些为这些人工智能产品提供动力、而这些产品正与之竞争的艺术家， 而被取代的正是其作品遭到窃取的艺术家。人工智能图像产品不仅侵犯了艺术家的权利，还将使‘艺术家’ 不再是一条可行的职业道路。除了为不当行为寻求赔偿外，本诉讼还旨在阻止这一结果，并确保这些产品 遵守与任何其他涉及使用大量知识产权的新技术相同的规则。如果音乐流媒体能够在法律框架内实现，人 工智能产品也同样可以做到。”"},{"en":"Since text-to-image generators have increased in popularity in the past year, many artists have been vocalizing their opposition to AI art after seeing their own distorted signatures appear in AI art and finding out that their work was used to train the tools without their permission.","cn":"在过去一年中，随着文本生成图像工具越来越受欢迎，许多艺术家在看到自己扭曲的签名出现在人工智能 生成的艺术作品中，并发现自己的作品未经许可就被用于训练这些工具后，纷纷公开表达对人工智能艺术 的反对。"},{"en":"Not only are many artists furious at the possible copyright violations of AI art, but they have also been frustrated by how AI tools are able to sidestep the labor and art processes they are required to go through. As a result, many artists have been trying to ban AI art from art-sharing platforms.","cn":"许多艺术家不仅对人工智能艺术可能侵犯版权感到愤怒，也因人工智能工具能够绕过他们必须经历的劳动 和艺术创作过程而感到沮丧。因此，许多艺术家一直在试图禁止人工智能艺术进入艺术分享平台。"},{"en":"As AI innovation continues at a rapid speed, it seems that artists and lawmakers are trying to put a brake on further developments before it's too late.","cn":"随着人工智能创新以极快的速度持续发展，艺术家和立法者似乎正试图在为时已晚之前遏制进一步的 发展。"},{"en":"Many tech enthusiasts are still rallying around the promise of AI tools to create detailed images cheaply and quickly - anonymous tech supporters have already published a response to Butterick and Joseph Saveri's lawsuit on a website, using the \\"fair use\\" clause as the basis for why copyrighted images could be used by the tool.","cn":"许多科技爱好者仍在支持人工智能工具能够低成本、快速创作精细图像这一前景；匿名的科技支持者已经 在一个网站上发布了对 Butterick 和 Joseph Saveri 诉讼的回应，以“合理使用”条款为依据，解释为什么 这些受版权保护的图像可以被该工具使用。"},{"en":"Fair use, a legal doctrine that allows for a limited usage of copyrighted materials without permission by the original creators for purposes such as teaching and news sharing, is what a lot of generative model creators claim that their training data is covered by. However, since fair use applies differently to each case, it's hard to make a blanket statement about all works in a dataset as being applicable.","cn":"合理使用是一项法律原则，允许出于教学和新闻传播等目的，在未经原作者许可的情况下有限使用受版权 保护的材料。许多生成模型的创作者声称，他们的训练数据受到这一原则的保护。然而，由于合理使用在 不同案件中的适用方式各不相同，因此很难笼统地断言数据集中的所有作品都适用这一原则。"}],"questions":[{"num":46,"prompt":"Why have three artists brought a lawsuit against Stability AI, DeviantArt, and Midjourney?","options":["They claim that the use of the Stable Diffusion tool is a violation of law.","They claim these companies infringed their intellectual property rights.","They want to stop the use of all AI tools in the creation of art works.","They want to prevent artists from being compelled to rely on AI tools."],"answer":"B","qtype":"细节题","locateEn":"Three artists have brought a lawsuit against Stability AI, DeviantArt, and Midjourney, alleging that the text-to-image AI tools have infringed the rights of thousands of artists.","locateCn":"三位艺术家对Stability AI、DeviantArt和Midjourney提起诉讼，指控这些文本生成图像的 人工智能工具侵犯了数千名艺术家的权利。 46.Why have three artists brought a lawsuit against Stability AI, DeviantArt, and Midjourney? A)They claim that the use of the Stable Diffusion tool is a violation of law. B)They claim these companies infringed their intellectual property rights. C)They want to stop the use of all AI tools in the creation of art works. D)They want to prevent artists from being compelled to rely on AI tools.","translation":""},{"num":47,"prompt":"What will happen if Stable Diffusion and similar products are allowed to continue to operate as they","options":["Intellectual property laws will be hard to enforce.","Fewer artists will invest talent in artistic creation.","Artists will lose their means of subsistence.","Copied works will flood the art market."],"answer":"C","qtype":"细节题","locateEn":"\\"If Stable Diffusion and similar products are allowed to continue to operate as they do now, the foreseeable result is they will replace the very artists whose stolen works power these AI products with whom they are competing,\\" the law firm wrote in a press release. \\"AI image products are not just an infringement of artists' rights; they will eliminate 'artist' as a viable career path.\\"","locateCn":"律师事务所在新闻稿中写道：'如果Stable Diffusion及类似产品被允许继续按现状运营，可 以预见的结果是，它们将取代那些被盗作品正驱动这些产品、且与它们竞争的艺术家本身。' 'AI图像产品不仅侵犯了艺术家的权利；它们将使'艺术家'不再是一条可行的职业道路。'","translation":""},{"num":48,"prompt":"What makes artists furious aside from copyright infringement?","options":["Art works produced with AI tools are not banned from art-sharing platforms.","Text-to-image generators have won such great popularity in the past year.","Their distorted signatures appear more and more frequently in AI art.","AI tools can bypass the considerable labor involved in creating art works."],"answer":"D","qtype":"细节题","locateEn":"Not only are many artists furious at the possible copyright violations of AI art, but they have also been frustrated by how AI tools are able to sidestep the labor and art processes they are required to go through.","locateCn":"许多艺术家不仅对AI艺术可能存在的版权侵权行为感到愤怒，而且还对AI工具如何能够绕开 他们必须经历的劳动和艺术创作过程感到沮丧。","translation":""},{"num":49,"prompt":"What do we learn from the passage about many AI enthusiasts?","options":["They look forward to AI tools creating good-quality art works.","They claim artists can use copyrighted materials just as teachers do.","They support AI's limited use of copyrighted images without permission.","They wish the \\"fair use\\" clause would be applicable to all works in a dataset."],"answer":"C","qtype":"细节题","locateEn":"Many tech enthusiasts are still rallying around the promise of AI tools to create detailed images cheaply and quickly—anonymous tech supporters have already published a response to Butterick and Joseph Saveri's lawsuit on a website, using the \\"fair use\\" clause as the basis for why copyrighted images could be used by the tool.","locateCn":"许多科技爱好者仍在围绕AI工具廉价快速生成精细图像的前景而集结——匿名科技支持者已 在网上发布对Butterick和Joseph Saveri诉讼的回应，援引'合理使用'条款作为该工具可以使 用版权图片的依据。","translation":""},{"num":50,"prompt":"What does the author think of the \\"fair use\\" clause in copyright law?","options":["It may determine the final verdict of the case.","It may not apply to the present legal case.","It does not cover the works of all artists.","It is subject to different interpretations."],"answer":"D","qtype":"态度题","locateEn":"","locateCn":"","translation":""}]},{"paragraphs":[{"en":"On a warm October morning, Daniel Agok woke up to another disappointing day at his school in Wanyjok, South Sudan. The classes he had planned teaching computer skills to aspiring young professionals were canceled, due to an unreliable diesel generator and the absence of a municipal power grid in his area. Now, he would be losing frustrated customers as well as income. Agok is just one of the hundreds of millions of people in sub- Saharan Africa, many of whom are business owners, who still do not have dependable electricity. This inequitable access to energy continues to put their livelihood and future at risk.","cn":"十月一个温暖的早晨，丹尼尔·阿戈克醒来时，迎接他的又是南苏丹瓦尼约克学校里令人失望的一天。由于 柴油发电机运行不稳定，而且他所在地区没有市政电网，他原本计划为有志成为年轻专业人士的人教授计 算机技能的课程被取消了。现在，他不仅会失去因失望而离去的客户，还会损失收入。阿戈克只是撒哈拉 以南非洲数亿人的代表之一，其中许多人是企业主，至今仍没有可靠的电力供应。这种不公平的能源获取 状况持续使他们的生计和未来面临风险。"},{"en":"The current system keeps a lid on the economic talents of people like Agok and his students. We must instead unleash their abilities and let Africa reach its true economic potential. That means wiring Africa with clean, dependable energy.","cn":"现行体系限制了阿戈克及其学生这类人的经济才能。相反，我们必须释放他们的能力，让非洲实现真正的 经济潜力。这意味着要用清洁、可靠的能源为非洲接入电网。"},{"en":"Historically, national governments on the continent have led electrification efforts, but fewer than half of the people surveyed say that the national grid is providing a reliable supply of electricity.","cn":"从历史上看，非洲大陆各国政府一直主导着电气化工作，但接受调查的人中，不到一半表示国家电网能够 提供可靠的电力供应。"},{"en":"This has led to expensive and harmful temporary \\"solutions\\". In Nigeria alone experts estimate people spend $13 billion every year on fuel for toxic, polluting generators. That number will only grow as the continent's population hits 2.5 billion people by 2050. Deploying modern grid infrastructure with speed and at scale is essential to replacing these temporary solutions with reliable and affordable alternatives.","cn":"这导致了昂贵且有害的临时“解决方案”。专家估计，仅在尼日利亚，人们每年就要花费130亿美元购买有 毒且污染环境的发电机燃料。随着非洲大陆人口到2050年达到25亿，这一数字只会继续增长。快速、大 规模部署现代电网基础设施，对于用可靠且价格可负担的替代方案取代这些临时解决方案至关重要。"},{"en":"The rapidly growing private power sector in Africa holds the key to achieving the speed and scale necessary to close the continent's energy access gap. Private companies today are building world-class infrastructure and driving forward economic growth with sustainable business models. In fact, many governments agree and have begun to embrace the private sector as partners in providing reliable power at scale. In South Africa, President Cyril Ramaphosa has streamlined licensing requirements and enlisted the private sector to play a key role.","cn":"非洲迅速发展的私人电力行业，是以实现弥合非洲大陆能源获取缺口所需的速度和规模的关键。如今，私 营企业正在建设世界一流的基础设施，并通过可持续的商业模式推动经济增长。事实上，许多政府对此表 示认同，并已开始接受私营部门作为合作伙伴，以大规模提供可靠电力。在南非，西里尔·拉马福萨总统简 化了许可要求，并邀请私营部门发挥关键作用。"},{"en":"South Africa is just one example. Across the continent, the private sector has delivered power faster and more reliably, and governments are increasingly turning to private partners.","cn":"南非只是其中一个例子。在整个非洲大陆，私营部门以更快的速度提供了更加可靠的电力，各国政府也越 来越多地寻求与私营合作伙伴合作。"},{"en":"With the right funding and structure in place, the private sector will come together to provide this essential service. After all, electrifying sub-Saharan Africa is a $350 billion opportunity.","cn":"只要建立适当的资金和组织架构，私营部门就会联合起来提供这项基本服务。毕竟，为撒哈拉以南非洲实 现电气化蕴含着3500亿美元的机遇。"},{"en":"Today, Daniel Agok is steadily growing his business in South Sudan. His town of Wanyjok was electrified by a private company, providing clean, reliable, and affordable power to his business and his neighbors. Agok now operates his growing computer skills training business smoothly. His classes are no longer affected by the smell and the constant noise of the diesel generator, and he saves money with more affordable power. His students are developing hardware and software skills.","cn":"如今，丹尼尔·阿戈克正在稳步发展他在南苏丹的企业。瓦尼约克镇由一家私营公司实现了电气化，为他的 企业和邻居们提供了清洁、可靠且价格可负担的电力。阿戈克现在可以顺利运营不断发展的计算机技能培 训业务。他的课程不再受到柴油发电机气味和持续噪声的影响，而且借助价格更低的电力，他节省了开 支。他的学生正在培养硬件和软件技能。"}],"questions":[{"num":51,"prompt":"What do we learn about the current electric supply system in Africa?","options":["It curbs the economic development of the continent.","It mainly depends on the polluting diesel generators.","It is the primary cause of inequitable distribution of wealth.","It deprives many Africans of the opportunity to use computers."],"answer":"A","qtype":"细节题","locateEn":"The current system keeps a lid on the economic talents of people like Agok and his students.","locateCn":"当前的电力系统抑制了像Agok和他的学生这样的人的经济才能。","translation":""},{"num":52,"prompt":"What do we learn from the passage about Africa's past electrification efforts?","options":["They have failed to meet most Africans' need of a reliable power supply.","They have failed to build a national grid to provide electric power.","They have unleashed the true economic potential of the continent.","They have aimed at wiring Africa with clean, dependable energy."],"answer":"A","qtype":"细节题","locateEn":"Historically, national governments on the continent have led electrification efforts, but fewer than half of the people surveyed say that the national grid is providing a reliable supply of electricity.","locateCn":"历史上，非洲大陆各国政府主导了电气化工作，但受访人群中不到一半的人表示国家电网提 供了可靠的电力供应。","translation":""},{"num":53,"prompt":"What is essential to tackling the power supply shortage in Africa?","options":["Replacing temporary solutions with long-term strategies.","Accelerating economic growth with sustainable policies.","Restructuring national power generation companies.","Putting in place a large-scale modern power grid speedily."],"answer":"D","qtype":"细节题","locateEn":"Deploying modern grid infrastructure with speed and at scale is essential to replacing these temporary solutions with reliable and affordable alternatives.","locateCn":"快速、大规模部署现代电网基础设施，对于用可靠且负担得起的替代方案取代这些临时措施 至关重要。","translation":""},{"num":54,"prompt":
