ay also incline you to over-invest in something that is no longer a good idea. 想想那段你即使在它已经走到尽头后仍坚持的关系,或者那份尽管老板让你痛苦不堪却仍留守的工作。 我们中的许多人试图抓住最后一线希望,认为我们可以让它成功,无论\\"它\\"是什么。虽然坚持不懈通常是 一种优秀的品质,但它也可能使你过度投资于一件不再明智的事情。 C) As an executive coach, I work with numerous passionate and hard-working leaders who don't want to \\"quit\\". But the smartest leaders learn to discern the difference between quitting too soon and holding onto something that they shouldn't. 作为一名高管教练,我与许多充满热情和勤奋工作的领导者共事,他们不想\\"放弃\\"。但最聪明的领导者学 会辨别过早放弃和坚持不该坚持的事情之间的区别。 D) We are all susceptible to the sunk-cost delusion, an unconscious bias that leads us to persist in an endeavor we have already invested time, effort, or money into — even when abandoning it would be more beneficial. We realize that we can't get back the resources we've given, so we persevere — investing in a project that should be halted, staying in a relationship that should be over, or finishing a book we no longer enjoy and should put down, because we're already halfway through it. If quitting is \\"not your thing\\", you may be especially susceptible to this bias. 我们都容易受到沉没成本谬误的影响,这是一种无意识的偏见,导致我们坚持已经投入了时间、精力或金 钱的事业——即使放弃它会更有益。我们意识到无法收回已经付出的资源,所以我们坚持下去——投资 于应该停止的项目,待在应该结束的关系中,或者读完我们不再喜欢、应该放下的书,因为我们已经读了 一半。如果放弃\\"不是你的风格\\",你可能特别容易受到这种偏见的影响。 E) The sunk-cost delusion causes us to overly worry about what we'll lose if we move on and not think enough about the costs of not moving on. To offset this bias, deliberately refocus your thinking on the gains so you can more objectively weigh the alternatives. Ask yourself: What might I gain by cutting my losses now? Will you be happier or have time for another (better) opportunity? Then ask yourself: What will it cost me to soldier on? For example, is it possible that you'll be throwing more good money after what you've already lost? Or that you won't have the energy to capitalize on other promising possibilities? 沉没成本谬误使我们过分担心如果继续前进会失去什么,而没有充分考虑不继续前进的成本。为了抵消 这种偏见,有意识地将思维重新聚焦于收益,这样你就能更客观地权衡各种选择。问问自己:现在及时止损 我可能获得什么?你会更快乐还是会有时间去把握另一个(更好的)机会?然后问自己:坚持下去会让我付 出什么代价?例如,你是否可能在已经损失的基础上投入更多好钱?或者你是否没有精力去利用其他有前 景的可能性? F) The illusion of control can also interfere with our best judgment, leading us to overestimate our ability to control events and attain a positive outcome. This bias gives us a sense of agency and can promote mental health. However, the bias can also result in escalating commitment to a losing course of action. Especially when combined with an \\"I'm not a quitter\\" mentality, feeling like we have more control over an event or person than we do puts us at risk of doubling down when we should pull out. 控制幻觉也会干扰我们的最佳判断,导致我们高估自己控制事件和获得积极结果的能力。这种偏见给我 们一种掌控感,可以促进心理健康。然而,这种偏见也可能导致对失败行动方针的不断升级投入。特别是 当与\\"我不是放弃者\\"的心态结合时,感觉我们对事件或他人的控制力比实际更强,会使我们在应该退出时 加倍投入,从而面临风险。 G) To counteract this bias, consider your situation and make a simple two-column list of what's in your control and what's not. Think rigorously. While you may be able to influence other people and various circumstances, you can't force them to change or go your way. 为了抵消这种偏见,考虑你的情况并列一个简单的两栏清单,列出什么在你的控制之内,什么不在。严格 思考。虽然你可能能够影响其他人和各种情况,但你不能强迫他们改变或按你的方式行事。 H) Getting clear on what you can control and what you can't is essential to making a quality decision about whether to call it quits or persevere. With a written list in hand, you can ensure you focus on what you can control and better assess whether your continued efforts are worth the expense. Expending effort and emotion on things you can't control can be both draining and disempowering. 弄清楚你能控制什么和不能控制什么,对于就是否放弃还是坚持做出高质量决策至关重要。有了书面清 单在手,你可以确保专注于你能控制的事情,并更好地评估你的持续努力是否值得付出代价。在你无法控 制的事情上花费精力和情感既会令人疲惫又会使人丧失力量。 I) Research indicates that people link their self-identity and social status to their commitments. And because we identify with our commitments, withdrawing from one can feel like a threat to our identity or status. 研究表明,人们将自我认同和社会地位与他们的承诺联系在一起。因为我们认同自己的承诺,从一项承诺 中退出可能感觉像是对我们身份或地位的威胁。 J) Take my client Ryan, a leader at a technology company. Ryan had invested two years and a lot of effort in a design project that wasn't delivering the needed outcomes, but the thought of abandoning it after all she had put in was hard to bear. As Ryan and I explored whether she should cancel the initiative she'd been leading or continue to persevere, she stated, \\"The thing is, I'm not a quitter.\\" This singular, fixed sense of self was clouding her judgment and limiting her choices for action. 以我的客户Ryan为例,她是一家科技公司的领导者。Ryan在一个设计项目上投入了两年时间和大量精 力,但该项目没有产生所需的成果,然而在投入了这么多之后放弃它的想法让她难以承受。当Ryan和我探 讨她是否应该取消她一直领导的这个项目还是继续坚持时,她说:\\"问题是,我不是一个放弃者。\\"这种单 一、固定的自我意识正在影响她的判断并限制她的行动选择。 K) Our self-concept and identity are mental concepts that influence our behavior. If you strongly identify as not being a quitter, you can end up staying stuck in a course of action due to your narrow and rigid self-concept. To overcome this kind of internal obstacle, recall your other positive traits and personality characteristics. Ask yourself: What additional strengths do I have (or aspire to have) that would be helpful to employ here? For example, when I asked Ryan what other positive qualities from her personality she needed to leverage for decision making, she replied, \\"Discernment and bravery.\\" 我们的自我概念和身份是影响我们行为的心理概念。如果你强烈认同自己不是一个放弃者,你最终可能 会因为狭隘和僵化的自我概念而困在某个行动方针中。为了克服这种内在障碍,回想你的其他积极特质 和性格特征。问问自己:我还有(或渴望拥有)什么额外的优势可以在这里运用?例如,当我问Ryan她需要 利用自己性格中的哪些其他积极品质来进行决策时,她回答说:\\"辨别力和勇气。\\" L) Now, examine your situation through the lens of each of these facets of yourself. What does the discerning part of you say? The brave part? Considering your decision through these different characteristics will enable you to see that you have more choices. It's also helpful to seek external sources of information, rather than relying solely on your thinking and instincts. But it's important to think through whose opinions you solicit. 现在,通过你自己的这些不同方面来审视你的情况。你有辨别力的那一面说什么?勇敢的那一面呢?通过 这些不同的特征来考虑你的决定将使你看到你有更多选择。寻求外部信息来源也很有帮助,而不是仅仅 依赖于你的思考和直觉。但重要的是要考虑清楚你征求谁的意见。 M)Ideally, seek out people who are less invested in your decision than you are. If you're considering whether to shut down your entrepreneurial venture, for instance, reach out to other founders as opposed to just your business partner. Similarly, if you're looking for love advice, ask someone removed from the ups and downs of your relationship instead of relying only on your best friend. In all cases, I recommend describing your situation and following up with a question like: \\"How would you manage this situation?\\" 理想情况下,寻找那些对你的决定投入程度不如你的人。例如,如果你正在考虑是否关闭你的创业企业, 请联系其他创始人,而不是仅仅联系你的商业伙伴。同样,如果你在寻求爱情建议,问一个与你关系起伏 保持距离的人,而不是仅仅依赖你最好的朋友。在所有情况下,我建议描述你的情况,然后提出这样的问 题:\\"你会如何处理这种情况?\\" N) Alternately, you could also seek out hard data that illuminates your real chance of success in whatever endeavor you are contemplating. Sticking with the example of the entrepreneurial venture, numbers are your best friend. Use them to remove yourself from the love you have for this idea and consider your burn rate relative to growth plan, industry growth rates, and other factors that predict start-up success. External sources of information can help you see angles and possibilities you might not have considered. 或者,你也可以寻求能够揭示你在正在考虑的任何事业中真正成功机会的硬数据。继续以创业企业为例, 数字是你最好的朋友。用它们来让自己摆脱对这个想法的热爱,考虑你的烧钱率相对于增长计划、行业 增长率以及预测初创企业成功的其他因素。外部信息来源可以帮助你看到你可能没有考虑过的角度和 可能性。 O) When something that seemed so promising at the start doesn't turn out the way we imagined, we can become overly self-critical. Nobody likes to feel that they've made a poor decision, especially if making intelligent decisions is a quality you hold in high esteem. The most effective strategy here is to give yourself a break. Practicing self-compassion increases your resilience( 韧性 ), emotional intelligence, compassion toward others, and can boost your performance as well as help you develop a growth mindset. 当一开始看起来很有希望的事情没有按我们想象的方式发展时,我们可能会变得过度自我批评。没有人 喜欢感觉自己做出了糟糕的决定,特别是如果做出明智决策是你高度重视的品质。这里最有效的策略是 放自己一马。练习自我同情可以增强你的韧性、情商、对他人的同情心,还可以提升你的表现并帮助你 培养成长型思维。 P) Instead of deliberating and criticizing yourself, focus instead on what you can learn from this situation. For example, Ryan recognized she had developed various new skills and leadership capabilities from leading the design project. And despite ultimately deciding to drop it, she was still happy she had tried and grateful for what the experience taught her. 与其深思和批评自己,不如专注于你可以从这种情况中学到什么。例如,Ryan认识到她从领导设计项目 中培养了各种新技能和领导能力。尽管最终决定放弃它,但她仍然为自己尝试过而感到高兴,并对这段经 历教给她的东西心怀感激。 Q) Undeniably, perseverance can help us succeed. But for your well-being, it's important to learn how to distinguish quitting too soon and clinging to a losing course of action. While letting go can be difficult, it will free up your time, energy, and mental space to imagine new possibilities and pursue new opportunities. 不可否认,坚持不懈可以帮助我们成功。但为了你的幸福,学会如何区分过早放弃和坚持失败的行动方针 是很重要的。虽然放手可能很难,但它会释放你的时间、精力和心理空间,让你想象新的可能性并追求新 的机会。 陈述句与逐句解析 当 人 们 感 觉 自 己 对 某 事 或 某 人 的 控 制 力 比 实 际 情 况 更 强 时 , 他 们 会 在 本 应 放 弃 的 时 候 对 追 求 变 得 更 加 执 着 。"}}},"match":{"title":"Do You Know When to Quit Wisely?","paragraphs":{"A":{"en":"Projects, relationships, and jobs don't always work out as planned - and it's not always clear when to give up. We've all repeatedly heard the saying that \\"quitters never win\\", but sometimes the best decision is to cut our losses.","cn":"项目、关系和工作并不总是按计划进行——而且并不总是清楚何时应该放弃。我们都反复听过\\"放弃者 永远不会成功\\"这句话,但有时最好的决定是及时止损。"},"B":{"en":"Think about that relationship you held on to even after it had run its course or the job you stayed in despite your boss making you miserable. Many of us try to hold onto the last ray of hope, thinking we can make it work, whatever \\"it\\" is. And while perseverance is generally an excellent quality, it may also incline you to over-invest in something that is no longer a good idea.","cn":"想想那段你即使在它已经走到尽头后仍坚持的关系,或者那份尽管老板让你痛苦不堪却仍留守的工作。 我们中的许多人试图抓住最后一线希望,认为我们可以让它成功,无论\\"它\\"是什么。虽然坚持不懈通常是 一种优秀的品质,但它也可能使你过度投资于一件不再明智的事情。"},"C":{"en":"As an executive coach, I work with numerous passionate and hard-wo vents and attain a positive outcome. This bias gives us a sense of agency and can promote mental health. However, the bias can also result in escalating commitment to a losing course of action. Especially when combined with an \\"I'm not a quitter\\" mentality, feeling like we have more control over an event or person than we do puts us at risk of doubling down when we should pull out.","cn":"控制幻觉也会干扰我们的最佳判断,导致我们高估自己控制事件和获得积极结果的能力。这种偏见给我 们一种掌控感,可以促进心理健康。然而,这种偏见也可能导致对失败行动方针的不断升级投入。特别是 当与\\"我不是放弃者\\"的心态结合时,感觉我们对事件或他人的控制力比实际更强,会使我们在应该退出时 加倍投入,从而面临风险。"},"G":{"en":"To counteract this bias, consider your situation and make a simple two-column list of what's in your control and what's not. Think rigorously. While you may be able to influence other people and various circumstances, you can't force them to change or go your way.","cn":"为了抵消这种偏见,考虑你的情况并列一个简单的两栏清单,列出什么在你的控制之内,什么不在。严格 思考。虽然你可能能够影响其他人和各种情况,但你不能强迫他们改变或按你的方式行事。"},"H":{"en":"Getting clear on what you can control and what you can't is essential to making a quality decision about whether to call it quits or persevere. With a written list in hand, you can ensure you focus on what you can control and better assess whether your continued efforts are worth the expense. Expending effort and emotion on things you can't control can be both draining and disempowering.","cn":"弄清楚你能控制什么和不能控制什么,对于就是否放弃还是坚持做出高质量决策至关重要。有了书面清 单在手,你可以确保专注于你能控制的事情,并更好地评估你的持续努力是否值得付出代价。在你无法控 制的事情上花费精力和情感既会令人疲惫又会使人丧失力量。"},"I":{"en":"Research indicates that people link their self-identity and social status to their commitments. And because we identify with our commitments, withdrawing from one can feel like a threat to our identity or status.","cn":"研究表明,人们将自我认同和社会地位与他们的承诺联系在一起。因为我们认同自己的承诺,从一项承诺 中退出可能感觉像是对我们身份或地位的威胁。"},"J":{"en":"Take my client Ryan, a leader at a technology company. Ryan had invested two years and a lot of effort in a design project that wasn't delivering the needed outcomes, but the thought of abandoning it after all she had put in was hard to bear. As Ryan and I explored whether she should cancel the initiative she'd been leading or continue to persevere, she stated, \\"The thing is, I'm not a quitter.\\" This singular, fixed sense of self was clouding her judgment and limiting her choices for action.","cn":"以我的客户Ryan为例,她是一家科技公司的领导者。Ryan在一个设计项目上投入了两年时间和大量精 力,但该项目没有产生所需的成果,然而在投入了这么多之后放弃它的想法让她难以承受。当Ryan和我探 讨她是否应该取消她一直领导的这个项目还是继续坚持时,她说:\\"问题是,我不是一个放弃者。\\"这种单 一、固定的自我意识正在影响她的判断并限制她的行动选择。"},"K":{"en":"Our self-concept and identity are mental concepts that influence our behavior. If you strongly identify as not being a quitter, you can end up staying stuck in a course of action due to your narrow and rigid self-concept. To overcome this kind of internal obstacle, recall your other positive traits and personality characteristics. Ask yourself: What additional strengths do I have (or aspire to have) that would be helpful to employ here? For example, when I asked Ryan what other positive qualities from her personality she needed to leverage for decision making, she replied, \\"Discernment and bravery.\\"","cn":"我们的自我概念和身份是影响我们行为的心理概念。如果你强烈认同自己不是一个放弃者,你最终可能 会因为狭隘和僵化的自我概念而困在某个行动方针中。为了克服这种内在障碍,回想你的其他积极特质 和性格特征。问问自己:我还有(或渴望拥有)什么额外的优势可以在这里运用?例如,当我问Ryan她需要 利用自己性格中的哪些其他积极品质来进行决策时,她回答说:\\"辨别力和勇气。\\""},"L":{"en":"Now, examine your situation through the lens of each of these facets of yourself. What does the discerning part of you say? The brave part? Considering your decision through these different characteristics will enable you to see that you have more choices. It's also helpful to seek external sources of information, rather than relying solely on your thinking and instincts. But it's important to think through whose opinions you solicit.","cn":"现在,通过你自己的这些不同方面来审视你的情况。你有辨别力的那一面说什么?勇敢的那一面呢?通过 这些不同的特征来考虑你的决定将使你看到你有更多选择。寻求外部信息来源也很有帮助,而不是仅仅 依赖于你的思考和直觉。但重要的是要考虑清楚你征求谁的意见。"},"M":{"en":"Ideally, seek out people who are less invested in your decision than you are. If you're considering whether to shut down your entrepreneurial venture, for instance, reach out to other founders as opposed to just your business partner. Similarly, if you're looking for love advice, ask someone removed from the ups and downs of your relationship instead of relying only on your best friend. In all cases, I recommend describing your situation and following up with a question like: \\"How would you manage this situation?\\"","cn":"理想情况下,寻找那些对你的决定投入程度不如你的人。例如,如果你正在考虑是否关闭你的创业企业, 请联系其他创始人,而不是仅仅联系你的商业伙伴。同样,如果你在寻求爱情建议,问一个与你关系起伏 保持距离的人,而不是仅仅依赖你最好的朋友。在所有情况下,我建议描述你的情况,然后提出这样的问 题:\\"你会如何处理这种情况?\\""},"N":{"en":"Alternately, you could also seek out hard data that illuminates your real chance of success in whatever endeavor you are contemplating. Sticking with the example of the entrepreneurial venture, numbers are your best friend. Use them to remove yourself from the love you have for this idea and consider your burn rate relative to growth plan, industry growth rates, and other factors that predict start-up success. External sources of information can help you see angles and possibilities you might not have considered.","cn":"或者,你也可以寻求能够揭示你在正在考虑的任何事业中真正成功机会的硬数据。继续以创业企业为例, 数字是你最好的朋友。用它们来让自己摆脱对这个想法的热爱,考虑你的烧钱率相对于增长计划、行业 增长率以及预测初创企业成功的其他因素。外部信息来源可以帮助你看到你可能没有考虑过的角度和 可能性。"},"O":{"en":"When something that seemed so promising at the start doesn't turn out the way we imagined, we can become overly self-critical. Nobody likes to feel that they've made a poor decision, especially if making intelligent decisions is a quality you hold in high esteem. The most effective strategy here is to give yourself a break. Practicing self-compassion increases your resilience (韧性), emotional intelligence, compassion toward others, and can boost your performance as well as help you develop a growth mindset.","cn":"to give yourself a break. Practicing self-compassion increases your resilience( 韧性 ), emotional 当一开始看起来很有希望的事情没有按我们想象的方式发展时,我们可能会变得过度自我批评。没有人 喜欢感觉自己做出了糟糕的决定,特别是如果做出明智决策是你高度重视的品质。这里最有效的策略是 放自己一马。练习自我同情可以增强你的韧性、情商、对他人的同情心,还可以提升你的表现并帮助你 培养成长型思维。"},"P":{"en":"Instead of deliberating and criticizing yourself, focus instead on what you can learn from this situation. For example, Ryan recognized she had developed various new skills and leadership capabilities from leading the design project. And despite ultimately deciding to drop it, she was still happy she had tried and grateful for what the experience taught her.","cn":"与其深思和批评自己,不如专注于你可以从这种情况中学到什么。例如,Ryan认识到她从领导设计项目 中培养了各种新技能和领导能力。尽管最终决定放弃它,但她仍然为自己尝试过而感到高兴,并对这段经 历教给她的东西心怀感激。"},"Q":{"en":"Undeniably, perseverance can help us succeed. But for your well-being, it's important to learn how to distinguish quitting too soon and clinging to a losing course of action. While letting go can be difficult, it will free up your time, energy, and mental space to imagine new possibilities and pursue new opportunities.","cn":"不可否认,坚持不懈可以帮助我们成功。但为了你的幸福,学会如何区分过早放弃和坚持失败的行动方针 是很重要的。虽然放手可能很难,但它会释放你的时间、精力和心理空间,让你想象新的可能性并追求新 的机会。"}},"statements":[{"num":36,"text":"Feeling like they have more control over something or someone than they do, people get more","answer":"F","locateEn":"Especially when combined with an \\"I'm not a quitter\\" mentality, feeling like we have more control over an event or person than we do puts us at risk of doubling down when we should pull out.","locateCn":"尤其当与\\"我不是放弃者\\"的心态结合时，觉得自己对某件事或某个人有比实际更多的掌控 感，会让我们在本该退出时反而加码投入。","anchor":"强锚点"},{"num":37,"text":"If you regard yourself as one who never quits, you may end up trapped in your course of action.","answer":"K","locateEn":"If you strongly identify as not being a quitter, you can end up staying stuck in a course of action due to your narrow and rigid self-concept.","locateCn":"如果你强烈地把自己认同为不是一个放弃者，那么你会因为狭隘僵化的自我概念，最终被困 在某一行动路线里。","anchor":"强锚点"},{"num":38,"text":"One of the author's clients found it hard to give up a design project, in which she had put in a lot of","answer":"J","locateEn":"Ryan had invested two years and a lot of effort in a design project that wasn't delivering the needed outcomes, but the thought of abandoning it after all she had put in was hard to bear. Ryan","locateCn":"在一个迟迟拿不出预期成果的设计项目上投入了两年时间和大量精力，但一想到要在投 入这么多之后放弃它就难以承受。","anchor":"强锚点"},{"num":39,"text":"The author suggests that one should direct their thoughts to the gains of quitting timely so as to","answer":"E","locateEn":"To offset this bias, deliberately refocus your thinking on the gains so you can more objectively weigh the alternatives.","locateCn":"为抵消这一偏差，要刻意把思考重心转向收益，这样你才能更客观地权衡各种选择。 38.One of the author's clients found it hard to give up a design project, in which she had put in a lot of time and effort. 39.The author suggests that one should direct their thoughts to the gains of quitting timely so as to move on.","anchor":"强锚点"},{"num":40,"text":"When making a decision, you'd better ask for opinions of those who have less stake in your decision.","answer":"M","locateEn":"Ideally, seek out people who are less invested in your decision than you are.","locateCn":"理想情况下，要找那些比你在这项决定中投入度更低的人征询意见。","anchor":"强锚点"},{"num":41,"text":"For people associating their identity with their commitments, quitting can feel like their identity is","answer":"I","locateEn":"Research indicates that people link their self-identity and social status to their commitments. And because we identify with our commitments, withdrawing from one can feel like a threat to our identity or status.","locateCn":"研究表明，人们会把自我认同与社会地位与自己的承诺挂钩。正因为我们把自己等同于这些 承诺，退出其中一项就会让人觉得像是对身份或地位的威胁。 40.When making a decision, you'd better ask for opinions of those who have less stake in your decision. 41.For people associating their identity with their commitments, quitting can feel like their identity is threatened.","anchor":"强锚点"},{"num":42,"text":"People who regard highly the quality of making wise decisions do not feel good when they make a","answer":"O","locateEn":"Nobody likes to feel that they've made a poor decision, especially if making intelligent decisions is a quality you hold in high esteem.","locateCn":"没有人喜欢觉得自己做了一个糟糕的决定，尤其当你把做出明智决定视为自己很看重的品 质时。","anchor":"强锚点"},{"num":43,"text":"The wisest leaders learn to distinguish between giving up too soon and sticking with something","answer":"C","locateEn":"But the smartest leaders learn to discern the difference between quitting too soon and holding onto something that they shouldn't.","locateCn":"但最聪明的领导者会学着分辨过早放弃与不该坚持却继续坚持之间的差别。 42.People who regard highly the quality of making wise decisions do not feel good when they make a bad one. 43.The wisest leaders learn to distinguish between giving up too soon and sticking with something irrationally.","anchor":"强锚点"},{"num":44,"text":"When people are thinking of an endeavor, they should dig out reliable data that tells them how likely","answer":"N","locateEn":"Alternately, you could also seek out hard data that illuminates your real chance of success in whatever endeavor you are contemplating.","locateCn":"或者，你也可以去寻找能够照亮你成功真实概率的硬数据，无论你在考虑哪种事业。","anchor":"强锚点"},{"num":45,"text":"Having a clear view of what's in your control and what's not is vital to making a good decision","answer":"H","locateEn":"Getting clear on what you can control and what you can't is essential to making a quality decision about whether to call it quits or persevere.","locateCn":"把自己能控制什么、不能控制什么搞清楚，对于做出关于该放弃还是该坚持的高质量决定至 关重要。 44.When people are thinking of an endeavor, they should dig out reliable data that tells them how likely they are to succeed. 45.Having a clear view of what's in your control and what's not is vital to making a good decision regarding whether to give up or stick it out.","anchor":"强锚点"}]},"careful":[{"paragraphs":[{"en":"As interdependent beings we cannot thrive independent of others. We like to work with people who are like- minded, with whom we share a common interest, or who also believe in a cause we are serious about. This is evident in how we have organized ourselves into various collective groups such as nations, regions, communities, organizations, and families.","cn":"作为相互依存的存在，我们无法独立于他人而兴旺发展。我们喜欢与志同道合的人共事，与我们有共同兴 趣的人共事，或者与同样相信我们所认真对待的事业的人共事。这在我们如何将自己组织成各种集体群体 中表现得很明显，如国家、地区、社区、组织和家庭。"},{"en":"Does the group you belong to have a strong collective consciousness or shared beliefs? Is there interdependence among its members? Do you consider this group a significant part of your existence? If your answers are affirmative, then you are experiencing a micro version of solidarity.","cn":"你所属的群体是否有强烈的集体意识或共同信念？其成员之间是否存在相互依存关系？你是否认为这个群 体是你存在的重要组成部分？如果你的答案是肯定的，那么你正在经历团结的微缩版本。"},{"en":"What is solidarity? Its simplest definition in the dictionary is: \\"... a unifying opinion, feeling, purpose or interest among a group of people.\\"","cn":"什么是团结？字典中对它最简单的定义是：\\"……一群人之间统一的观点、感受、目的或利益。\\""},{"en":"In this increasingly diverse society we live in, solidarity takes on a complex and multifaceted character as it forms bonds of interdependence among unique individuals living in a fast-changing environment and working within a complex division of labor.","cn":"在我们生活的这个日益多元化的社会中，团结呈现出复杂和多面的特征，因为它在生活于快速变化的环境 中并在复杂的劳动分工中工作的独特个体之间形成相互依存的纽带。"},{"en":"One facet of solidarity fits well with the principles of communitarianism (社 群 主 义). In this setting, individuals give up their own interests to serve the common good. However, its strict adherence to social cohesiveness and exclusiveness restricts expression and practice of individual differences and preferences. Consequently, individuality and autonomy is sacrificed to maintain the unity of the group.","cn":"团结的一个方面与社群主义的原则非常契合。在这种情况下，个人放弃自己的利益来服务于共同利益。然 而，它对社会凝聚力和排他性的严格遵守限制了个体差异和偏好的表达和实践。因此，个性和自主性被牺 牲以维护群体的团结。"},{"en":"Solidarity is also viewed as a reaction to the extreme emphasis on individualism and freedom of choice. It goes against the liberal idea of unrestricted individuals who see society as a hindrance to their freedom to make choices and to act according to what is good for them regardless of how these will affect others.","cn":"团结也被视为对过度强调个人主义和选择自由的一种反应。它反对自由主义关于不受限制的个人的观念， 这些个人将社会视为阻碍他们自由做出选择和根据对自己有利的事情行事的障碍，而不管这些会如何影响 他人。"},{"en":"But despite its many facets, social theorists have viewed solidarity as a key factor in bringing about order and progress in society. They believe that for human society to survive as it becomes more diverse, more new bonds need to be formed based on the differences. In the light of this, they regard a genuine solidarity as more than just shallow relationships based on common interests. Solidarity is not just a product of strategic calculations of how much it will benefit the self. It is not an exclusive class founded on the you-and-me-against- the-world principle. Rather, it is inclusive and is not forced. Acting out of solidarity means supporting and standing up for each other - in recognition that one's fate is in the fate of the other. It is a bond characterized by cooperative practices and strengthened by the concern for the well-being of others or the common good. It fights for the protection of human dignity and listens to and acts on the cries of the most vulnerable.","cn":"但尽管团结有许多方面，社会理论家将团结视为给社会带来秩序和进步的关键因素。他们认为，随着人类 社会变得更加多元化，要使其生存下去，就需要基于差异形成更多新的纽带。鉴于此，他们认为真正的团 结不仅仅是基于共同利益的肤浅关系。团结不仅仅是关于它将给自我带来多少利益的战略计算的产物。它 不是建立在你我对抗世界原则基础上的排他性阶层。相反，它是包容性的，不是强制的。出于团结而行动 意味着相互支持和挺身而出——认识到一个人的命运在于另一个人的命运之中。这是一种以合作实践为特 征、以对他人福祉或共同利益的关注而得到加强的纽带。它为保护人类尊严而战，倾听并回应最脆弱者的 呼声。"}],"questions":[{"num":46,"prompt":"What does the author say about human beings?","options":["They cannot prosper without cooperating with each other.","They share a common interest and believe in a just cause.","They think and behave alike in different social groups.","They cannot gain independence without fighting for it."],"answer":"A","qtype":"细节题","locateEn":"As interdependent beings we cannot thrive independent of others.","locateCn":"作为相互依赖的存在，我们无法脱离他人独自繁荣兴盛。","translation":""},{"num":47,"prompt":"What do we learn about solidarity in an increasingly diverse society?","options":["It gives rise to a complicated division of labor.","It involves many aspects with great complexity.","It brings individuals together as environment changes.","It embraces the characteristics of different individuals."],"answer":"B","qtype":"细节题","locateEn":"In this increasingly diverse society we live in, solidarity takes on a complex and multifaceted character as it forms bonds of interdependence among unique individuals living in a fast- changing environment and working within a complex division of labor.","locateCn":"在我们所处的这个日益多元化的社会里，solidarity 呈现出复杂而多面的特征，因为它在快 速变化的环境中、在复杂的分工内部，于各不相同的个体之间形成了相互依赖的纽带。","translation":""},{"num":48,"prompt":"What would we witness in the setting of communitarianism?","options":["Ruling of social norms and ridding of individuality.","Emphasis on the adherence to individual differences.","Sacrifice of personal interests for the common good.","Elimination of individualism and personal choices."],"answer":"C","qtype":"细节题","locateEn":"In this setting, individuals give up their own interests to serve the common good.","locateCn":"在这种情境下，个人放弃自身利益以服务于共同利益。","translation":""},{"num":49,"prompt":"What does solidarity entail according to the passage?","options":["A limit to personal differences.","An opposition to individualism.","A hindrance to social advancement.","An inevitable end to liberal pursuits."],"answer":"B","qtype":"细节题","locateEn":"Solidarity is also viewed as a reaction to the extreme emphasis on individualism and freedom of choice. solidarity","locateCn":"也被视为对极端强调个人主义与选择自由的一种反应（反对）。","translation":""},{"num":50,"prompt":"What do social theorists think of solidarity?","options":["It is especially relevant to the most vulnerable.","It is most effective in protecting human dignity.","It is essential to progress and order in society.","It is indispensable to avoiding shallow relationships."],"answer":"C","qtype":"细节题","locateEn":"But despite its many facets, social theorists have viewed solidarity as a key factor in bringing about order and progress in society.","locateCn":"但是，尽管 solidarity 有诸多面向，社会理论家们仍把它视为推动社会秩序与进步的关键 因素。","translation":""}]},{"paragraphs":[{"en":"People who repeatedly give unwanted advice can be well-meaning and genuinely want to help. Others might do this out of a sense of self-worth around the ability to influence others. One study found that people with a high tendency to seek power were more likely to give advice than those with an opposite tendency.","cn":"反复提供不请自来的建议的人可能出于好意,真心想要帮忙。另一些人这样做可能是出于一种围绕影响他人 能力的自我价值感。一项研究发现,权力寻求倾向高的人比倾向相反的人更容易给出建议。"},{"en":"Under the guise (外表) of unselfishness, people may be driven to give you unwanted advice because it makes them feel powerful or in control. They may not be fully aware of this drive, however.","cn":"在无私的外表下,人们可能被驱使给你提供不想要的建议,因为这让他们感到强大或能够掌控。然而,他们可 能并未完全意识到这种驱动力。"},{"en":"These people may also display a problematic degree of emotional vulnerability, becoming upset very quickly, and taking a long time to calm down. It is possible that their emotions were only validated in childhood when they were at their loudest, encouraging them to adopt responses to discomfort that are excessive in most situations.","cn":"这些人还可能表现出问题性的情绪脆弱程度,很快变得心烦意乱,需要很长时间才能平静下来。有可能他们 的情绪在童年时期只有在最大声时才得到认可,这促使他们采用在大多数情况下都过度的不适应对方式。"},{"en":"When someone is giving advice in order to make themselves feel more powerful, there is underlying anxiety to their behavior that recipients of the advice tend to notice. It can be tempting in this situation to react harshly to the advice giver and to accuse them of being manipulative, but this approach might produce an undesired result.","cn":"当某人为了让自己感觉更强大而给出建议时,他们的行为背后有焦虑,建议的接受者往往会注意到这一点。 在这种情况下,对建议给予者做出严厉反应并指责他们具有操纵性可能很诱人,但这种方法可能会产生不希 望的结果。"},{"en":"If the act of giving advice is contributing actively to someone's feelings of self-worth, an outright (直率的) rejection may be perceived as a threat, activating their fight-or-flight response, possibly causing them to double down on their validation-seeking behavior, or leading to a larger conflict.","cn":"outright( 直率的 ) rejection may be perceived as a threat, activating their fight-or-flight response, possibly 如果给出建议的行为正在积极促成某人的自我价值感,直率的拒绝可能被视为一种威胁,激活他们的战斗或 逃跑反应,可能导致他们加倍寻求认可的行为,或导致更大的冲突。"},{"en":"The key is to validate without over-identifying. You can let them know that you have heard them and appreciate where they are coming from without taking on the potentially damaging narrative that you could not have gotten by without their help. You had better say something like, \\"Thanks for the idea. I have my own plan for handling this, but I really appreciate your perspective and will take it into consideration. Can I let you know when I need help in the future?\\"","cn":"关键是要认可但不要过度认同。你可以让他们知道你听到了他们的意见,理解他们的出发点,而不必接受那 种可能有害的叙事,即没有他们的帮助你就无法做到。你最好说些类似这样的话:'感谢你的想法。我有自己 处理这件事的计划,但我真的很感激你的观点,会将它纳入考虑。将来我需要帮助时可以告诉你吗?'"},{"en":"If you have trouble setting boundaries tactfully, prioritize working on your own ability to self-regulate. As uncomfortable as it may make you continuously receiving unwanted advice, if you can respond with compassion, the situation will likely diffuse much faster.","cn":"如果你在巧妙地设定界限方面有困难,优先致力于提高自己的自我调节能力。尽管持续接受可能令人不舒 服,但如果你能以同情心回应,情况可能会更快缓和。"},{"en":"Though it is usually not the intended outcome of giving unsolicited advice, many who receive it often feel stressed, offended, or simply annoyed by unwanted suggestions. Setting a boundary in this regard, if you feel you need one, is perfectly reasonable and something that can bring you increased emotional safety.","cn":"尽管这通常不是主动提供建议的预期结果,但许多接受建议的人常常因不想要的建议而感到压力、被冒犯或 只是感到恼火。在这方面设定界限,如果你觉得需要,是完全合理的,也是能给你带来更多情感安全的事情。"},{"en":"It is best to set boundaries in a way that takes into account the individual's underlying reasons for doing what they are doing to avoid unnecessary conflict and more stress.","cn":"最好以考虑到个人做事的潜在原因的方式设定界限,以避免不必要的冲突和更多压力。"}],"questions":[{"num":51,"prompt":"What is the finding of one study about people who keep giving unsolicited advice?","options":["They turn out to be well-meaning.","They are genuinely kind-hearted.","They are capable of influencing others.","They are inclined to crave for power."],"answer":"D","qtype":"细节题","locateEn":"One study found that people with a high tendency to seek power were more likely to give advice than those with an opposite tendency.","locateCn":"一项研究发现，求权欲望强的人比求权欲望相反（低）的人更倾向于给出建议。","translation":""},{"num":52,"prompt":"What is the problem with people who are driven to give you unsolicited advice?","options":["They may be quick to upset others.","They may be emotionally vulnerable.","They want their voice to be the loudest.","They respond to discomfort excessively."],"answer":"B","qtype":"细节题","locateEn":"These people may also display a problematic degree of emotional vulnerability, becoming upset very quickly, and taking a long time to calm down.","locateCn":"这些人还可能表现出某种程度上有问题的情绪脆弱性——很快就情绪激动，且久久不能 平复。","translation":""},{"num":53,"prompt":"What is the advice receiver tempted to do when noticing the advice giver's underlying anxiety?","options":["Reveal the undesired result of their approach.","Refuse their advice in an undisguised manner.","Bring their real motives to the surface.","Accuse them of trying to control others."],"answer":"D","qtype":"细节题","locateEn":"It can be tempting in this situation to react harshly to the advice giver and to accuse them of being manipulative, but this approach might produce an undesired result.","locateCn":"在这种情况下，人很容易被诱使去强硬回怼劝告者并指责他们在操控自己，但这种做法可能 导致不希望出现的结果。","translation":""},{"num":54,"prompt":"How is the advice giver likely to react to the rejection of their advice?","options":["They may regard it as a threat.","They may modify their behavior.","They get ready for a larger conflict.","They begin to doubt their self-worth."],"answer":"A","qtype":"细节题","locateEn":"If the act of giving advice is contributing actively to someone's feelings of self-worth, an outright rejection may be perceived as a threat, activating their fight-or-flight response, possibly causing them to double down on their validation-seeking behavior, or leading to a larger conflict.","locateCn":"如果给建议这一行为正主动地构建着对方的自我价值感，那么一次直率的拒绝可能被对方视 为威胁，激活其“战或逃”反应，可能导致他们加倍寻求认可，或引发更大的冲突。","translation":""},{"num":55,"prompt":"What should the advice receiver do to avoid unnecessary conflict?","options":["Concede the advice is perfectly reasonable.","Give their reasons for not taking the advice.","Understand why the advice giver offers the advice.","Explain their chosen way of handling the situation."],"answer":"C","qtype":"细节题","locateEn":"It is best to set boundaries in a way that takes into account the individual's underlying reasons for doing what they are doing to avoid unnecessary conflict and more stress.","locateCn":"最好以一种顾及当事人行为背后深层动机的方式来设界限，以避免不必要的冲突和更多 压力。","translation":""}]}],"listening":[{"kind":"conversation","segments":[{"speaker":"W","en":"I must say, I love our canteen! It's such a great meeting point!","cn":"我必须说，我太爱我们的食堂了！它真是个很棒的聚会地点！"},{"speaker":"M","en":"Yeah, it really is, both for students and teachers. Shame about the food.","cn":"是啊，确实是，对学生和老师都是。可惜吃的不行。"},{"speaker":"W","en":"What do you mean? I think the food is fine.","cn":"你什么意思？我觉得吃的挺好的啊。"},{"speaker":"M","en":"I would say the food is just OK, but the prices are absurd. Don't you agree?","cn":"我觉得吃的只能说还行，但价格太离谱了。你不同意吗？"},{"speaker":"W","en":"I don't, actually. I personally think they're perfectly appropriate. If it's overpriced, why does it get so frantically busy at lunchtimes?","cn":"我不同意，真的。我个人认为价格完全合理。如果真的太贵，为什么午餐时间挤得要命？"},{"speaker":"M","en":"Hmm, you make a good point. I guess a lot of it is good value, maybe even most of it. However, don't you think 6 bucks for a slice of apple crumble is beyond most students' budgets?","cn":"嗯，你说得有道理。我想很多东西确实物有所值，甚至大部分都是。不过，你不觉得一块苹果酥皮派 要6美元超出了大多数学生的预算吗？"},{"speaker":"W","en":"Um, yes, desserts are overpriced. I'll give you that. To be honest, I've forgotten about those, as I never eat them. I never really crave sweet things or any fancy delicacies. What I always go for is their scrambled eggs. They have such a great variety.","cn":"嗯，是的，甜点确实太贵了。这点我承认。说实话，我都忘了那些东西，因为我从来不吃。我从来不 太想吃甜食或什么精致的美食。我总是点他们的炒鸡蛋。他们的种类特别多。"},{"speaker":"M","en":"Yeah, those are good. They also come out really fast. Actually, that's one of the best things about the canteen — the speed. If I fancy something more substantial than a sandwich, but I don't have much time for lunch, the university canteen is always a good option. The kitchen staff work at such a brisk pace. They really deserve to be complimented for it.","cn":"是啊，那些不错。而且出餐特别快。其实，这是食堂最棒的一点——速度快。如果我想吃点比三明治 更实在的东西，但午餐时间又不多，大学食堂总是个好选择。厨房员工工作节奏真快。他们真值得表扬。"},{"speaker":"W","en":"Totally, and it's such a great environment too. Like the entire building is beautiful.","cn":"完全同意，而且环境也特别好。整栋楼都很漂亮。"},{"speaker":"M","en":"It is very nice.","cn":"确实很不错。"},{"speaker":"W","en":"The massive glass windows make all the difference. I think they're so cool. Apparently, they did a massive renovation a few years ago. It cost them a pretty penny.","cn":"那些巨大的玻璃窗让一切都不一样了。我觉得它们太酷了。听说几年前他们大装修了一次。花了不 少钱。"},{"speaker":"M","en":"Yeah, I'm not surprised. It's a very versatile space, suitable both for eating and relaxing.","cn":"是啊，不意外。这是个很多功能的空间，既适合吃饭也适合放松。"},{"speaker":"W","en":"And for working.","cn":"还有工作。"},{"speaker":"M","en":"You're right, working too. I've used my laptop there once or twice. And there's always a group project or meeting going on at the far end.","cn":"你说得对，还有工作。我在那儿用过一两次笔记本电脑。而且最里面总有小组项目或开会的。"}],"questions":[{"prompt":"What does the woman say about the food at the canteen?","translation":"女士对食堂的食物有何评价?","options":["It is absurdly expensive.","It is appropriately priced.","It brings shame on the university.","It caters to students and teachers."],"answer":"B","qtype":"态度观点题","locateEn":"W: I don't, actually. I personally think they're perfectly appropriate.","locateCn":"女：其实我不同意。我个人觉得它们（价格）完全合理。","signal":"被问者的直接应答 + 转折否定。男士先抛出 the prices are absurd 并反问 Don't you","num":1},{"prompt":"How does the woman feel about the canteen's sweet things or fancy delicacies?","translation":"女士对食堂的甜食或精致美食有何感受?","options":["They never really appeal to her.","They are never actually good value.","They are within students' budgets.","They always come at a high speed."],"answer":"A","qtype":"态度观点题","locateEn":"I never really crave sweet things or any fancy delicacies.","locateCn":"我从来都不怎么想吃甜食或者什么精致美味。","signal":"含蓄否定 never...crave 表态度。女士说 I never really crave sweet things or any fancy","num":2},{"prompt":"What does the man say is one of the best things about the canteen?","translation":"男士说食堂最好的一点是什么?","options":["The food.","The space.","The speed.","The environment."],"answer":"C","qtype":"细节题","locateEn":"Actually, that's one of the best things about the canteen — the speed.","locateCn":"其实，那是这个食堂最棒的一点之一——速度。","signal":"最高级 one of the best 后直接点名。男士说 that's one of the best things about the","num":3},{"prompt":"What did the canteen undergo a few years ago?","translation":"食堂几年前经历了什么?","options":["A complete refurnishing.","A ruinous burning down.","A substantial expansion.","A massive renovation."],"answer":"D","qtype":"细节题","locateEn":"Apparently, they did a massive renovation a few years ago.","locateCn":"据说他们几年前做过一次大规模的翻新。","signal":"时间状语 a few years ago 标记答案句。女士说 they did a massive renovation a few","num":4}]},{"kind":"conversation","segments":[{"speaker":"W","en":"Hi, Tony, today we're talking about how managers can get along better with young people at work. We often hear young people today have a poor work ethic. That's not really justified though, is it?","cn":"嗨,Tony,今天我们要谈谈管理者如何更好地与工作中的年轻人相处。我们经常听到说如今的年轻人缺乏 职业道德。不过这其实并不合理,对吧?"},{"speaker":"M","en":"Not really. In reality, young people of this age group are as varied and multifaceted as any other generation.","cn":"确实不合理。实际上,这个年龄段的年轻人和其他任何一代人一样多样化和多面化。"},{"speaker":"W","en":"Yeah, but if you are struggling to work with young people in your workspace, what can you do?","cn":"是的,但如果你在工作场所与年轻人合作时遇到困难,你能做些什么呢?"},{"speaker":"M","en":"Well, it's essential to connect with them to learn about their values. It's also really important to recognize the way young people want to balance their work life with their personal life.","cn":"嗯,与他们建立联系以了解他们的价值观是非常重要的。同样非常重要的是要认识到年轻人希望平衡工 作生活和个人生活的方式。"},{"speaker":"W","en":"So they generally don't want to defer happiness in return for career advancement?","cn":"所以他们通常不愿意为了职业晋升而推迟幸福?"},{"speaker":"M","en":"Absolutely. They are not willing to sacrifice their personal lives for their work lives and this leads people to equate that with an unwillingness to work hard.","cn":"完全正确。他们不愿意为了工作生活而牺牲个人生活,这导致人们将其等同于不愿意努力工作。"},{"speaker":"W","en":"Right. But that couldn't be further from the truth, could it?","cn":"对。但这与事实相去甚远,不是吗?"},{"speaker":"M","en":"Young people will work extremely hard during their defined work hours, but they expect to have their time off, like weekends and nights free from work.","cn":"年轻人会在规定的工作时间内极其努力地工作,但他们期望拥有自己的休息时间,比如周末和晚上不受工 作打扰。"},{"speaker":"W","en":"So how should managers go about assessing young people's productivity?","cn":"那么管理者应该如何评估年轻人的生产力呢?"},{"speaker":"M","en":"Generally, young people believe their productivity should not be measured by the number of hours they work, since someone can work for eight hours and accomplish next to nothing of significance for the company. Instead, young people measure their productivity levels by the quality of the work they perform.","cn":"一般来说,年轻人认为他们的生产力不应该用工作时长来衡量,因为有人可以工作八小时却几乎没为公司 完成任何有意义的事情。相反,年轻人通过他们所完成工作的质量来衡量自己的生产力水平。"},{"speaker":"W","en":"But we often hear that young people want to feel more than just being a part of a big machine. Such a perspective can be hard to discredit, can't it?","cn":"但我们经常听到年轻人想要感觉自己不只是大机器中的一部分。这样的观点很难被否定,对吧?"},{"speaker":"M","en":"It's important to legitimize their work. Young workers want to work on projects that matter to themselves, the company or the world at large. They must feel the need to stay working at a company whose values align with their own.","cn":"使他们的工作合理化是很重要的。年轻员工想要从事对自己、对公司或对整个世界都重要的项目。他 们必须感到有必要继续在一家价值观与自己相符的公司工作。"},{"speaker":"W","en":"Thanks for your advice.","cn":"谢谢你的建议。"}],"questions":[{"prompt":"According to the woman, what view about today's young people is not really justified?","translation":"根据这位女士的说法,关于当今年轻人的哪种看法其实并不合理?","options":["They have a poor work ethic.","They don't get along with managers.","They are struggling in the workplace.","They aren't as varied as their predecessors."],"answer":"A","qtype":"细节题","locateEn":"We often hear young people today have a poor work ethic. That's not really justified though, is it?","locateCn":"我们常听说如今的年轻人职业道德差。不过这种说法其实站不住脚，对吧？","signal":"女方自问句 + that's not justified。答案句出自女方之口：先抛出常见说法 young","num":5},{"prompt":"What does the man say is important for managers to get along better with","translation":"这位男士认为管理者要与年轻员工更好地相处,什么是重要的?","options":["Learning about the way they adhere to their own values.","Recognizing how they try to strike a work-life balance.","Knowing how they struggle to connect with managers.","Understanding the way they seek career advancement."],"answer":"B","qtype":"细节题","locateEn":"Well, it's essential to connect with them to learn about their values. It's also really important to recognize the way young people want to balance their work life with their personal life.","locateCn":"嗯，与他们建立联系、了解他们的价值观是必不可少的。同样很重要的是，认识到年轻人想 要平衡工作与个人生活的方式。","signal":"两个强调句 essential / important。男方连用 it's essential to 和 It's also really","num":6},{"prompt":"How do young people measure their productivity levels according to the man?","translation":"根据这位男士的说法,年轻人如何衡量他们的生产力水平?","options":["In terms of the number of hours spent.","By the amount of work they perform.","In terms of the work done in 8 hours.","By the quality of the work they do."],"answer":"D","qtype":"细节题","locateEn":"Generally, young people believe their productivity should not be measured by the number of hours they work, since someone can work for eight hours and accomplish next to nothing of significance for the company. Instead, young people measure their productivity levels by the quality of the work they perform.","locateCn":"一般来说，年轻人认为生产力不应以工作的小时数来衡量，因为有人可能干了八小时却几乎 没为公司做出任何有意义的成果。相反，年轻人是以他们所做工作的质量来衡量生产力的。","signal":"not…by hours, Instead…by quality。男方先用 should not be measured by the","num":7},{"prompt":"What companies does the man think would appeal to young workers?","translation":"这位男士认为什么样的公司会吸引年轻员工?","options":["Those whose culture facilitates their advancement.","Those allowing them to do projects of their choice.","Those whose values align with their own.","Those refraining from discrediting their perspectives."],"answer":"C","qtype":"细节题","locateEn":"Young workers want to work on projects that matter to themselves, the company or the world at large. They must feel the need to stay working at a company whose values align with their own.","locateCn":"年轻员工想做对自己、对公司或对整个世界都有意义的项目。他们必然会想留在一家价值观 与自己一致的公司。","signal":"末段总结句 a company whose values align。对话收尾男方给出结论 stay working at a","num":8}]},{"kind":"passage","segments":[{"speaker":"","en":"Many restaurants are trying to persuade customers to eat more sustainably, moving away from environmentally unfriendly meat towards greener dishes. Although it sounds counter-intuitive, restaurants which include specific vegetarian sections on their menus may be unintentionally encouraging customers to eat meat, a new study suggests.","cn":"许多餐厅正试图说服顾客更可持续地饮食，从对环境不友好的肉类转向更环保的菜肴。一项新研究表明， 尽管听起来有违直觉，但在菜单上设置专门素食区的餐厅可能会无意中鼓励顾客吃肉。"},{"speaker":"","en":"Behavioral scientist Linda Bacon, one of the study's authors, said, \\"Restaurants can have a positive impact on the environment by encouraging their customers to choose more plant-based food and less meat. However, our findings suggest that while certain restaurant menu designs can encourage some consumers to make pro-environmental food choices, they can have the opposite effect on others.\\" The study involved 750 people, half of whom frequently ate vegetarian food and half of whom rarely ate it. No vegetarians were included. They were given different menus and asked to choose a meal as if they were eating out with friends. Placing vegetarian dishes in a separate section did not have a significant effect on the choices made by infrequent vegetarian food eaters. But it did have a notable effect on the frequent eaters, lowering their chance of picking a vegetarian option by 65%. The researchers also discovered that presenting a vegetarian dish as the chef's recommendation, or including a more appealing description of a non-meat meal, leads to a greater proportion of infrequent vegetarian eaters choosing a vegetarian option. But again, these altered menu designs backfired with those who ate vegetarian food more frequently, leading them to be less likely to choose a vegetarian dish.","cn":"该研究的作者之一、行为科学家Linda Bacon说：\\"餐厅可以通过鼓励顾客选择更多植物性食物和更少肉类 来对环境产生积极影响。然而,我们的研究结果表明,虽然某些餐厅菜单设计可以鼓励一些消费者做出有利 于环境的食物选择,但它们可能对其他人产生相反的效果。\\"这项研究涉及750人,其中一半人经常吃素食,另 一半人很少吃素食。研究不包括素食主义者。他们拿到不同的菜单,并被要求选择一餐,就像和朋友外出就 餐一样。将素食菜肴放在单独的区域对不常吃素食者的选择没有显著影响。但它确实对常吃素食者产生了 显著影响,使他们选择素食选项的可能性降低了65%。研究人员还发现,将素食菜肴作为厨师推荐呈现,或加 入对非肉类餐食更具吸引力的描述,会导致更大比例的不常吃素食者选择素食选项。但这些改变的菜单设计 再次对那些更频繁吃素食的人适得其反,导致他们不太可能选择素食菜肴。"}],"questions":[{"prompt":"What does a new study suggest about restaurants including vegetarian sections on","translation":"一项新研究对餐厅在菜单上包含素食区域有何看法?","options":["They may unconsciously help customers choose greener dishes.","They may unintentionally encourage customers to eat meat.","They raise customers' environmental awareness.","They enable customers to eat in a healthy way."],"answer":"B","qtype":"细节题","locateEn":"Although it sounds counter-intuitive, restaurants which include specific vegetarian sections on their menus may be unintentionally encouraging customers to eat meat, a new study suggests.","locateCn":"尽管听起来有违直觉，但一项新研究表明，在菜单上专门设素食专区的餐厅，可能正无意中 鼓励顾客去吃肉。","signal":"让步转折Although后是真意。句首 Although it sounds counter-intuitive（尽管听起来违","num":9},{"prompt":"How was the study carried out on 750 participants?","translation":"对750名参与者进行的研究是如何开展的?","options":["By inviting them to taste different kinds of food.","By observing the eating behavior of strict vegetarians.","By comparing participants eating vegetarian food frequently with those doing so rarely.","By requiring participants to choose a meal as if they were feasting at a family gathering."],"answer":"C","qtype":"细节题","locateEn":"The study involved 750 people, half of whom frequently ate vegetarian food and half of whom rarely ate it. No vegetarians were included.","locateCn":"研究共有750人参与，其中一半人经常吃素食，另一半人很少吃素食。没有素食者被纳入 研究。","signal":"数字750与分组描述句。听到题干里的数字 750 出现在 The study involved 750 people，","num":10},{"prompt":"How do altered menu designs affect frequent eaters of vegetarian food?","translation":"改变后的菜单设计如何影响经常食用素食的人?","options":["They are less likely to choose a vegetarian dish.","They find vegetarian dishes become more appealing.","They tend to consume larger portions of unhealthy food.","They are less likely to choose dishes recommended by chefs."],"answer":"A","qtype":"细节题","locateEn":"But again, these altered menu designs backfired with those who ate vegetarian food more frequently, leading them to be less likely to choose a vegetarian dish.","locateCn":"但同样地，这些改动过的菜单设计对那些更常吃素食的人产生了反效果，使他们更不可能去 选一道素菜。","signal":"But again转折指向常吃者。But again 是转折信号，前一句讲改菜单让\\"少吃素的人\\"更愿","num":11}]},{"kind":"passage","segments":[{"speaker":"","en":"Nottingham Trent University and the Chinese Academy of Sciences have been trying to find a way to prevent deadly outdoor air pollution from penetrating indoors. They found that if pollution is frozen to around –18 ℃  in a condensing tube, the particles gather together and fall to the bottom, allowing fresh, clean air to pass through. Their method was able to remove 99% of pollutants. It is hoped that the work could pave the way for simple modification of air conditioning units so that they can also clean polluted indoor air.","cn":"Nottingham Trent University和中国科学院一直在尝试寻找一种方法来防止致命的室外空气污染渗透到 室内。他们发现，如果在冷凝管中将污染物冷冻到约–18℃，颗粒物会聚集在一起并沉降到底部，从而让 新鲜、洁净的空气通过。他们的方法能够去除99%的污染物。希望这项工作能够为空调设备的简单改造铺 平道路，使其也能清洁受污染的室内空气。"},{"speaker":"","en":"Outdoor air pollution in cities is a global problem, whether it be haze plaguing Calcutta or poor air impacting the health of children in London schools. While there are some existing technologies to purify indoor air, they can be inefficient, expensive or produce harmful by-products. When outdoor air quality is poor, people tend to spend even more time indoors. But outdoor pollution also leads to indoor pollution, and people still suffer. It is estimated that pollution is linked to over 40,000 early deaths in Britain each year. Professor Gang Pan of the Chinese Academy of Sciences said, \\"We have shown in our experiments that simply by circulating polluted air through a small freezing chamber, we can remove most of the fine particles and gas pollutants. Our study makes it possible to add an air cleaner option to household appliances in areas which might experience extremely poor air conditions. By controlling indoor air pollution and improving air quality in this way, this work could be greatly beneficial to public health.\\"","cn":"城市室外空气污染是一个全球性问题，无论是困扰Calcutta的雾霾还是影响伦敦学校儿童健康的恶劣空 气。虽然现有一些净化室内空气的技术，但它们可能效率低下、成本高昂或产生有害副产品。当室外空气 质量差时，人们往往会在室内待更长时间。但室外污染也会导致室内污染，人们仍然会受到影响。据估 计，英国每年有超过40,000例早死与污染有关。中国科学院的潘刚教授说：\\"我们在实验中证明，仅仅通 过让受污染的空气循环通过一个小型冷冻室，我们就能去除大部分细颗粒物和气体污染物。我们的研究使 得在可能经历极端恶劣空气条件的地区，为家用电器增加空气净化功能成为可能。通过以这种方式控制室 内空气污染和改善空气质量，这项工作可能对公共健康大有裨益。"}],"questions":[{"prompt":"What does the passage say about Nottingham Trent University and the Chinese","translation":"文章关于诺丁汉特伦特大学和中国科学院说了什么?","options":["They have found a solution to the global problem of air pollution.","They have managed to freeze polluting particles to around –18 °C.","They have been seeking a way to prevent pollutants from penetrating indoors.","They have been cooperating closely on developing a new type of air-conditioner."],"answer":"C","qtype":"细节题","locateEn":"Nottingham Trent University and the Chinese Academy of Sciences have been trying to find a way to prevent deadly outdoor air pollution from penetrating indoors.","locateCn":"诺丁汉特伦特大学与中国科学院一直在设法找到一种途径，阻止致命的室外空气污染渗入 室内。","signal":"段首总述句。录音开篇第一句就以两家机构为主语作总述：have been trying to find a","num":12},{"prompt":"What do we learn from the passage about existing technologies to purify indoor air?","translation":"从文章中我们了解到关于现有净化室内空气技术的什么信息?","options":["They can be costly and inefficient.","They are constantly being perfected.","They are by-products of health research.","They can save over 40,000 lives each year."],"answer":"A","qtype":"细节题","locateEn":"While there are some existing technologies to purify indoor air, they can be inefficient, expensive or produce harmful by-products.","locateCn":"虽然已有一些净化室内空气的现有技术，但它们可能低效、昂贵，或产生有害的副产品。","signal":"While 让步后转折出真意。句子以 While there are some existing technologies 让步开","num":13},{"prompt":"What do people tend to do when outdoor air quality is poor?","translation":"当室外空气质量差时,人们往往会做什么?","options":["They keep their windows closed.","They spend a lot more time indoors.","They make more use of air-conditioners.","They try various ways to purify indoor air."],"answer":"B","qtype":"细节题","locateEn":"When outdoor air quality is poor, people tend to spend even more time indoors.","locateCn":"当户外空气质量差时，人们往往会在室内待更长时间。","signal":"题干原词 tend to 直接对应。录音里 When outdoor air quality is poor, people tend to","num":14},{"prompt":"What did Professor Gang Pan of the Chinese Academy of Sciences say about","translation":"中国科学院的潘刚教授关于他们的研究说了什么?","options":["It shows the importance of eliminating indoor pollution.","It may change the way of future environmental research.","It demonstrates the fruitful cooperation between UK and Chinese scientists.","It may make household appliances serve an additional air cleaner function."],"answer":"D","qtype":"细节题","locateEn":"Our study makes it possible to add an air cleaner option to household appliances in areas which might experience extremely poor air conditions.","locateCn":"我们的研究使得在空气质量可能极差的地区，给家用电器增加一项空气净化功能成为可能。","signal":"专家引语中的用途句。在专家 Professor Gang Pan 的引语里，Our study makes it","num":15}]},{"kind":"lecture","segments":[{"speaker":"","en":"Research recently carried out by my team suggests that fish may be self-aware. A certain species of fish recently passed the well-known mirror test.","cn":"我的团队最近进行的研究表明，鱼类可能具有自我意识。某种鱼类最近通过了著名的镜子测试。"},{"speaker":"","en":"This is a test that demonstrates self-recognition in animals. Only a few animals, such as humans, apes, dolphins and some birds, can recognize themselves in a mirror. And only these animals, capable of self- recognition, will attempt to remove marks placed on their skin after noticing them in the reflection. This ability suggests a level of higher intelligence and awareness. This is not shown by children until around 18 months. Until now, no fish has demonstrated the ability. But our experiments show the fish in question will scrape up against hard surfaces to remove marks placed on its body by our researchers after viewing itself in a mirror. The behaviors we observe leave little doubt that this fish behaviorally fulfills all criteria of the mirror test as originally laid out. The fish in our study never attempted to remove the marks when no mirror was present or when the marks were just placed on the mirror. Unmarked fish also did not attempt to remove marks from themselves when interacting with a marked fish on the other side of a window. These results show either that fish are self-aware or that the mirror test, which is considered to be the gold standard test used to denote higher intelligence, may be flawed.","cn":"这是一项证明动物自我识别能力的测试。只有少数动物，如人类、猿类、海豚和某些鸟类，能够在镜子中 识别自己。而且只有这些具备自我识别能力的动物，在镜子中注意到标记后，才会试图去除放置在其皮肤 上的标记。这种能力表明了更高水平的智力和意识。人类儿童直到大约18个月大时才表现出这种能力。到 目前为止，还没有鱼类展现出这种能力。但我们的实验表明，该鱼类在镜子中看到自己后，会在坚硬表面 上摩擦，以去除研究人员在其身上放置的标记。我们观察到的行为几乎毫无疑问地表明，这种鱼在行为上 完全符合最初制定的镜子测试的所有标准。在我们的研究中，当没有镜子存在时，或者当标记只是放在镜 子上时,该鱼从未试图去除标记。当未标记的鱼与窗户另一边的已标记鱼互动时，也不会试图去除自己身上 的标记。这些结果表明，要么鱼类具有自我意识，要么被认为是用于表示更高智力的黄金标准测试的镜子 测试可能存在缺陷。"},{"speaker":"","en":"What is less clear is whether these behaviors should be considered as evidence that fish are self- aware, even though in the past these same behaviors have been interpreted as self-awareness in so many other animals. Depending on your position, you might reject the interpretation that these behaviors in a fish satisfy passing the test at all. But on what objective basis can you do this when the behaviors they show are so functionally similar to those of other species that have passed the test?","cn":"不太清楚的是，这些行为是否应被视为鱼类具有自我意识的证据，尽管过去这些相同的行为在许多其他动 物身上被解释为自我意识。根据你的立场，你可能会拒绝接受鱼类的这些行为满足通过测试的解释。但 是，当它们表现出的行为与其他通过测试的物种在功能上如此相似时，你能在什么客观基础上这样做呢？"},{"speaker":"","en":"Results from our research raise more questions than answers. What if self-awareness develops like an onion, building layer upon layer rather than appearing all at once? Perhaps in order to explore self- awareness further, we should stop looking at responses to the mirror as a decisive test. Only with a richer theory of the self and a larger test battery will we be able to determine all of the various levels of self-awareness, including where exactly fish fit in.","cn":"我们的研究结果引发的问题多于答案。如果自我意识像洋葱一样发展，一层层地累积而不是一次性出现， 会怎样？也许为了进一步探索自我意识，我们应该停止将对镜子的反应视为决定性测试。只有拥有更丰 富的自我理论和更大规模的测试组合，我们才能确定自我意识的各个不同层次，包括鱼类究竟处于什么 位置。"}],"questions":[{"prompt":"What do we learn about the well-known mirror test?","translation":"关于著名的镜子测试，我们了解到什么？","options":["It distinguishes different species of animals.","It reflects distinct traits in animal behavior.","It demonstrates animals' ability to recognize themselves.","It gauges the level of intelligence of various animal species."],"answer":"C","qtype":"细节题","locateEn":"This is a test that demonstrates self-recognition in animals. Only a few animals, such as humans, apes, dolphins and some birds, can recognize themselves in a mirror.","locateCn":"这是一项检验动物自我识别能力的测试。只有少数动物，例如人类、猿、海豚和某些鸟类， 能在镜子里认出自己。","signal":"下定义句 This is a test that…。录音用 This is a test that demonstrates self-","num":16},{"prompt":"What does the study by the speaker's team show about the fish they experimented with?","translation":"说话者团队的研究显示了关于他们实验的鱼什么情况？","options":["It meets few of the behavioral criteria set in the mirror test.","It behaves similarly to animals capable of self-recognition.","It removes marks from itself to show self-awareness.","It matches children over 18 months in intelligence."],"answer":"B","qtype":"细节题","locateEn":"The behaviors we observe leave little doubt that this fish behaviorally fulfills all criteria of the mirror test as originally laid out.","locateCn":"我们观察到的行为几乎可以确定，这条鱼在行为上满足了最初设定的镜子测试的全部标准。","signal":"结果断言 leave little doubt that…。录音用 leave little doubt that this fish","num":17},{"prompt":"What does the speaker say about the results of their research?","translation":"说话者对他们的研究结果说了什么？","options":["They have conclusively established the criteria of animal intelligence.","They have advanced the concept of self-awareness to a higher level.","They incorporate more perspectives than one.","They raise more questions than answers."],"answer":"D","qtype":"细节题","locateEn":"Results from our research raise more questions than answers.","locateCn":"我们研究得出的结果，带来的问题比答案还多。","signal":"结尾定调句 Results… raise…。末段以 Results from our research raise more questions","num":18}]},{"kind":"lecture","segments":[{"speaker":"","en":"Reading with a young child is important. But does it matter whether you read from an electronic book or traditional print? As any parent knows, small children are generally keen on screens. So the finding from a new study that very young children enjoy electronic books more than printed picture books may not come as a huge surprise — but the following additional findings might: both parents and children behaved differently when reading electronic versus printed picture books. And the children who read the electronic books learned more.","cn":"与幼儿一起阅读很重要。但从电子书还是传统纸质书阅读是否有区别？正如任何父母所知，小孩子通常对 屏幕很感兴趣。因此，一项新研究发现幼儿比起纸质图画书更喜欢电子书，这可能不会让人感到特别惊讶 ——但以下额外的发现可能会：父母和孩子在阅读电子图画书与纸质图画书时的行为都有所不同。而且阅 读电子书的孩子学到了更多。"},{"speaker":"","en":"Previous studies of young children have suggested that electronic books, which incorporate extra features such as dictionaries and images that depict story events, may have advantages over print. In fact, multiple studies have found that electronic books support story comprehension and vocabulary gains beyond what is provided by printed books. But there's also work suggesting that children sometimes invest less mental effort in learning from electronic books, and that parents talk less about content when sharing such books.","cn":"以往对幼儿的研究表明，包含额外功能（如词典和描绘故事情节的图像）的电子书可能比纸质书更有优 势。事实上，多项研究发现，电子书对故事理解和词汇量增长的支持超过了纸质书所能提供的。但也有研 究表明，儿童有时在从电子书学习时投入的心理努力较少，而且父母在分享这类书籍时对内容的讨论也 较少。"},{"speaker":"","en":"The study we're looking at today aims to give us a better understanding of how good electronic books are for young children. For this study, researchers videoed children aged 17 to 26 months reading with one of their parents. Each parent-child pair was randomly assigned to read either two educational electronic books or two printed books with the same content. While the parent read the words in the printed books aloud, the electronic books had audio of voice actors reading the text.","cn":"我们今天关注的这项研究旨在让我们更好地了解电子书对幼儿有多好。在这项研究中，研究人员录制了17 至26个月大的儿童与其父母之一一起阅读的视频。每对亲子被随机分配阅读两本教育性电子书或两本内容 相同的纸质书。父母在朗读纸质书中的文字时，电子书则有配音演员朗读文本的音频。"},{"speaker":"","en":"The researchers found that parents who read the printed books pointed more frequently to pages than parents who read the electronic books. But the opposite was true for the children. Children who read the electronic books also commented more on the content and learned more new words than the children who read printed books.","cn":"研究人员发现，阅读纸质书的父母指向书页的频率高于阅读电子书的父母。但对于孩子来说情况正好相 反。阅读电子书的孩子对内容的评论也更多，学到的新词汇也比阅读纸质书的孩子更多。"},{"speaker":"","en":"This greater learning is ascribed to greater engagement with the electronic books. It's important to note that the electronic books in the study were simple. While they included background music, animation and sound effects, there were no other extra features.","cn":"这种更大的学习成效归因于对电子书更高的参与度。值得注意的是，研究中的电子书很简单。虽然它们包 含背景音乐、动画和音效，但没有其他额外功能。"},{"speaker":"","en":"It's also important to note that there's research on older children, finding that electronic books don't always bolster learning. Parents and educators need to beware. Extra features in electronic books may increase children's participation with them; however, if these features don't draw attention to the educational content, they may not serve as a supportive feature.","cn":"同样重要的是要注意，有关于年龄较大儿童的研究发现，电子书并不总是促进学习。父母和教育工作者需 要警惕。电子书中的额外功能可能会增加儿童对它们的参与；然而，如果这些功能没有将注意力引向教育 内容，它们可能不会起到支持作用。"}],"questions":[{"prompt":"What finding from the new study might come as a huge surprise?","translation":"新研究中哪项发现可能会让人大感意外?","options":["Small children are even more keen on screens than their elders.","Both parents and children preferred to read electronic books.","Parents differed from children in reading behavior.","Children reading electronic books learned more."],"answer":"D","qtype":"细节题","locateEn":"So the finding from a new study that very young children enjoy electronic books more than printed picture books may not come as a huge surprise — but the following additional findings might: both parents and children behaved differently when reading electronic versus printed picture books. And the children who read the electronic books learned more.","locateCn":"因此，一项新研究发现幼儿比起纸质图画书更喜欢电子书，这一点也许并不令人意外——但 接下来这些额外发现就可能令人意外了：父母和孩子在读电子书与纸质书时表现各不相同； 而且读电子书的孩子学到的更多。","signal":"转折 but…might 指向真正的意外。录音先用 may not come as a huge surprise 把\\"小孩","num":19},{"prompt":"What do we learn about previous studies of young children reading electronic books?","translation":"关于幼儿阅读电子书的以往研究,我们了解到什么?","options":["They came to conflicting conclusions.","They were based on small samples.","They yielded unanticipated findings.","They were focused on younger kids."],"answer":"A","qtype":"细节题","locateEn":"In fact, multiple studies have found that electronic books support story comprehension and vocabulary gains beyond what is provided by printed books. But there's also work suggesting that children sometimes invest less mental effort in learning from electronic books, and that parents talk less about content when sharing such books.","locateCn":"事实上，多项研究发现，电子书在故事理解和词汇增长上的助益超过纸质书。但也有研究表 明，孩子有时在电子书上投入的脑力反而更少，父母在一起读这类书时谈论内容也更少。","signal":"but 把两拨研究结论正反对置。录音先说 multiple studies have found that electronic","num":20},{"prompt":"What extra features should be included in electronic books to bolster","translation":"电子书中应包含哪些额外功能来增强孩子的学习?","options":["Those that prove simple enough for them to comprehend.","Those that produce both audio and visual effects on them.","Those that draw their attention to the educational content.","Those that contribute to their increased interest in reading."],"answer":"C","qtype":"细节题","locateEn":"Extra features in electronic books may increase children's participation with them; however, if these features don't draw attention to the educational content, they may not serve as a supportive feature.","locateCn":"电子书里的额外功能也许能提高孩子的参与度；然而，如果这些功能不能把注意力引向教育 内容，它们就可能起不到辅助作用。","signal":"however + if 否定句给出条件。录音先承认 Extra features…may increase children's","num":21}]},{"kind":"lecture","segments":[{"speaker":"","en":"Let me be honest with you. If you're living your life full of regrets, you're wasting your time. Why would you go through life regretting the very decisions that made you who you are today? There are plenty of unfavorable decisions we've made, but does that mean we should regret them? No!","cn":"让我对你坦诚相待。如果你的生活充满悔恨，那你就是在浪费时间。你为什么要在人生中悔恨那些造就了 今天的你的决定呢?我们确实做过许多不利的决定,但这是否意味着我们应该后悔它们?不!"},{"speaker":"","en":"I've had many moments where I sit and think about all the things I wish I could have done differently. However, just because things could be different, it doesn't necessarily mean they would be better. You don't have to continually be thinking of all your past decisions and whether or not you made the right one. You can't go back and change anything, so what's the point in worrying about it?","cn":"我曾有许多时刻坐下来思考所有我希望能做得不同的事情。然而,仅仅因为事情可能会不同,并不一定意味 着它们会更好。你不必不断地思考你过去所有的决定以及你是否做出了正确的选择。你无法回去改变任何 事情,所以为此担忧有什么意义呢?"},{"speaker":"","en":"Every single decision you've ever made, positive or negative, has made you the person you are today. We want to go back and change parts of our past, but what would be the benefit of that? We would have lost the valuable knowledge from the lessons we learned.","cn":"你曾经做过的每一个决定,无论积极还是消极,都造就了今天的你。我们想回去改变过去的某些部分,但那样 做有什么好处呢?我们会失去从所学教训中获得的宝贵知识。"},{"speaker":"","en":"There are reasons you make the choices you do, and that tells us about who you are. So when it comes to any decision in life, be unapologetically yourself. Because at the end of the day, it was you who made that decision.","cn":"你做出选择是有原因的,这说明了你是什么样的人。所以当涉及人生中的任何决定时,要毫无歉意地做你自 己。因为归根结底,是你做出了那个决定。"},{"speaker":"","en":"With less time spent focused on regrets, you'll finally have time to focus on the more essential things in life. In any situation, you grow more as a person with every decision you make. Life is full of lessons to learn, so we can't let regret stop us from moving forward.","cn":"少花时间关注悔恨,你终于有时间专注于生活中更重要的事情。在任何情况下,你做出的每个决定都会让你 更加成长。生活充满了要学习的教训,所以我们不能让悔恨阻止我们前进。"},{"speaker":"","en":"We don't know if we've made the right or wrong choice until after it's already been made, so it can be easy to start regretting your decision. But if the decision has already been made, what's the purpose of dwelling on it? There isn't one. All you can do is move forward. You can't let yourself sit there and worry about every past choice. We aren't all perfect.","cn":"我们不知道自己是否做出了正确或错误的选择,直到决定已经做出之后,所以很容易开始后悔你的决定。但 如果决定已经做出,纠结于此有什么目的呢?没有。你所能做的就是向前看。你不能让自己坐在那里为每一 个过去的选择而担忧。我们都不是完美的。"},{"speaker":"","en":"Whenever you make a decision, there will always be a possibility for regret later, but that's how life is supposed to be. You will make poor decisions in life — we all do — but it's what you do with the lessons learned that matters.","cn":"每当你做出决定时,以后总会有后悔的可能性,但这就是生活本该如此。你会在生活中做出糟糕的决定—— 我们都会——但重要的是你如何运用所学到的教训。"},{"speaker":"","en":"Think about every decision you've ever made. Were they always the best? Of course not. But look at how far you've come since then.","cn":"想想你曾经做过的每一个决定。它们总是最好的吗?当然不是。但看看你从那时起走了多远。"}],"questions":[{"prompt":"What should we do with the unfavorable decisions we've made?","translation":"对于我们做出的不利决定,我们应该怎么办?","options":["Regret having wasted much time in making them.","Think how different we could have made them.","Keep ourselves from regretting them.","Live with them for the time being."],"answer":"C","qtype":"细节题","locateEn":"If you're living your life full of regrets, you're wasting your time. ... There are plenty of unfavorable decisions we've made, but does that mean we should regret them? No!","locateCn":"如果你的人生充满后悔，那就是在浪费时间。……我们确实做过很多不理想的决定，但这是 否意味着我们该为之后悔呢？不！","signal":"反问加 No 的强烈否定。does that mean we should regret them? No! 用'反问 + 斩钉截","num":22},{"prompt":"What does the speaker say about every single decision we've ever made?","translation":"说话者对我们曾经做过的每一个决定有何评价?","options":["It has made us the person we are now.","It has been made with a lot of thinking.","It stems from our valuable knowledge.","It benefits us greatly one way or another."],"answer":"A","qtype":"细节题","locateEn":"Every single decision you've ever made, positive or negative, has made you the person you are today.","locateCn":"你做过的每一个决定，无论好坏，都造就了今天的你。","signal":"题干原词在句首直接成句。原文 Every single decision you've ever made, positive or","num":23},{"prompt":"What is life full of according to the speaker?","translation":"根据说话者的观点,生活中充满了什么?","options":["Challenging things to do.","Beautiful things to share.","Choices to make.","Lessons to learn."],"answer":"D","qtype":"细节题","locateEn":"Life is full of lessons to learn, so we can't let regret stop us from moving forward.","locateCn":"人生充满了需要汲取的教训，所以我们不能让后悔阻挡自己前进。","signal":"题干句式原样出现。原文 Life is full of lessons to learn 与题干句式 full of 一字不差，紧","num":24},{"prompt":"What is said to be of real importance when we make poor decisions in life?","translation":"当我们在生活中做出糟糕的决定时,什么被认为是真正重要的?","options":["Foreseeing the possibility for regret later.","Making proper use of the lessons learned.","Perfecting the decision-making strategies.","Seeing them as obstacles to moving forward."],"answer":"B","qtype":"细节题","locateEn":"You will make poor decisions in life — we all do — but it's what you do with the lessons learned that matters.","locateCn":"你在人生中会做出糟糕的决定——我们都会——但真正重要的，是你如何运用从中学到的 教训。","signal":"but 转折 + that matters 强调。but it's what you do with the lessons learned that","num":25}]}]}`),"2025-12-3":JSON.parse(`{"id":"2025-12-3","label":"2025年12月 · 第3套","writing":{"modelEssay":"Living in an increasingly competitive world, college students should better prepare themselves to confront\\nvarious challenges. This preparation is no longer optional but essential, for those who wait passively will\\ninevitably be left behind.\\nTo begin with, students ought to equip themselves with solid knowledge and practical skills rather than merely\\nchasing high marks. For instance, in today's fierce job market, employers value candidates who can\\ncommunicate, cooperate and solve real problems. What is more, developing a resilient mindset matters just as\\nmuch. I still remember failing my first internship interview; instead of giving up, I reflected on my\\nweaknesses, practised repeatedly, and finally secured a position the next semester. That experience taught me\\nthat challenges are conquered by those who keep improving.\\nTherefore, it is high time that college students stopped drifting and started planning ahead. By strengthening\\nboth our abilities and our willpower, we can turn the pressure of competition into a driving force and stride\\nconfidently into the future.","modelCn":"生活在一个竞争日益激烈的世界里，大学生应当更好地武装自己，去迎接各种挑战。这种准备不再是可有\\n可无，而是不可或缺的，因为那些被动等待的人终将被甩在后面。\\n首先，学生应当用扎实的知识和实用的技能武装自己，而不是一味追求高分。例如，在当今竞争激烈的就\\n业市场，用人单位看重的是能够沟通、协作并解决实际问题的求职者。此外，培养一种坚韧的心态同样重\\n要。我至今记得第一次实习面试失利；我没有放弃，而是反思自己的不足，反复练习，终于在下个学期争\\n取到了一个职位。那段经历让我明白：挑战属于那些不断进步的人。\\n因此，大学生该停止随波逐流、开始提前规划了。通过同时强化我们的能力与意志，我们就能把竞争的压\\n力转化为前进的动力，自信地大步迈向未来。"},"translation":{"source":"节俭  (frugality) 是中华民族的传统美德。在中国古代，生产力低下，先人们深知劳动成果来之不易，因而秉持节俭的理念。到了物质极大丰富的今天，中国人民依然坚持节俭的生活方式，体现了理性消费的生活理念和对劳动的尊重。近年来，中国政府持续加强节约型社会的建设，倡导 \\" 光盘行动 \\" ，减少食物浪费，提倡简约低碳的生活方式，推进资源循环利用，反对过度消费。节约型社会的建设有力地推动了中国经济的高质量发展。","reference":"Frugality is a traditional virtue of the Chinese nation. In ancient China, productivity was low, and our ancestors knew well that the fruits of labor did not come easily, so they upheld the idea of frugality. Today, when material wealth is abundant, the Chinese people still maintain a frugal lifestyle, reflecting their concept of rational consumption and their respect for labor. In recent years, the Chinese government has been strengthening the building of a resource-conserving society by advocating the \\"Clear Your Plate\\" campaign to reduce food waste, promoting a simple and low-carbon lifestyle, advancing the recycling of resources, and opposing excessive consumption. This building of a resource-conserving society has strongly promoted the high-quality development of China's economy."},"cloze":{"passage":"It’s best to think of an accent as a distinct, systematic and rule-governed way of speaking. Accent is not a __26__ for dialect, but it’s related. Dialect is an umbrella term for the way a community pronounces words, creates words, and orders words; accent refers to that first part only. Many __27__ presume that there is a single standard way of speaking in each country, with one single standard accent, and that this perceived standard is __28__ the best form of speech, but linguists (语言学家) often point out that the concept of a standard accent is ban sprawl, suburban tracts, and motor cars. 美国的汽车文化不同于任何其他国家。与大多数欧洲城市在马匹还是高科技时代就开始城市规划不同, 美国的许多城市是围绕城市扩张、郊区地带和机动车辆设计的。 F) As traffic and cities grew, so did the race to solve growing traffic problems. The first traffic signals were semaphores. Semaphores are towers with moving arms signaling for traffic to stop or go. They could be manual or automatic. There was no consistent design. Various models were invented and put into place in cities as the need arose. 随着交通和城市的发展,解决日益严重的交通问题的竞赛也在进行。最早的交通信号是臂板信号。臂板 信号是带有移动臂的塔,示意交通停止或通行。它们可以是手动的或自动的。没有统一的设计。随着需 求的出现,各种型号被发明并安装在城市中。 G) In 1912, Lester Wire was a police officer exhausted by traffic at Main Street and 200 South. He developed a manually switched stop light. The four-sided box, raised on a ten-foot pole, looked like a birdhouse and was operated manually by an officer. The officer would flip a switch to change between the dipped red and green lights. 1912年,Lester Wire是一名因Main Street和200 South的交通而疲惫不堪的警察。他开发了一种手动 切换的停车灯。这个四面的盒子安装在十英尺高的杆子上,看起来像鸟屋,由警察手动操作。警察会拨动 开关在倾斜的红灯和绿灯之间切换。 H) Like the 1910 semaphore, the first electric signal used words. However, the words were no longer written on arms that raised and fell. The words \\"stop\\" or \\"move\\" were on lights. The posts lit up on each of four corner-posts around an intersection( ⼗字路⼝ ). It was not automated, though. A booth with an operator was required to flip the switches. 与1910年的臂板信号一样,第一个电子信号使用文字。然而,文字不再写在升降的臂上。'停止'或'通 行'的字样在灯上。灯柱在十字路口周围的四个角柱上点亮。但它不是自动化的。需要一个带操作员的 岗亭来拨动开关。 I) The system allowed police officers to move from the middle of the street to a corner. From that vantage( 有利地位 ), an officer could oversee the crowd. If an emergency vehicle came, the officer could flip a switch and clear the intersection by triggering all red lights. The emergency vehicle could now pass effortlessly. Finally, in San Francisco the first red and green electric light system that could be operated automatically (or manually) was introduced in 1917. 该系统使警察能够从街道中间移动到角落。从那个有利位置,警察可以监督人群。如果有紧急车辆到来, 警察可以拨动开关,通过触发所有红灯来清空十字路口。紧急车辆现在可以毫不费力地通过。最后,1917 年在旧金山引入了第一个可以自动(或手动)操作的红绿电子灯系统。 J) In 1920, the first three-color light system was introduced in Detroit — also known as Motor City, USA. The evolution of traffic light signals could not have a more appropriate context than Motor City. Ford Motor Company was founded in Detroit in 1903 (and other motor companies followed). Ford made cars affordable for more common people, rather than the wealthy, by creating larger scale factory production. 1920年,第一个三色灯系统在底特律引入——也被称为美国汽车城。交通信号灯的演变在汽车城这个背 景下再合适不过了。福特汽车公司于1903年在底特律成立(其他汽车公司随后跟进)。福特通过创建更 大规模的工厂生产,使汽车对更普通的人而非富人来说变得可负担。 K) Stop and go were insufficient for the new volumes of cars zooming through intersections. Streets were full of new numbers of cars in addition to delivery wagons, bustling crowds, bicycles, horse- drawn carriages, and street cars. The introduction of the cautionary yellow light helped increase driver safety, decreasing accidents that come from running red lights. 对于呼啸通过十字路口的新增车辆数量来说,停止和通行是不够的。街道上除了满载的新车数量外,还有 送货马车、熙攘的人群、自行车、马车和有轨电车。警示黄灯的引入有助于提高驾驶员安全性,减少闯 红灯造成的事故。 L) Stop lights were incredibly important in chaotic city streets. Crosswalks weren't even introduced until 1951. The first pedestrian fatality in the United States was in 1899. 停车灯在混乱的城市街道上极其重要。人行横道甚至直到1951年才被引入。美国第一起行人死亡事故 发生在1899年。 M)The development of the modern traffic light may have started in London, but it grew up in the United States. In Cleveland, an African-American inventor named Garrett Morgan came up with an affordable, patented traffic signal. The yellow light made intersections safer than the old stop and go system. The new design was inexpensive enough that it allowed the installation of a lot more lights. 现代交通信号灯的发展可能始于伦敦,但它在美国成长起来。在克利夫兰,一位名叫Garrett Morgan的 非裔美国发明家提出了一种经济实惠、获得专利的交通信号。黄灯使十字路口比旧的停止和通行系统 更安全。新设计足够便宜,使得可以安装更多的灯。 N) Morgan sold the patent to General Electric — and the spread of the traffic light was green lighted. Green means go. It is that simple, but it's still best to check both ways for oncoming traffic that may not be paying attention or is running the light. Yellow means slow down and prepare to stop. It does not mean full-throttle( 全速 ) ahead. While you may get away with gunning it into the intersection, running a yellow can lead to tickets and dangerous accidents. Red lights are a clear and consistent warning to stop. Even where right turns are allowed on red lights, you must come to a complete stop before turning right. You must also yield to any through traffic, which has the right of way. In most states and cities, you can take a right on red unless otherwise indicated. New York City does not allow a right on red. Morgan将专利出售给通用电气——交通信号灯的推广获得了绿灯。绿色意味着通行。就这么简单,但 最好还是向两边查看可能没有注意或正在闯灯的迎面而来的车辆。黄色意味着减速并准备停车。它不 意味着全速前进。虽然你可能侥幸冲进十字路口,但闯黄灯可能导致罚单和危险事故。红灯是明确且一 致的停车警告。即使在允许红灯右转的地方,你也必须在右转前完全停车。你还必须让行任何直行车辆, 它们拥有通行权。在大多数州和城市,除非另有说明,你可以在红灯时右转。纽约市不允许红灯右转。 O) Red arrows mean you cannot turn right on a red in most states. The green arrow, in these cases, is the only time you can make the turn. However, you can take a right on a red arrow after a full stop in the states of Illinois, Kansas, Louisiana, Maryland, Michigan, New Hampshire, North Dakota, Oregon, South Carolina, Utah, Washington State and Wyoming. 在大多数州,红色箭头意味着你不能在红灯时右转。在这些情况下,只有绿色箭头才是你可以转弯的时 机。然而,在伊利诺伊州、堪萨斯州、路易斯安那州、马里兰州、密歇根州、新罕布什尔州、北达科 他州、俄勒冈州、南卡罗来纳州、犹他州、华盛顿州和怀俄明州,你可以在完全停车后在红色箭头时 右转。 P) Flashing Red is the same as a stop sign, generally used at four-way intersections where there is minimal traffic. When arriving at a flashing red light, make a full and complete stop. Flashing Red Arrows similarly mean to stop and then proceed to take the turn. Flashing Yellow lights mean yield or signal caution, like outside of a fire station. There are no all-direction flashing yellow lights, since it is prohibited in the United States. If you have a flashing yellow light, you are to yield to oncoming traffic. 闪烁红灯与停车标志相同,通常用于交通流量最小的四向十字路口。当遇到闪烁红灯时,要完全彻底地停 车。闪烁红色箭头同样意味着停车
