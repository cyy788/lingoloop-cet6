今为止已为4万名食客提供服务。 C) Ten years ago, robot-chefs and waiters were pure science fiction. Today, they are a reality, and at prices that make them a plausible investment. From May, Penny will be shipped on a subscription basis that offers \\"an immediate return\\", says Bear Robotics' chief operating officer, Juan Higueros. Flippy will cost a reported $60,000 to $100,000. Fully automated burger restaurants managed with minimal human oversight — where customers order at screens, pay electronically, and eat food cooked and delivered by robots — are now a possibility. 十年前,机器人厨师和服务员纯属科幻小说。今天,它们成为现实,而且价格使它们成为合理的投资。 Bear Robotics的首席运营官Juan Higueros说,从5月起,Penny将以订阅方式发货,提供\\"即时回报\\"。据 报道Flippy的成本将在6万至10万美元之间。由最少人工监督管理的全自动汉堡餐厅——顾客在屏幕 上点餐,电子支付,食用由机器人烹饪和配送的食物——现在已成为可能。 D) The technology exists; it just needs knitting together cost-effectively and in a way diners buy into. In an industry keen to slash labor costs and increase profits, further automation seems inevitable. After an eight-month test at Kang Nam Tofu House in California, Bear Robotics credited Penny with driving a 28% increase in sales. Meanwhile, in US trials, the self-ordering screens that McDonald's is currently installing at its 1,300 UK restaurants yielded a reported 30% rise in order values. 技术已经存在;它只需要以经济有效的方式整合在一起,并以食客接受的方式呈现。在一个热衷于削减劳 动力成本和增加利润的行业中,进一步自动化似乎是不可避免的。在加利福尼亚江南豆腐屋进行为期八 个月的测试后,Bear Robotics认为Penny推动了销售额增长28%。与此同时,在美国的试验中,麦当劳目 前正在其英国1300家餐厅安装的自助点餐屏幕据报道使订单价值增长了30%。 E) Personalisation is seen as key to the appeal of this technology, alongside its ability to reliably push so-called \\"upsells\\" (meal deals, extras, larger drinks) to customers. Soon when you log into a restaurant app, it will be able to use your data and purchasing history to recommend dishes to you — factoring in everything from the weather to, if you are ordering at a screen that can read your face, your mood. 个性化被视为这项技术吸引力的关键,以及它能够可靠地向顾客推送所谓\\"追加销售\\"(套餐,额外食品,更 大份饮料)的能力。很快,当你登录餐厅应用程序时,它将能够使用你的数据和购买历史向你推荐菜肴 ——从天气到,如果你在可以读取你面部表情的屏幕上点餐,你的心情,都会被考虑在内。 F) \\"Right now people compromise on choice. We're presented with a one-size-fits-all menu. Ultimately, technology can allow us to make personal choices. You love spicy food and chicken? Here's the dish people like you mostly order,\\" says Tom Weaver, CEO at the hospitality tech company Flyt. He talks enthusiastically about the Helsinki pop-up Take-In, a full-service restaurant where diners ordered dishes in from various delivery services. \\"For the first time in a few hundred years, digital is allowing us to create new versions of restaurants.\\" \\"现在人们在选择上妥协。我们面对的是一刀切的菜单。最终,技术可以让我们做出个人选择。你喜欢辣 味食物和鸡肉?这是像你这样的人最常点的菜,\\"酒店科技公司Flyt的首席执行官Tom Weaver说。他热情 地谈论赫尔辛基的快闪餐厅Take-In,这是一家全方位服务餐厅,食客从各种配送服务订购菜肴。\\"几百年 来第一次,数字技术让我们能够创造新版本的餐厅。\\" G) If high-street fast food is automation-ready, its impact on high-end restaurants is likely to be subtler and slower. \\"It'll probably be a very long time before we see a five-star robot-chef,\\" says Noel Sharkey, professor of AI and robotics at the University of Sheffield. \\"Apart from the AI creativity gap, great cooking involves a subtle understanding of ingredients and delicate cooking that would be enormously challenging for robots. Placing fragile foods on plates would be incredibly slow.\\" 如果街头快餐已为自动化做好准备,那么它对高端餐厅的影响可能会更微妙、更缓慢。\\"我们可能要很 长时间才能看到五星级机器人厨师,\\"谢菲尔德大学人工智能和机器人技术教授Noel Sharkey说。\\"除了 人工智能的创造力差距之外,出色的烹饪涉及对食材的微妙理解和精细烹饪,这对机器人来说将是极具挑 战性的。将易碎的食物摆放在盘子上会非常缓慢。\\" H) Currently, robots have limited functionality. A human needs to load Penny with plates that diners lift off themselves. At the robot-powered US pizza-delivery company Zume, the more difficult jobs, such as topping pizzas, are still done by humans. But Moley, which will launch soon, offers an idea of the sophistication to come. Modelled on the movements of a MasterChef contest winner, Tim Anderson, its robotic arms are fixed over a stove and programmed to prepare dishes from raw ingredients. It is designed for domestic use, but a commercial version is planned that opens up the possibility of restaurant kitchens automating even highly technically challenging tasks. 目前,机器人的功能有限。需要人类为Penny装载盘子,食客自己取下。在机器人驱动的美国披萨配送公 司Zume,更困难的工作,如在披萨上添加配料,仍由人类完成。但即将推出的Moley提供了未来复杂性的 想法。其机械臂以MasterChef比赛获胜者Tim Anderson的动作为模型,固定在炉灶上方,并编程从原 材料准备菜肴。它是为家庭使用而设计的,但计划推出商业版本,这为餐厅厨房自动化甚至高度技术性挑 战的任务提供了可能性。 I) For now, the kitchen technology that QSR Automations supplies to Mitchells & Butlers' pubs or KFC is less glamorous. Rather than having a chef shouting out diners' orders, the QSR system automatically distributes those orders across screens. The kitchen screens then tell chefs when to start cooking each dish, so that your plate of fish, chips and peas comes together at the right time. 目前,QSR Automations向Mitchells & Butlers酒吧或肯德基提供的厨房技术没那么引人注目。QSR系 统不是让厨师大声喊出食客的订单,而是自动将这些订单分配到各个屏幕上。然后厨房屏幕告诉厨师何 时开始烹饪每道菜,这样你的鱼、薯条和豌豆就能在合适的时间一起上桌。 J) The restaurant industry is currently suffering a severe shortage of skilled chefs — a deficit of 11,000, according to the skills agency People 1st. \\"Automation systems designed to make the process more idiot-proof are trying to bridge that gap,\\" says Stefan Chomka, the editor of Restaurant magazine. 餐饮业目前正遭受熟练厨师的严重短缺——根据技能机构People 1st的数据,缺口为1.1万人。\\"旨在使 流程更加简单易行的自动化系统正试图弥合这一差距,\\"《餐厅》杂志编辑Stefan Chomka说。 K) In terms of simplifying or enhancing the customer experience, online restaurant booking has been the easily-won success of the internet age. Automated at-table ordering and payment is seen as the next landmark. Until then, early adopters, such as the Manchester bar owner Andy Smith, who uses the Ordoo app at his venue 33 Oldham Street, may well experience growing but \\"lower than expected\\" acceptance. 就简化或增强顾客体验而言,在线餐厅预订一直是互联网时代轻松获得的成功。桌边自动点餐和支付被 视为下一个里程碑。在那之前,早期采用者,如曼彻斯特酒吧老板Andy Smith,他在其场所33 Oldham Street使用Ordoo应用程序,很可能会经历不断增长但\\"低于预期\\"的接受度。 L) Embarrassing failures in restaurant tech frequently hit the headlines. The TGI Fridays drone( ⽆⼈机 ) that injured a Brooklyn Daily photographer; US burger chain Shake Shack having to retreat from plans for entirely cashless ordering sites. But, says Chomka, such technology could miss the mark if it only offers \\"solutions to problems that don't really exist\\". \\"Payments being automatic\\" could be useful, he adds. But, in an expensive restaurant, \\"how quick do you need dinner to be?\\" 餐厅技术中的尴尬失败经常登上头条。TGI Fridays的无人机伤害了Brooklyn Daily的摄影师;美国汉堡 连锁店Shake Shack不得不放弃完全无现金点餐站点的计划。但是,Chomka说,如果这种技术只提 供\\"对实际上不存在的问题的解决方案\\",它可能会偏离目标。他补充说,\\"支付自动化\\"可能是有用的。但 是,在一家昂贵的餐厅,\\"你需要晚餐有多快?\\" M)That attachment to the human art of hospitality will be heartening for staff who see automation as a threat to jobs. \\"Unite is concerned that without safeguards, any benefits will bypass workers in low- paying jobs, such as waiters,\\" says the union's London regional officer, Dave Turnbull. \\"We're urging Members of Parliament to ensure automation does not just benefit a wealthy few like previous industrial revolutions.\\" 对人类待客艺术的这种依恋将让那些将自动化视为工作威胁的员工感到鼓舞。\\"Unite担心,如果没有保 障措施,任何好处都将绕过低薪工作的工人,如服务员,\\"该工会的伦敦地区官员Dave Turnbull说。\\"我们 敦促国会议员确保自动化不会像以前的工业革命那样只让少数富人受益。\\" N) The industry principle is that automation will allow it to redeploy staff more effectively. Jobs will change, if not immediately decrease in number. \\"Self-order screens mean more demand for people front-of-house. Last year, we recruited 1,000 new managers,\\" says McDonald's COO, Jason Clark. Caliburger has a programme to retrain staff as robot engineers or \\"chef techs\\". 行业原则是自动化将使其能够更有效地重新部署员工。工作将发生变化,即使数量不会立即减少。\\"自 助点餐屏幕意味着对前台人员的更多需求。去年,我们招聘了1000名新经理,\\"麦当劳首席运营官Jason Clark说。Caliburger有一个项目将员工重新培训为机器人工程师或\\"厨师技术员\\"。 O) But ultimately the chance to reduce overheads( 管理费⽤ ) by employing fewer people or at lower rates will be what attracts big brands to technology. Invariably, over the next 10 years, jobs will go in conventional bricks-built restaurants, not least because automation will boost their rapidly growing rival: delivery. Companies such as Domino and Just Eat have both experimented with robot and drone delivery, which is already legal in Reykjavik, Iceland. \\"Robot food deliveries are the future,\\" says Noel Sharkey. \\"Small, 4 mph ground robots are safe and will work 24 hours a day.\\" 但最终,通过雇用更少的人或以更低的薪酬来减少管理费用的机会将是吸引大品牌采用技术的原因。在 未来10年,传统实体餐厅的工作岗位将不可避免地减少,尤其是因为自动化将促进其快速增长的竞争对 手:配送。Domino和Just Eat等公司都尝试过机器人和无人机配送,这在冰岛雷克雅未克已经合法。\\"机 器人食品配送是未来,\\"Noel Sharkey说。\\"小型、时速4英里的地面机器人是安全的,将24小时工作。\\" P) Combined with machine learning of anticipated order volumes and the minute-by-minute cooking data generated by systems such as QSR, that robot fleet could deliver almost instantly. \\"Restaurants will prepare food ahead of orders coming in,\\" predicts Just Eat's director of engineering, Daniel Richardson. \\"I'll be able to say 'Let's have pizza' to my family, my intelligent assistant will hear and 10 minutes later the food will be at my door.\\" No one is putting an exact date on it yet. But in the dining room and on your doorstep, the robots are coming. 结合对预期订单量的机器学习以及QSR等系统生成的逐分钟烹饪数据,该机器人车队几乎可以即时配 送。\\"餐厅将在订单到来之前准备食物,\\"Just Eat的工程总监Daniel Richardson预测。\\"我可以对我的 陈述句与逐句解析 现 在 可 以 在 几 乎 无 需 人 工 监 督 的 情 况 下 实 现 汉 堡 餐 厅 的 全 自 动 化 。"}}},"match":{"title":"Restaurants Are Now Employing Robots — Should Chefs Be Worried?","paragraphs":{"A":{"en":"Like most chefs, Flippy is not afraid of hard work. Since last summer, that has meant 11 am until 7 pm shifts at Caliburger in Pasadena, California, as well as short assignments at Chick-N-Tots at Dodger Stadium in Los Angeles. These are long hours of repetitive work, where the boss demands absolute consistency. But you won't hear Flippy complain or say anything, in fact. For Flippy is a robot - a cloud-connected mechanical arm with 3D thermal scanners for eyes - that can flip burgers or fry 80 baskets of food an hour, monitor that food and even clean up afterwards.","cn":"和大多数厨师一样,Flippy不惧怕辛苦工作。自去年夏天以来,这意味着在加利福尼亚州帕萨迪纳的 Caliburger餐厅从上午11点工作到晚上7点,以及在洛杉矶道奇体育场的Chick-N-Tots短期值班。这些 都是长时间的重复性工作,老板要求绝对的一致性。但你不会听到Flippy抱怨或说任何话,事实上。因为 Flippy是一个机器人——一个云连接的机械臂,配有3D热扫描仪作为眼睛——它可以翻转汉堡或每小 时油炸80篮食物,监控食物,甚至之后清理。"},"B":{"en":"Flippy was created by Miso Robotics, part of the Cali Group, which is described by its CEO, John Miller, as: \\"A technology company that happens to sell cheeseburgers.\\" Cali creates new machines that it road-tests in its Caliburger restaurants across the world, into which Flippy will be deployed this year. And Flippy is not alone. Also in California, Bear Robotics has developed a self-guiding robot, Penny, which has so far served 40,000 diners.","cn":"Flippy由Miso Robotics创造,该公司是Cali Group的一部分,其首席执行官John Miller将其描述为:\\"一 家恰好销售芝士汉堡的科技公司。\\"Cali创造新机器,并在其遍布全球的Caliburger餐厅进行路测,Flippy 将于今年部署到这些餐厅。而且Flippy并不孤单。同样在加利福尼亚,Bear Robotics开发了一个自导航 机器人Penny,迄今为止已为4万名食客提供服务。"},"C":{"en":"Ten years ago, robot-chefs and waiters were pure science fiction. Today, they are a reality, and at prices that make them a plausible investment. From May, Penny will be shipped on a subscription basis that offers \\"an immediate return\\", says Bear Robotics' chief operating officer, Juan Higueros. Flippy will cost a reported $60,000 to $100,000. Fully automated burger restaurants managed with minimal human oversight - where customers order at screens, pay electronically, and eat food cooked and delivered by robots - are now a possibility.","cn":"十年前,机器人厨师和服务员纯属科幻小说。今天,它们成为现实,而且价格使它们成为合理的投资。 Bear Robotics的首席运营官Juan Higueros说,从5月起,Penny将以订阅方式发货,提供\\"即时回报\\"。据 报道Flippy的成本将在6万至10万美元之间。由最少人工监督管理的全自动汉堡餐厅——顾客在屏幕 上点餐,电子支付,食用由机器人烹饪和配送的食物——现在已成为可能。"},"D":{"en":"The technology exists; it just needs knitting together cost-effectively and in a way diners buy into. In an industry keen to slash labor costs and increase profits, further automation seems inevitable. After an eight-month test at Kang Nam Tofu House in California, Bear Robotics credited Penny with driving a 28% increase in sales. Meanwhile, in US trials, the self-ordering screens that McDonald's is currently installing at its 1,300 UK restaurants yielded a reported 30% rise in order values.","cn":"技术已经存在;它只需要以经济有效的方式整合在一起,并以食客接受的方式呈现。在一个热衷于削减劳 动力成本和增加利润的行业中,进一步自动化似乎是不可避免的。在加利福尼亚江南豆腐屋进行为期八 个月的测试后,Bear Robotics认为Penny推动了销售额增长28%。与此同时,在美国的试验中,麦当劳目 前正在其英国1300家餐厅安装的自助点餐屏幕据报道使订单价值增长了30%。"},"E":{"en":"Personalisation is seen as key to the appeal of this technology, alongside its ability to reliably push so-called \\"upsells\\" (meal deals, extras, larger drinks) to customers. Soon when you log into a restaurant app, it will be able to use your data and purchasing history to recommend dishes to you - factoring in everything from the weather to, if you are ordering at a screen that can read your face, your mood.","cn":"个性化被视为这项技术吸引力的关键,以及它能够可靠地向顾客推送所谓\\"追加销售\\"(套餐,额外食品,更 大份饮料)的能力。很快,当你登录餐厅应用程序时,它将能够使用你的数据和购买历史向你推荐菜肴 ——从天气到,如果你在可以读取你面部表情的屏幕上点餐,你的心情,都会被考虑在内。"},"F":{"en":"\\"Right now people compromise on choice. We're presented with a one-size-fits-all menu. Ultimately, technology can allow us to make personal choices. You love spicy food and chicken? Here's the dish people like you mostly order,\\" says Tom Weaver, CEO at the hospitality tech company Flyt. He talks enthusiastically about the Helsinki pop-up Take-In, a full-service restaurant where diners ordered dishes in from various delivery services. \\"For the first time in a few hundred years, digital is allowing us to create new versions of restaurants.\\"","cn":"\\"现在人们在选择上妥协。我们面对的是一刀切的菜单。最终,技术可以让我们做出个人选择。你喜欢辣 味食物和鸡肉?这是像你这样的人最常点的菜,\\"酒店科技公司Flyt的首席执行官Tom Weaver说。他热情 地谈论赫尔辛基的快闪餐厅Take-In,这是一家全方位服务餐厅,食客从各种配送服务订购菜肴。\\"几百年 来第一次,数字技术让我们能够创造新版本的餐厅。\\""},"G":{"en":"If high-street fast food is automation-ready, its impact on high-end restaurants is likely to be subtler and slower. \\"It'll probably be a very long time before we see a five-star robot-chef,\\" says Noel Sharkey, professor of AI and robotics at the University of Sheffield. \\"Apart from the AI creativity gap, great cooking involves a subtle understanding of ingredients and delicate cooking that would be enormously challenging for robots. Placing fragile foods on plates would be incredibly slow.\\"","cn":"如果街头快餐已为自动化做好准备,那么它对高端餐厅的影响可能会更微妙、更缓慢。\\"我们可能要很 长时间才能看到五星级机器人厨师,\\"谢菲尔德大学人工智能和机器人技术教授Noel Sharkey说。\\"除了 人工智能的创造力差距之外,出色的烹饪涉及对食材的微妙理解和精细烹饪,这对机器人来说将是极具挑 战性的。将易碎的食物摆放在盘子上会非常缓慢。\\""},"H":{"en":"Currently, robots have limited functionality. A human needs to load Penny with plates that diners lift off themselves. At the robot-powered US pizza-delivery company Zume, the more difficult jobs, such as topping pizzas, are still done by humans. But Moley, which will launch soon, offers an idea of the sophistication to come. Modelled on the movements of a MasterChef contest winner, Tim Anderson, its robotic arms are fixed over a stove and programmed to prepare dishes from raw ingredients. It is designed for domestic use, but a commercial version is planned that opens up the possibility of restaurant kitchens automating even highly technically challenging tasks.","cn":"目前,机器人的功能有限。需要人类为Penny装载盘子,食客自己取下。在机器人驱动的美国披萨配送公 司Zume,更困难的工作,如在披萨上添加配料,仍由人类完成。但即将推出的Moley提供了未来复杂性的 想法。其机械臂以MasterChef比赛获胜者Tim Anderson的动作为模型,固定在炉灶上方,并编程从原 材料准备菜肴。它是为家庭使用而设计的,但计划推出商业版本,这为餐厅厨房自动化甚至高度技术性挑 战的任务提供了可能性。"},"I":{"en":"For now, the kitchen technology that QSR Automations supplies to Mitchells & Butlers' pubs or KFC is less glamorous. Rather than having a chef shouting out diners' orders, the QSR system automatically distributes those orders across screens. The kitchen screens then tell chefs when to start cooking each dish, so that your plate of fish, chips and peas comes together at the right time.","cn":"目前,QSR Automations向Mitchells & Butlers酒吧或肯德基提供的厨房技术没那么引人注目。QSR系 统不是让厨师大声喊出食客的订单,而是自动将这些订单分配到各个屏幕上。然后厨房屏幕告诉厨师何 时开始烹饪每道菜,这样你的鱼、薯条和豌豆就能在合适的时间一起上桌。"},"J":{"en":"The restaurant industry is currently suffering a severe shortage of skilled chefs - a deficit of 11,000, according to the skills agency People 1st. \\"Automation systems designed to make the process more idiot-proof are trying to bridge that gap,\\" says Stefan Chomka, the editor of Restaurant magazine.","cn":"餐饮业目前正遭受熟练厨师的严重短缺——根据技能机构People 1st的数据,缺口为1.1万人。\\"旨在使 流程更加简单易行的自动化系统正试图弥合这一差距,\\"《餐厅》杂志编辑Stefan Chomka说。"},"K":{"en":"In terms of simplifying or enhancing the customer experience, online restaurant booking has been the easily- won success of the internet age. Automated at-table ordering and payment is seen as the next landmark. Until then, early adopters, such as the Manchester bar owner Andy Smith, who uses the Ordoo app at his venue 33 Oldham Street, may well experience growing but \\"lower than expected\\" acceptance.","cn":"就简化或增强顾客体验而言,在线餐厅预订一直是互联网时代轻松获得的成功。桌边自动点餐和支付被 视为下一个里程碑。在那之前,早期采用者,如曼彻斯特酒吧老板Andy Smith,他在其场所33 Oldham Street使用Ordoo应用程序,很可能会经历不断增长但\\"低于预期\\"的接受度。"},"L":{"en":"Embarrassing failures in restaurant tech frequently hit the headlines. The TGI Fridays drone (无人机) that injured a Brooklyn Daily photographer; US burger chain Shake Shack having to retreat from plans for entirely cashless ordering sites. But, says Chomka, such technology could miss the mark if it only offers \\"solutions to problems that don't really exist\\". \\"Payments being automatic\\" could be useful, he adds. But, in an expensive restaurant, \\"how quick do you need dinner to be?\\"","cn":"餐厅技术中的尴尬失败经常登上头条。TGI Fridays的无人机伤害了Brooklyn Daily的摄影师;美国汉堡 连锁店Shake Shack不得不放弃完全无现金点餐站点的计划。但是,Chomka说,如果这种技术只提 供\\"对实际上不存在的问题的解决方案\\",它可能会偏离目标。他补充说,\\"支付自动化\\"可能是有用的。但 是,在一家昂贵的餐厅,\\"你需要晚餐有多快?\\""},"M":{"en":"That attachment to the human art of hospitality will be heartening for staff who see automation as a threat to jobs. \\"Unite is concerned that without safeguards, any benefits will bypass workers in low-paying jobs, such as waiters,\\" says the union's London regional officer, Dave Turnbull. \\"We're urging Members of Parliament to ensure automation does not just benefit a wealthy few like previous industrial revolutions.\\"","cn":"对人类待客艺术的这种依恋将让那些将自动化视为工作威胁的员工感到鼓舞。\\"Unite担心,如果没有保 障措施,任何好处都将绕过低薪工作的工人,如服务员,\\"该工会的伦敦地区官员Dave Turnbull说。\\"我们 敦促国会议员确保自动化不会像以前的工业革命那样只让少数富人受益。\\""},"N":{"en":"The industry principle is that automation will allow it to redeploy staff more effectively. Jobs will change, if not immediately decrease in number. \\"Self-order screens mean more demand for people front-of-house. Last year, we recruited 1,000 new managers,\\" says McDonald's COO, Jason Clark. Caliburger has a programme to retrain staff as robot engineers or \\"chef techs\\".","cn":"行业原则是自动化将使其能够更有效地重新部署员工。工作将发生变化,即使数量不会立即减少。\\"自 助点餐屏幕意味着对前台人员的更多需求。去年,我们招聘了1000名新经理,\\"麦当劳首席运营官Jason Clark说。Caliburger有一个项目将员工重新培训为机器人工程师或\\"厨师技术员\\"。"},"O":{"en":"But ultimately the chance to reduce overheads (管理费用) by employing fewer people or at lower rates will be what attracts big brands to technology. Invariably, over the next 10 years, jobs will go in conventional bricks- built restaurants, not least because automation will boost their rapidly growing rival: delivery. Companies such as Domino and Just Eat have both experimented with robot and drone delivery, which is already legal in Reykjavik, Iceland. \\"Robot food deliveries are the future,\\" says Noel Sharkey. \\"Small, 4 mph ground robots are safe and will work 24 hours a day.\\"","cn":"但最终,通过雇用更少的人或以更低的薪酬来减少管理费用的机会将是吸引大品牌采用技术的原因。在 未来10年,传统实体餐厅的工作岗位将不可避免地减少,尤其是因为自动化将促进其快速增长的竞争对 手:配送。Domino和Just Eat等公司都尝试过机器人和无人机配送,这在冰岛雷克雅未克已经合法。\\"机 器人食品配送是未来,\\"Noel Sharkey说。\\"小型、时速4英里的地面机器人是安全的,将24小时工作。\\""},"P":{"en":"Combined with machine learning of anticipated order volumes and the minute-by-minute cooking data generated by systems such as QSR, that robot fleet could deliver almost instantly. \\"Restaurants will prepare food ahead of orders coming in,\\" predicts Just Eat's director of engineering, Daniel Richardson. \\"I'll be able to say 'Let's have pizza' to my family, my intelligent assistant will hear and 10 minutes later the food will be at my door.\\" No one is putting an exact date on it yet. But in the dining room and on your doorstep, the robots are coming.","cn":"结合对预期订单量的机器学习以及QSR等系统生成的逐分钟烹饪数据,该机器人车队几乎可以即时配 送。\\"餐厅将在订单到来之前准备食物,\\"Just Eat的工程总监Daniel Richardson预测。\\"我可以对我的"}},"statements":[{"num":36,"text":"It is now possible to fully automate a burger restaurant with little human supervision.","answer":"C","locateEn":"Fully automated burger restaurants managed with minimal human oversight — where customers order at screens, pay electronically, and eat food cooked and delivered by robots — are now a possibility.","locateCn":"几乎无需人工监管的全自动汉堡店——顾客在屏幕上点单、电子支付、吃由机器人烹饪和配 送的食物——如今已成为可能。","anchor":"强锚点"},{"num":37,"text":"At a robot-powered US company, complicated tasks still have to be performed by humans.","answer":"H","locateEn":"At the robot-powered US pizza-delivery company Zume, the more difficult jobs, such as topping pizzas, are still done by humans.","locateCn":"在机器人驱动的美国披萨配送公司 Zume，较难的工作（比如给披萨加配料）仍由人来 完成。","anchor":"强锚点"},{"num":38,"text":"More automation appears to be a certainty in industries eager to cut labor costs and raise profits.","answer":"D","locateEn":"In an industry keen to slash labor costs and increase profits, further automation seems inevitable.","locateCn":"在一个急于削减人工成本、提高利润的行业里，进一步的自动化看来是不可避免的。","anchor":"弱锚点"},{"num":39,"text":"There are often front-page reports of failures in technological innovation of the restaurant industry.","answer":"L","locateEn":"Embarrassing failures in restaurant tech frequently hit the headlines.","locateCn":"餐饮科技领域令人尴尬的失败经常登上新闻头条。","anchor":"强锚点"},{"num":40,"text":"Robot-chef Flippy does not fear laborious work, nor does it make any complaints.","answer":"A","locateEn":"Like most chefs, Flippy is not afraid of hard work. … But you won't hear Flippy complain or say anything, in fact.","locateCn":"和大多数厨师一样，Flippy 不惧辛苦的工作。……但事实上，你听不到 Flippy 抱怨，甚至听 不到它说任何话。","anchor":"强锚点"},{"num":41,"text":"Digital technology makes it possible for businesses to innovate restaurant models.","answer":"F","locateEn":"\\"For the first time in a few hundred years, digital is allowing us to create new versions of restaurants.\\" \\"","locateCn":"几百年来第一次，数字技术正让我们能够创造出餐厅的新形态。\\"","anchor":"弱锚点"},{"num":42,"text":"Fondness for human warmth in catering to customers will give hope to employees who are afraid of","answer":"M","locateEn":"That attachment to the human art of hospitality will be heartening for staff who see automation as a threat to jobs.","locateCn":"那种对人性化待客艺术的依恋，会让那些视自动化为饭碗威胁的员工感到宽慰。 41.Digital technology makes it possible for businesses to innovate restaurant models. 42.Fondness for human warmth in catering to customers will give hope to employees who are afraid of losing jobs to robots.","anchor":"弱锚点"},{"num":43,"text":"There is an acute shortage of experienced chefs in the catering industry and automated cooking is","answer":"J","locateEn":"The restaurant industry is currently suffering a severe shortage of skilled chefs — a deficit of 11,000, according to the skills agency People 1st. \\"Automation systems designed to make the process more idiot-proof are trying to bridge that gap,\\" says Stefan Chomka, the editor of Restaurant magazine.","locateCn":"餐饮业目前正遭遇熟练厨师的严重短缺——据技能机构 People 1st 称缺口达 11000 人。 《Restaurant》杂志编辑 Stefan Chomka 说：\\"旨在让流程更傻瓜化的自动化系统正试图 弥合这一缺口。\\"","anchor":"弱锚点"},{"num":44,"text":"Over the coming decade, many jobs in traditional restaurants will disappear due to robot delivery.","answer":"O","locateEn":"Invariably, over the next 10 years, jobs will go in conventional bricks-built restaurants, not least because automation will boost their rapidly growing rival: delivery.","locateCn":"无可避免地，未来十年，传统砖砌实体餐厅里的岗位将会消失，尤其因为自动化会助推它们 快速增长的对手——外卖配送。","anchor":"强锚点"},{"num":45,"text":"According to an expert in AI and robotics, it may be quite some time before a master robot-chef","answer":"G","locateEn":"\\"It'll probably be a very long time before we see a five-star robot-chef,\\" says Noel Sharkey, professor of AI and robotics at the University of Sheffield. \\"","locateCn":"我们要见到五星级机器人厨师，恐怕还得很久很久，\\"谢菲尔德大学的 AI 与机器人学教授 Noel Sharkey 说。","anchor":"强锚点"}]},"careful":[{"paragraphs":[{"en":"Many see friendships as a comfort blanket: a shoulder to cry on, a reliable soul to confide in. However, more often than not, in our eagerness to seek individual success, we lose friends along the way and that has become part of the process.","cn":"许多人将友谊视为一条慰藉的毛毯:一个可以倾诉的肩膀,一个可以信赖的灵魂。然而,更多时候,在我们急于 追求个人成功的过程中,我们沿途失去了朋友,而这已成为这一过程的一部分。"},{"en":"The chaos and never-ending turmoil that accompanies everyday life is an aggressive obstacle in the pursuit of stable friendships. As students, we use this excuse to shrug off losing people who we once thought to be loved ones.","cn":"伴随日常生活而来的混乱和永无止境的动荡是追求稳定友谊的严重障碍。作为学生,我们用这个借口来对失 去那些我们曾经认为是挚爱之人的事实不以为意。"},{"en":"Instead of viewing our lives as a race, where everyone is on their own path to some form of success, we must relearn to value the connections we make along the track. We must reevaluate the harm of radical, individual freedom.","cn":"我们不应该将生活视为一场竞赛,每个人都在通往某种形式成功的自己的道路上,而必须重新学会珍视我们 在这条轨道上建立的联系。我们必须重新评估激进的个人自由所带来的危害。"},{"en":"Radical individualism elevates the freedom of the individual over the collective. It argues, for instance, that universal healthcare, an example of collectivism, threatened the dream of many Americans.","cn":"激进个人主义将个人自由置于集体之上。例如,它认为全民医疗保健这一集体主义的例子威胁到了许多美国 人的梦想。"},{"en":"Many of us have fallen victim to an individualistic culture. Society tends to celebrate personal achievement and commend it based on the assumption that winning or succeeding is a consequence of working harder than the next person.","cn":"我们中的许多人已经成为个人主义文化的受害者。社会倾向于颂扬个人成就,并基于这样的假设对其进行赞 扬:获胜或成功是比别人更努力工作的结果。"},{"en":"As a society, we idolize the concept of \\"losing friends on the road to success\\". I remember hearing in high school, \\"Don't worry about losing friendships, just focus on study and getting into college. That's all that will matter in the long run,\\" a sentiment that is not unique to my experience. It's preached in many success stories, and it's embedded in the way we see growth. Motivational speakers will push their audience to be complacent to the inevitable end of losing friends. Spend too much time with friends? You're losing time better utilized on your achievements. Invest time in your relationships? Invest time in your work instead.","cn":"作为一个社会,我们崇拜\\"在通往成功的路上失去朋友\\"这一概念。我记得在高中时听到过:\\"不要担心失去友 谊,只需专注于学习和考上大学。从长远来看,那才是唯一重要的事情。\\"这种情绪并非我独有的经历。它在 许多成功故事中被宣扬,并且嵌入在我们看待成长的方式中。励志演讲者会推动他们的听众对失去朋友这一 不可避免的结局感到满足。花太多时间和朋友在一起?你正在浪费本可以更好地用于你的成就上的时间。 在你的人际关系上投入时间?把时间投入到你的工作上吧。"},{"en":"This constant need to succeed has blinded us from seeing through the whirlwind of change that accompanies our everyday lives. We are expected to tangibly succeed, earn awards, get higher positions, earn better grades. In order to succeed, we lose friends, and that has sadly become normalized.","cn":"这种对成功的持续需求使我们看不清伴随日常生活而来的变化旋涡。我们被期望取得有形的成功,赢得奖 项,获得更高的职位,取得更好的成绩。为了成功,我们失去了朋友,而这已可悲地变得正常化了。"},{"en":"We cannot be complacent with losing friendships because they are our anchors. Yes, pursue success. Challenge yourself. Push limits. But contrary to all the self-proclaimed success experts, doing it alone does not make you more successful or any better than someone who achieved it with the help of others.","cn":"我们不能对失去友谊感到满足,因为它们是我们的锚。是的,追求成功。挑战自己。突破极限。但与所有 那些自封的成功专家相反,独自做到这一点并不会让你更成功,也不会让你比在他人帮助下实现它的人更 优秀。"},{"en":"Put effort into fostering healthy relationships, and maintaining them through your busy schedule that seems like it leaves no time for anyone else. Although we may be living in a society that treasures the independent pursuit of achievement, having people to support and love you on the way is far more important than any end result.","cn":"努力培养健康的人际关系,并在你那似乎不为任何其他人留出时间的繁忙日程中维持这些关系。尽管我们可 能生活在一个珍视独立追求成就的社会中,但在这条路上有人支持和爱你远比任何最终结果都重要得多。"}],"questions":[{"num":46,"prompt":"What often happens when people are eager to pursue individual success?","options":["They lack a shoulder to cry on.","They have no soul to confide in.","They cannot find reliable friends.","They ignore their ties with friends."],"answer":"D","qtype":"细节题","locateEn":"However, more often than not, in our eagerness to seek individual success, we lose friends along the way and that has become part of the process.","locateCn":"然而，多数情况下，在我们急于追求个人成功的过程中，我们沿途失去了朋友，而这已经成 为这一过程的一部分。","translation":""},{"num":47,"prompt":"What does the author advise people to do in their pursuit of radical individualism?","options":["Reexamine its detrimental effects.","Shrug off the loss of their loved ones.","Avoid the chaos and turmoil involved.","Remove aggressive obstacles in the way."],"answer":"A","qtype":"细节题","locateEn":"We must reevaluate the harm of radical, individual freedom.","locateCn":"我们必须重新评估极端个人自由的危害。","translation":""},{"num":48,"prompt":"What is American society's assumption of personal achievement?","options":["It is to be duly celebrated and highly commended.","It is a sure way to fulfill a person's dream.","It revolves around an individualistic culture.","It reflects a person's exceptional endeavor."],"answer":"D","qtype":"细节题","locateEn":"Society tends to celebrate personal achievement and commend it based on the assumption that winning or succeeding is a consequence of working harder than the next person.","locateCn":"社会倾向于赞美个人成就，并基于一种预设来推崇它，这种预设是：获胜或成功是比别人更 努力工作的结果。","translation":""},{"num":49,"prompt":"What is preached in many success stories?","options":["Attaching importance to academic gains on the road to success.","Investing one's time in work instead of connecting with friends.","Trying to strengthen friendships in one's pursuit of personal success.","Excelling in academic performance to get into a prestigious college."],"answer":"B","qtype":"细节题","locateEn":"Motivational speakers will push their audience to be complacent to the inevitable end of losing friends. Spend too much time with friends? You're losing time better utilized on your achievements. Invest time in your relationships? Invest time in your work instead.","locateCn":"励志演讲者会推动听众坦然接受 \\"失去朋友\\" 这一不可避免的结局。和朋友花太多时间？你 正在浪费本可用于个人成就的时间。把时间投入到人际关系上？不如把时间投入到工作上。 49.What is preached in many success stories? A)Attaching importance to academic gains on the road to success. B)Investing one's time in work instead of connecting with friends. C)Trying to strengthen friendships in one's pursuit of personal success. D)Excelling in academic performance to get into a prestigious college.","translation":""},{"num":50,"prompt":"What can we infer from the passage regarding the pursuit of success?","options":["No one can succeed without pushing limits.","No one can afford to neglect close friends.","Collectivism is superior to individualism.","Success experts often lead people to ruin."],"answer":"B","qtype":"推断题","locateEn":"We cannot be complacent with losing friendships because they are our anchors. Yes, pursue success. Challenge yourself. Push limits. But contrary to all the self-proclaimed success experts, doing it alone does not make you more successful or any better than someone who achieved it with the help of others.","locateCn":"我们不能对失去友谊袖手旁观，因为朋友是我们的锚。是的，去追求成功，挑战自己，突破 极限。但与所有自封的成功专家所言相反，独自一人完成它，并不会让你更成功，也并不比 那些借助他人之力成功的人更高一筹。","translation":""}]},{"paragraphs":[{"en":"During his acceptance speech for the Nobel Peace Prize, Martin Luther King Jr. said, \\"I believe that unarmed truth and unconditional love will have the final word in reality.\\"","cn":"在诺贝尔和平奖获奖感言中,小马丁·路德·金说:\\"我相信,手无寸铁的真理和无条件的爱在现实中终将获胜。\\""},{"en":"More than five decades later, our society is still struggling to separate truth from fantasy, fact from fiction. From disputes over the climate change to debates about how slavery is taught, America is at a crossroads. And the battle for equity is at the heart of these vital conversations.","cn":"五十多年后,我们的社会仍在努力区分真实与幻想、事实与虚构。从关于气候变化的争论到关于如何教授奴 隶制的辩论,美国正处于十字路口。而公平之战正是这些重要对话的核心。"},{"en":"Study after study shows that inequity has had appalling consequences. A 2020 report by Citi indicated that \\"Black students could have increased their lifetime incomes $90 - $113 billion\\" if equity issues related to higher education had been adequately addressed over the past two decades.","cn":"一项又一项研究表明,不公平已经造成了骇人的后果。花旗集团2020年的一份报告指出,\\"如果过去二十年高 等教育相关的公平问题得到充分解决,黑人学生本可以增加900亿至1130亿美元的终身收入\\"。"},{"en":"This statistic represents a flood of issues we've failed to confront as a nation. It also highlights one truth: We're missing out on valuable opportunities to bridge the differences that divide us. However, by honoring King's legacy, we can get our country back on the path toward true equity.","cn":"这一统计数据代表着我们作为一个国家未能直面的大量问题。它也凸显了一个真相:我们正在错失弥合分歧 的宝贵机会。然而,通过传承马丁·路德·金的遗志,我们可以让国家重回通往真正公平的道路。"},{"en":"Students - and adults for that matter - simply cannot understand the conflicts we have today without understanding what caused them in the first place. That means we have a responsibility to help them make connections between US history and current events. It also means giving them the tools they need to address inequity and bias in their own lives. Adherence to these principles, along with a commitment to truthful dialogue, can help every student better appreciate how far we've come and more clearly see the roads we have yet to travel.","cn":"学生——以及成年人——如果不理解最初导致冲突的原因,就根本无法理解我们今天面临的冲突。这意味 着我们有责任帮助他们在美国历史与时事之间建立联系。这也意味着要给他们提供在自己生活中应对不公 平和偏见所需的工具。遵循这些原则,加上对真实对话的承诺,可以帮助每个学生更好地认识到我们已经走 了多远,并更清楚地看到我们尚未踏上的道路。"},{"en":"With more truthful analysis of the need for more qualified, diverse educators, we can improve our recruiting, training, and retention strategies for schools across the country.","cn":"通过更真实地分析对更多合格的、多元化教育工作者的需求,我们可以改进全国各地学校的招聘、培训和留 用策略。"},{"en":"Unfortunately, our deeply rooted divisions are delaying these advancements. A recent survey found that 77 percent of Americans believe the nation is \\"more divided than ever before\\". But reports of increased polarization shouldn't persuade us to look away from one another. Instead, they should compel us to address our shared issues head-on.","cn":"不幸的是,我们根深蒂固的分歧正在延缓这些进步。最近的一项调查发现,77%的美国人认为国家\\"比以往任 何时候都更加分裂\\"。但关于两极分化加剧的报道不应说服我们将目光从彼此身上移开。相反,它们应该促 使我们正面应对我们共同的问题。"},{"en":"We are not, as some would suggest, living in a \\"post-racial society\\". We simply cannot afford to keep our heads buried in the sand when it comes to racial inequity. Unless we get honest about intolerance, bias, and how these social diseases impact the ways we treat one another, injustice will continue to haunt us. But our children and our grandchildren deserve better.","cn":"正如一些人所暗示的,我们并非生活在一个\\"后种族社会\\"。在种族不平等问题上,我们根本无法继续将头埋 在沙子里。除非我们诚实面对不宽容、偏见,以及这些社会疾病如何影响我们彼此对待的方式,否则不公正 将继续困扰我们。但我们的子孙后代应该得到更好的未来。"},{"en":"On this Martin Luther King Day and beyond, let's commit to working together to disrupt the status quo. Let's continue to build a better, more inclusive nation; and in the words of Martin Luther King Jr., \\"A society at peace with itself, a society that can live with its conscience.\\"","cn":"在这个马丁·路德·金日以及之后的日子里,让我们致力于共同努力打破现状。让我们继续建设一个更美好、 更包容的国家;用小马丁·路德·金的话说,\\"一个与自身和平相处的社会,一个能够心安理得的社会。\\""}],"questions":[{"num":51,"prompt":"What does the author think about today's America?","options":["It is struggling to transform fiction into reality.","It has been the focus of many vital conversations.","It still has a long way to go before equity can be truly realized.","It has got to a point where people disagree on nearly every issue."],"answer":"C","qtype":"细节题","locateEn":"However, by honoring King's legacy, we can get our country back on the path toward true equity.","locateCn":"然而，只要传承（马丁·路德·）金的精神遗产，我们就能让国家重新回到通向真正公平的道 路上。","translation":""},{"num":52,"prompt":"What do we learn from the passage about black students in the past 20 years?","options":["They have been unfairly treated regarding higher education.","They have been battling hard to address equity issues.","They have boosted their lifetime incomes by billions of dollars.","They have come to see the consequences of racial discrimination."],"answer":"A","qtype":"细节题","locateEn":"A 2020 report by Citi indicated that \\"Black students could have increased their lifetime incomes $90 – $113 billion\\" if equity issues related to higher education had been adequately addressed over the past two decades.","locateCn":"花旗集团 2020 年的一份报告指出：如果过去二十年里高等教育中的公平问题得到了妥善处 理，黑人学生本可以多挣 900 亿到 1130 亿美元的终身收入。 52.What do we learn from the passage about black students in the past 20 years? A)They have been unfairly treated regarding higher education. B)They have been battling hard to address equity issues. C)They have boosted their lifetime incomes by billions of dollars. D)They have come to see the consequences of racial discrimination.","translation":""},{"num":53,"prompt":"How can Americans bridge the differences that divide them?","options":["By dealing with the thorny issues confronting them.","By seizing every chance to enhance racial harmony.","By continuing to pursue Martin Luther King Jr.'s cause.","By striving to identify exceedingly valuable opportunities."],"answer":"C","qtype":"细节题","locateEn":"However, by honoring King's legacy, we can get our country back on the path toward true equity.","locateCn":"然而，只要传承（马丁·路德·）金的精神遗产，我们就能让国家重新回到通向真正公平的道 路上。","translation":""},{"num":54,"prompt":"How do most Americans view America as a nation according to a recent survey?","options":["It is compelled to address its historical social issues.","It is delaying advancements toward racial equality.","It has kept itself from polarization.","It has become increasingly split."],"answer":"D","qtype":"细节题","locateEn":"A recent survey found that 77 percent of Americans believe the nation is \\"more divided than ever before\\".","locateCn":"一项近期调查发现，77% 的美国人认为这个国家「前所未有地分裂」。","translation":""},{"num":55,"prompt":"What does the author suggest Americans do?","options":["Ensure the well-being of their children and grandchildren.","Make joint efforts to tackle the nation's equity issues.","Restrain their intolerance and discrimination.","Restore social order for a harmonious nation."],"answer":"B","qtype":"细节题","locateEn":"On this Martin Luther King Day and beyond, let's commit to working together to disrupt the status quo.","locateCn":"在马丁·路德·金日及今后，让我们一起承诺携手努力，打破现状。 55.What does the author suggest Americans do? A)Ensure the well-being of their children and grandchildren. B)Make joint efforts to tackle the nation's equity issues. C)Restrain their intolerance and discrimination. D)Restore social order for a harmonious nation.","translation":""}]}],"listening":[{"kind":"conversation","segments":[{"speaker":"W","en":"Today's special guest is Lord Blackwell, one of our country's most experienced and distinguished career diplomats. Welcome!","cn":"今天的特别嘉宾是Blackwell勋爵，我国最有经验、最杰出的职业外交官之一。欢迎！"},{"speaker":"M","en":"It's my pleasure.","cn":"很荣幸。"},{"speaker":"W","en":"Our audience will be most interested in learning about a career in the foreign service. However, before we talk about that, I'd like to ask you about the current developments hitting the news today regarding the Republic of Winopia. What can you tell us?","cn":"我们的观众会非常想了解外交工作的职业生涯。不过，在我们谈这个之前，我想问问您关于今天新闻 报道的Winopia共和国的最新动态。您能告诉我们什么吗？"},{"speaker":"M","en":"I'm afraid I don't know much beyond what we've all seen on the news. It looks like the government of Winopia seems to be undergoing some sort of crisis of legitimacy, and an interim administration has been transitionally established until a head of state is agreed on. But my career work has mostly focused around the continental spheres of Europe and the Americas, and thus I've never been involved with Winopian relations. It's for this reason that I don't know anything on this matter beyond what we can all read in the newspapers.","cn":"恐怕我知道的不比我们在新闻上看到的多。看起来Winopia政府似乎正在经历某种合法性危机，已经 过渡性地建立了一个临时政府，直到就国家元首达成一致。但我的职业工作主要集中在欧洲和美洲大陆范 围，因此我从未参与过与Winopia的关系。正是因为这个原因，在这件事上我知道的不比我们在报纸上读 到的更多。"},{"speaker":"W","en":"Oh, I see.","cn":"哦，我明白了。"},{"speaker":"M","en":"Nevertheless, be rest assured that our expert envoys at our consulate there will be closely monitoring the situation, and I expect our bilateral relations with that country will not be affected.","cn":"不过，请放心，我们在那里领事馆的专家特使会密切关注局势，我预计我们与该国的双边关系不会受 到影响。"},{"speaker":"W","en":"So how does one get a career in foreign relations?","cn":"那么一个人怎样才能从事外交关系职业呢？"},{"speaker":"M","en":"There are many different paths one can take. All diplomats have their own story. But in my case, I got a degree in electrical engineering followed by six years' service in the air force. Then I went to law school, and upon obtaining a degree in international law, I joined the diplomatic corps where I have been for 22 years.","cn":"可以走很多不同的路径。每个外交官都有自己的故事。但就我而言，我获得了电气工程学位，然后在 空军服役六年。之后我去了法学院，在获得国际法学位后，我加入了外交部门，至今已经22年了。"},{"speaker":"W","en":"What would you say are the key skills one needs for the job?","cn":"您认为这份工作需要哪些关键技能？"},{"speaker":"M","en":"There are so many. Being a hard worker and a good student is important. You never stop learning. In addition, a diplomat needs to be very articulate in their discourse and rhetoric. Whether it is defusing attention or enacting policy, people and communication skills are vital.","cn":"有太多了。成为一个勤奋的工作者和好学生很重要。你永远不会停止学习。此外，外交官需要在话语 和修辞上非常善于表达。无论是化解注意力还是执行政策，人际交往和沟通技巧都至关重要。"}],"questions":[{"prompt":"What do we learn about the man from the conversation?","translation":"从对话中我们了解到这位男士的什么信息?","options":["He has distinguished himself in foreign service.","He is his country's ambassador to Winopia.","He is currently an electrical engineer.","He craves attention from the media."],"answer":"A","qtype":"细节题","locateEn":"Today's special guest is Lord Blackwell, one of our country's most experienced and distinguished career diplomats.","locateCn":"今天的特邀嘉宾是布莱克韦尔勋爵，他是我国最有经验、最杰出的职业外交官之一。","signal":"主持人开场介绍嘉宾的那一句。答案信号是\\"访谈开场主持人对嘉宾的定性介绍\\"——one of","num":1},{"prompt":"What does the man say the government of Winopia is probably undergoing?","translation":"这位男士说Winopia政府可能正在经历什么?","options":["A government reshuffle.","A fundamental reform.","Some sort of political reorientation.","Some sort of crisis of legitimacy."],"answer":"D","qtype":"细节题","locateEn":"It looks like the government of Winopia seems to be undergoing some sort of crisis of legitimacy, and an interim administration has been transitionally established until a head of state is agreed on.","locateCn":"看起来 Winopia 政府似乎正在经历某种合法性危机，已经过渡性地成立了临时政府，直到 选定国家元首为止。","signal":"被问方对局势直接下定性结论的应答。答案信号是\\"被问者的直接应答\\"：主持人问 Winopia","num":2},{"prompt":"According to the man, how does one get a career in foreign relations?","translation":"根据这位男士的说法,如何获得外交关系方面的职业?","options":["All diplomats have more or less similar stories to tell.","It is a prerequisite to get some practice in diplomacy.","Different people can take different paths.","It is a must to first obtain a law degree."],"answer":"C","qtype":"细节题","locateEn":"There are many different paths one can take. All diplomats have their own story.","locateCn":"可以走的路有很多条。每个外交官都有自己的故事。","signal":"应答开头的总括句，先于个人举例。答案信号是\\"被问方应答的第一句总括\\"——There are","num":3},{"prompt":"What do the speakers mainly discuss by the end of the conversation?","translation":"在对话结束时,说话者主要讨论了什么?","options":["Key skills required of a diplomat.","The making of an expert diplomat.","Diplomatic discourse and rhetoric.","Contributions by diplomatic envoys."],"answer":"A","qtype":"主旨题","locateEn":"W: What would you say are the key skills one needs for the job? M: There are so many. Being a hard worker and a good student is important... a diplomat needs to be very articulate in their discourse and rhetoric...people and communication skills are vital.","locateCn":"女：你认为这份工作需要哪些关键技能？男：太多了。做个勤奋的人、好学的人很重要…… 外交官在言辞和修辞上要非常善于表达……为人处世和沟通能力至关重要。","signal":"结尾一问一答围着\\"关键技能\\"展开。答案信号是\\"结尾这轮问答的共同焦点\\"：主持人问 the","num":4}]},{"kind":"conversation","segments":[{"speaker":"M","en":"It's getting late and we're both displaying signs of weariness. I think we should call it a day and meet again tomorrow morning.","cn":"时间不早了，我们俩都显出疲惫的迹象了。我觉得今天就到这儿吧，明天早上再碰头。"},{"speaker":"W","en":"Oh, come on, Jeff. We are so close! Don't you think we are almost done? Let's do two more hours, please.","cn":"哎呀，别这样，Jeff。我们都快完成了！你不觉得马上就做完了吗?再干两个小时吧,求你了。"},{"speaker":"M","en":"One hour, then I'm going home.","cn":"一个小时,然后我就回家。"},{"speaker":"W","en":"OK, fine. I think we are making good progress, and that with a few more amendments, we will be all done.","cn":"好吧,行。我觉得我们进展不错,再修改几处,应该就全部搞定了。"},{"speaker":"M","en":"I'm sure looking forward to it. I'm so tired of this project. Don't get me wrong. It's a great professional opportunity for me and a milestone for the company, but it's just been so long.","cn":"我当然盼着呢。我对这个项目真是烦透了。别误会,这对我来说是个很好的职业机会,对公司来说也是个 里程碑,只是时间拖得太久了。"},{"speaker":"W","en":"Yeah. Two months working on nothing but the same contract is a little tough. Nevertheless, I think that with a bit of luck, we'll be done by next week.","cn":"是啊。两个月就做同一份合同,确实有点难熬。不过,我觉得运气好的话,下周就能完成。"},{"speaker":"M","en":"Ha, you must be delusional.","cn":"哈,你肯定是产生幻觉了。"},{"speaker":"W","en":"You don't think so?","cn":"你不这么认为?"},{"speaker":"M","en":"No chance. Sections 4, 5, 8 and 9 still have to be aligned to the new framework. Then we need to proofread the whole thing and make sure all selling points are watertight.","cn":"不可能。第4、5、8和9节还得和新框架对齐。然后我们得校对整个文档,确保所有卖点都无懈可击。"},{"speaker":"W","en":"But that will all take no more than a couple of days.","cn":"但那些最多也就几天时间。"},{"speaker":"M","en":"I wasn't finished. When we are done with it and send it upstairs, what do you think will happen?","cn":"我还没说完呢。等我们做完提交上去,你觉得会发生什么?"},{"speaker":"W","en":"What?","cn":"什么?"},{"speaker":"M","en":"They'll argue about it for like a month. There's always going to be the odd board member who intervenes and demands rectifications be made. They might think they're being helpful, but in reality they're being obstructive and hampering progress.","cn":"他们会争论一个月左右。总会有某个董事会成员跳出来要求修改。他们可能觉得自己在帮忙,但实际上 是在妨碍进展。"},{"speaker":"W","en":"Oh, Jeff, you're too preoccupied and cynical. It won't be anywhere as bad as that. You'll see, the entire managerial hierarchy wants to see this project implemented as soon as possible, and the board, too, is virtually unanimous in its support. Go on then, let's stop there and meet up again same time tomorrow.","cn":"哎,Jeff,你太多虑也太悲观了。不会像你说的那么糟的。你等着看吧,整个管理层都想尽快实施这个项目, 董事会也几乎一致支持。那行,我们今天就到这儿,明天同一时间再见。"}],"questions":[{"prompt":"Why does the man suggest they call it a day?","translation":"男士为什么建议他们今天就到此为止?","options":["They have got their work done.","They both look tired","They can meet again tomorrow anyway.","They are both anxious to go home."],"answer":"B","qtype":"细节题","locateEn":"It's getting late and we're both displaying signs of weariness. I think we should call it a day and meet again tomorrow morning.","locateCn":"已经很晚了，我俩都显出疲态了。我觉得今天就到这儿吧，明天上午再继续。","signal":"提议收工那句里紧贴的理由状语。男方说 I think we should call it a day（提议收工）之前","num":5},{"prompt":"What does the woman say is a little tough?","translation":"女士说什么有点难?","options":["The board members' insufficient support.","Two months devoted to the same contract.","Working two months without any progress.","The man's long concentration on the project."],"answer":"B","qtype":"细节题","locateEn":"Two months working on nothing but the same contract is a little tough.","locateCn":"整整两个月只扑在同一份合同上，是有点难熬。","signal":"题干同词 tough 在原文的复现处即落点。女方原话 Two months working on nothing","num":6},{"prompt":"What does the man say the woman must be in thinking they'll finish by next week?","translation":"男士说女士认为他们下周能完成是怎样的想法?","options":["Unprofessional.","Inspirational.","Exceptional.","Delusional."],"answer":"D","qtype":"态度观点题","locateEn":"Ha, you must be delusional.","locateCn":"哈，你一定是在痴心妄想吧。","signal":"男方对女方乐观预期的直接回怼。女方在 we'll be done by next week 表达乐观，男方紧","num":7},{"prompt":"What does the entire managerial hierarchy want to see according to the woman?","translation":"根据女士所说,整个管理层想要看到什么?","options":["Fewer rectifications of the contract.","More support from the board members.","The early implementation of the project.","The alignment of all sections of the contract."],"answer":"C","qtype":"细节题","locateEn":"the entire managerial hierarchy wants to see this project implemented as soon as possible","locateCn":"整个管理层都希望这个项目尽快落地实施。","signal":"愿望词 wants to see 直接领出答案。女方 the entire managerial hierarchy wants to","num":8}]},{"kind":"passage","segments":[{"speaker":"","en":"One thing I've learned in a quarter-century of management is that there are ample gray areas in human behavior, and that there may not always be clear right-or-wrong solutions to employee disputes. When two people have different versions of the same event, it can be hard to know whom to believe. One such circumstance always comes back to me. It happened years ago, and it's a measure of the forgettable nature of the conflict that I no longer even recall what the dispute was about, but I definitely recall the resolution. Two talented young executives, one of whom I was managing, had vastly different accounts of the same event, and it seemed likely we'd never get to the truth. We reached the deadlock, and the manager of the other individual said, \\"Here's something I learned from an excellent manager I once worked for. He used to say, 'When in doubt, assume positive intent.'\\" And just like that, we had a path forward. My counterpart and I agreed we might never ascertain the actual facts of the matter; quite likely there were elements of truth in both employees' stories. We agreed to monitor their actions and relationship going forward, but to intervene no further. We assumed the best about both of them and moved on. The result was that we were able to put the conflict behind us. In fact, their problems didn't recur. Over the years, this general approach has proved useful. Whenever the truth is obscure, assuming positive intent and agreeing to move on can be a constructive decision.","cn":"在担任管理职务的25年里,我学到的一点是,人类行为中存在大量灰色地带,对于员工纠纷可能并不总是有明 确的对错解决方案。当两个人对同一事件有不同的说法时,很难知道该相信谁。有一件事总让我记忆犹新。 那是多年前发生的,这场冲突之所以容易被遗忘,以至于我现在甚至不记得争议是关于什么的,但我确实记得 解决方法。两位才华横溢的年轻主管,其中一位由我管理,对同一事件有截然不同的说法,而且似乎我们永远 也无法查明真相。我们陷入了僵局,另一位员工的经理说:'有件事是我从曾经共事过的一位优秀经理那里学 到的。他常说,当你有疑问时,假设对方有善意。'就这样,我们有了前进的方向。我的同事和我一致认为,我们 可能永远无法确定事情的真实情况;很可能两位员工的说法中都有真实的成分。我们同意今后监督他们的行 为和关系,但不再进一步介入。我们对他们两人都做了最好的假设,然后继续前进。结果是我们能够把冲突 抛在身后。事实上,他们的问题没有再次出现。多年来,这种总体方法被证明是有用的。每当真相模糊不清 时,假设积极意图并同意继续前进可能是一个建设性的决定。"}],"questions":[{"prompt":"When can it be hard to know whom to believe?","translation":"什么时候很难知道该相信谁？","options":["When two employees propose contrary solutions to their dispute.","When two employees are directed by their respective manager.","When two people behave in an apparently clashing manner.","When two people tell different stories of the same event."],"answer":"D","qtype":"细节题","locateEn":"When two people have different versions of the same event, it can be hard to know whom to believe.","locateCn":"当两个人对同一件事有不同的版本时，就很难知道该相信谁。","signal":"题干原句几乎照搬。原文 When two people have different versions of the same event,","num":9},{"prompt":"What does the speaker definitely recall about the dispute mentioned as an example?","translation":"关于作为例子提到的那次争议,说话者明确记得什么？","options":["How it got resolved.","How it happened.","What it was about.","When it was settled."],"answer":"A","qtype":"细节题","locateEn":"It happened years ago, and it's a measure of the forgettable nature of the conflict that I no longer even recall what the dispute was about, but I definitely recall the resolution.","locateCn":"那是多年前的事了，这场冲突有多无足轻重可见一斑——我甚至已不记得争执的内容是什 么，但我清楚地记得它是怎么解决的。","signal":"but 转折后才是落点。句中 I no longer even recall what the dispute was about, but I","num":10},{"prompt":"What did the speaker and his counterpart do when the two employees gave different","translation":"当两名员工对同一事件给出不同说法时,说话者和他的对应方做了什么？","options":["They intervened promptly lest their dispute escalate.","They tried to ascertain the actual facts of the matter.","They assumed the best about them and moved on.","They persuaded them to put their conflict aside."],"answer":"C","qtype":"细节题","locateEn":"We agreed to monitor their actions and relationship going forward, but to intervene no further. We assumed the best about both of them and moved on.","locateCn":"我们商定今后留意他们的言行和关系，但不再进一步介入。我们对两人都往好处想，然后向 前看了。","signal":"结论句直陈所做。原文 We assumed the best about both of them and moved on 是对","num":11}]},{"kind":"passage","segments":[{"speaker":"","en":"For some Americans, going out to dinner is a treat, planned and budgeted for. For others, it's just a daily occurrence. And that second group of people is becoming the majority as the number of Americans who enjoy cooking is declining. In the early 2000s, researcher Eddie Yoon conducted a survey to ascertain Americans' attitudes to cooking. The survey found that 15% of Americans loved to cook, 50% said they hated to cook and 35% reported mixed feelings. When Yoon conducted the same survey 15 years later, only 10% of respondents reported a love of cooking, 45% said they hated it and 45% had mixed feelings. Yoon asserts cooking is akin to sewing. As recently as the early 20th century, many Americans sewed their own clothing. Today, the vast majority of Americans buy clothing; only a tiny minority still sew, and they do it mainly as a hobby. Yoon believes the number of home cooks will diminish in a similar fashion. Currently, the average American household spends over $3,000 per year on dining out. However, what people save in convenience, they lose in cash. Take buying lunch on workdays for example. People spend, on average, $10 per meal when they buy lunch. Making your own lunch, meanwhile, will cost less. One survey found people only spend on average $6.30 when they bring lunch prepared at home. Americans' growing aversion to spending time in the kitchen signifies a host of challenges for the grocery industry. It's likely to detrimentally impact family finances as well.","cn":"对于一些美国人来说,外出就餐是一种享受,需要计划和预算。对于另一些人来说,这只是日常活动。随着喜 欢烹饪的美国人数量下降,第二类人正在成为多数。在21世纪初,研究员Eddie Yoon进行了一项调查,以了解 美国人对烹饪的态度。调查发现,15%的美国人热爱烹饪,50%的人表示讨厌烹饪,35%的人感觉复杂。当 Yoon在15年后进行同样的调查时,只有10%的受访者表示热爱烹饪,45%的人说他们讨厌烹饪,45%的人感 觉复杂。Yoon认为烹饪类似于缝纫。就在20世纪初,许多美国人还自己缝制衣服。如今,绝大多数美国人购 买服装;只有极少数人仍在缝纫,而且他们主要把它作为一种爱好。Yoon认为家庭烹饪者的数量将以类似的 方式减少。目前,美国家庭平均每年在外出就餐上花费超过3000美元。然而,人们在便利性上节省的,却在金 钱上损失了。以工作日购买午餐为例。人们购买午餐时平均每餐花费10美元。与此同时,自己做午餐的成 本更低。一项调查发现,人们带自制午餐时平均只花费6.30美元。美国人越来越不愿意花时间在厨房,这意 味着杂货行业面临一系列挑战。这也可能对家庭财务产生不利影响。"}],"questions":[{"prompt":"What do an increasing number of Americans do according to the passage?","translation":"根据文章，越来越多的美国人在做什么?","options":["Dine out daily.","Budget sensibly.","Enjoy cooking.","Shop at groceries."],"answer":"A","qtype":"细节题","locateEn":"For others, it's just a daily occurrence. And that second group of people is becoming the majority as the number of Americans who enjoy cooking is declining.","locateCn":"对另一些人来说，外出吃饭只是每天都在发生的平常事。而随着喜欢做饭的美国人数量在下 降，这第二类人正在成为多数。","signal":"becoming the majority锁定增多的群体。答案信号是 becoming the majority（正在成","num":12},{"prompt":"What does Eddie Yoon think cooking is akin to?","translation":"Eddie Yoon认为烹饪类似于什么?","options":["Shopping.","Sewing.","Entertaining oneself.","Fashion designing."],"answer":"B","qtype":"细节题","locateEn":"Yoon asserts cooking is akin to sewing. As recently as the early 20th century, many Americans sewed their own clothing.","locateCn":"尤恩断言，做饭好比缝纫。就在不久前的20世纪初，很多美国人还自己缝制衣服。","signal":"akin to后面紧接的名词。答案信号就是类比词 akin to，它在原文里直接说出 cooking is","num":13},{"prompt":"What will Americans be able to do by making their own lunch?","translation":"美国人通过自己做午餐能够做到什么?","options":["Satisfy their taste.","Cut down expenses.","Eat more healthily.","Cultivate new hobbies."],"answer":"B","qtype":"细节题","locateEn":"People spend, on average, $10 per meal when they buy lunch. Making your own lunch, meanwhile, will cost less. One survey found people only spend on average $6.30 when they bring lunch prepared at home.","locateCn":"人们买午餐平均每顿花10美元。而自己做午餐则会更便宜。一项调查发现，自带在家做好的 午餐时，人们平均只花6.30美元。","signal":"cost less加$10对$6.30的数字对比。答案信号有两层：一是明示的 Making your own","num":14},{"prompt":"What does the passage say signifies a host of challenges for America's grocery industry?","translation":"文章说什么标志着美国杂货业面临诸多挑战?","options":["People's intense focus on convenience.","People's deteriorating family finances.","People's strong aversion to junk foods.","People's increasing dislike of cooking."],"answer":"D","qtype":"细节题","locateEn":"Americans' growing aversion to spending time in the kitchen signifies a host of challenges for the grocery industry.","locateCn":"美国人越来越不愿在厨房里花时间，这预示着杂货业将面临一系列挑战。","signal":"signifies连接现象与挑战。答案信号是因果动词 signifies a host of challenges，它把后","num":15}]},{"kind":"lecture","segments":[{"speaker":"","en":"Every year, of the more than 2.5 billion bags checked onto flights worldwide, 26 million go missing — and of that 26 million, 1 million never make it back to their original owner. Bad weather and flight delays, miscoded destination tags and some people simply forgetting to pick up one of their bags are a few of the reasons. But the number-one reason a bag ends up lost is that it has no ID tag, and airlines don't know to whom it belongs.","cn":"每年,全球超过25亿件托运行李中,有2600万件丢失——而在这2600万件中,有100万件永远无法回到原主 人手中。恶劣天气和航班延误、目的地标签编码错误以及有些人干脆忘记取其中一件行李,这些都是部分原 因。但行李最终丢失的首要原因是没有身份标签,航空公司不知道它属于谁。"},{"speaker":"","en":"Transferring baggage from check-in to departure gates to arrival gates to baggage claim is a delicate piece of timing. If the system moves too slowly, the bags won't make connecting flights. If it's too fast, the bags may make the connection but the passengers might miss the flight. Each airport has its own way of allotting how much time a bag needs to move in transit. Some airports have sophisticated automated systems, including scanners that read baggage labels, destination-coded vehicles that load and unload the bags without stopping, and sorting machines that route baggage to the appropriate gate. Even so, all that technology may not save your baggage tag from being torn off on the conveyor belt, making you the owner of a bag with no name.","cn":"将行李从值机柜台转运到出发登机口、抵达登机口再到行李提取处,是一项精细的时间把控工作。如果系统 运转太慢,行李就赶不上转机航班。如果太快,行李可能赶上了转机,但乘客可能错过航班。每个机场都有自 己的方式来分配行李在中转过程中所需的时间。一些机场拥有精密的自动化系统,包括读取行李标签的扫描 仪、无需停车即可装卸行李的目的地编码车辆,以及将行李分拣到相应登机口的分拣机。即便如此,所有这 些技术也可能无法阻止你的行李牌在传送带上被撕掉,使你成为一件无名行李的主人。"},{"speaker":"","en":"Once a bag goes missing and the passenger files a claim, the bag is declared \\"mishandled\\" by the carrier. Mishandled refers to bags that have been delayed, lost, stolen or damaged. Most delayed bags are only one flight behind their owners and can be delivered within 24 hours. The other bags are examined by airline employees for clues to their ownership and destination. If the mystery is solved, those bags are returned to their owners within four or five days. Bags with no destination code or identification tag are shipped to a central warehouse, and undergo a comprehensive baggage tracing process over the next 90 days.","cn":"一旦行李丢失且乘客提出索赔,该行李就被承运人宣布为\\"处理不当\\"。处理不当是指延误、丢失、被盗或损 坏的行李。大多数延误的行李只比其主人晚一个航班,可以在24小时内送达。其他行李则由航空公司员工 检查,寻找关于所有权和目的地的线索。如果谜团得到解决,这些行李会在四到五天内归还给主人。没有目 的地代码或身份标签的行李会被运往中央仓库,在接下来的90天内进行全面的行李追踪流程。"},{"speaker":"","en":"Airlines inventory their mishandled baggage, and many use a database to match the contents with owners' descriptions. It takes about three months to go from \\"missing in action\\" to \\"irretrievably lost\\". Once that happens, the bags are donated to charity, sold at auction, or purchased by a company which sells them to the public.","cn":"航空公司会清点处理不当的行李,许多公司使用数据库将行李内容与主人的描述进行匹配。从\\"失踪\\"到\\"无 法找回的丢失\\"大约需要三个月时间。一旦发生这种情况,这些行李会被捐赠给慈善机构、拍卖出售,或由某 家公司购买后再出售给公众。"},{"speaker":"","en":"So never pack anything of real value in your checked baggage. And make sure your name is on the bag, along with your phone number, so an agent can contact you.","cn":"因此,切勿在托运行李中装入任何真正有价值的物品。并确保你的姓名在行李上,连同你的电话号码,这样工 作人员就能联系到你。"}],"questions":[{"prompt":"What is the number-one reason a bag ends up lost according to this talk?","translation":"根据这段话，行李箱最终丢失的首要原因是什么?","options":["Its owner's flight is delayed because of bad weather.","Airlines cannot find its owner without an ID tag on it.","Airline staff have not correctly coded its destination tag.","Its owner has forgot to pick it up from the baggage claim."],"answer":"B","qtype":"细节题","locateEn":"But the number-one reason a bag ends up lost is that it has no ID tag, and airlines don't know to whom it belongs.","locateCn":"但行李丢失的头号原因是它没有身份标签，于是航空公司不知道它属于谁。","signal":"转折词 But 加最高级 number-one 双重锁定。前文用 Bad weather and flight delays,","num":16},{"prompt":"What may happen to your baggage even when there are sophisticated","translation":"即使有先进的自动化系统,您的行李可能会发生什么情况?","options":["Its tag may get torn off on the conveyor belt.","Its tag may get stuck in the sorting machine.","It may be sent to a wrong destination.","It may be picked up by someone else."],"answer":"A","qtype":"细节题","locateEn":"Even so, all that technology may not save your baggage tag from being torn off on the conveyor belt, making you the owner of a bag with no name.","locateCn":"即便如此，所有这些技术也未必能让你的行李标签免于在传送带上被扯掉，结果你成了一个 没有名字的行李的主人。","signal":"让步转折 Even so 引出真正后果。前文 Some airports have sophisticated automated","num":17},{"prompt":"What does the speaker advise us to do at the end of the talk?","translation":"讲话者在结尾处建议我们做什么?","options":["Purchase irretrievably lost things at auction.","Contact the airport staff to find our missing bag.","Get the airline agent's phone number before boarding.","Avoid packing valuable items in our checked baggage."],"answer":"D","qtype":"细节题","locateEn":"So never pack anything of real value in your checked baggage.","locateCn":"所以，千万不要把任何真正贵重的东西放进你的托运行李里。","signal":"结尾祈使句 never 直发忠告。末段以 So never pack anything of real value in your","num":18}]},{"kind":"lecture","segments":[{"speaker":"","en":"You've probably been with someone who ignored you while interacting with his or her smartphone. And you've probably engaged in this behavior yourself. In a recent survey, nine out of ten respondents said they'd used their smartphone during their most recent social activity. There's also evidence that this behavior is socially harmful. It can leave people less satisfied with their face-to-face interactions. And it can generate feelings of resentment and jealousy. Now, the Journal of Applied Social Psychology has published a new study exploring the reasons for these effects.","cn":"你可能曾和某个在社交场合只顾玩智能手机而忽视你的人待在一起。而且你自己可能也有过这种行为。在 最近的一项调查中,十分之九的受访者表示他们在最近一次社交活动中使用了智能手机。也有证据表明这种 行为对社交有害。它会让人们对面对面互动的满意度降低。而且它还会产生怨恨和嫉妒的情绪。现在,《应 用社会心理学杂志》发表了一项新研究,探讨了产生这些影响的原因。"},{"speaker":"","en":"The study included 128 mostly female student participants. The participants watched a three-minute animation in which two cartoon figures interacted and engaged in a conversation. The conversation couldn't be heard but could be detected through mouth movements. Participants had to imagine themselves as the closest figure in the video and then make judgments about the conversations and how they felt about their conversation partners.","cn":"这项研究包括128名参与者,其中大多数是女学生。参与者观看了一段三分钟的动画,画面中两个卡通人物进 行互动并交谈。谈话内容听不到,但可以通过嘴部动作察觉到。参与者必须把自己想象成视频中较近的那个 人物,然后对谈话以及他们对谈话伙伴的感受做出判断。"},{"speaker":"","en":"In one version of the experiment, the phone of the participants' conversation partner remained unused on the table throughout the conversation. In another version, their partner's attention was quickly drawn to something on their phone and they spent the rest of the time interacting with their phone. A third version involved the participants' partner alternating between periods of interaction with their phone and periods where they ignored their phone. If you've experienced a similar situation, you probably won't be surprised by the results of the experiments.","cn":"在实验的一个版本中,参与者的谈话伙伴的手机在整个谈话过程中一直放在桌上未使用。在另一个版本中, 他们的伙伴的注意力很快被手机上的某些内容吸引,并在剩余时间里一直在玩手机。第三个版本涉及参与者 的伙伴在玩手机和不理会手机之间交替进行。如果你经历过类似的情况,你可能不会对实验结果感到惊讶。"},{"speaker":"","en":"The participants had a negative view of phone use during social interactions. The more it was present, the worse they considered both the quality of the interaction and the quality of the relationship.","cn":"参与者对社交互动期间使用手机持负面看法。手机使用越多,他们就越认为互动质量和关系质量都更差。"},{"speaker":"","en":"The researchers believed that focusing on one's phone instead of the person one is with has this effect because it's seen as a form of social exclusion. They assert that the behavior is analogous to when people have no choice but to eat alone in the school cafeteria. The twist is that this exclusion occurs while sharing a physical encounter and having a conversation. Researchers found that the behavior had adverse effects on participants' sense of belonging, need for meaning and self-esteem.","cn":"研究人员认为,专注于自己的手机而不是关注同伴之所以会产生这种影响,是因为它被视为一种社交排斥的 形式。他们断言,这种行为类似于人们别无选择只能独自在学校食堂吃饭的情况。不同的是,这种排斥发生 在共享一次面对面接触并进行谈话的过程中。研究人员发现,这种行为对参与者的归属感、意义需求和自尊 心产生了不利影响。"},{"speaker":"","en":"These negative effects are similar to those caused by traditional forms of social exclusion. The new findings are important because they elaborate our understanding of a subtle but common aspect of our daily experience. This common behavior can create vicious cycles of detachment even as we try to connect with others.","cn":"这些负面影响与传统形式的社交排斥造成的影响相似。这些新发现很重要,因为它们完善了我们对日常经历 中一个微妙但常见方面的理解。这种常见行为可能会造成疏离的恶性循环,即使我们试图与他人建立联系。"}],"questions":[{"prompt":"What does the speaker say about using one's smartphone during a face-to-","translation":"说话者关于在面对面交谈时使用智能手机说了什么?","options":["It can be behaviorally hazardous.","It can be especially disappointing.","It can be socially harmful.","It can be really embarrassing."],"answer":"C","qtype":"细节题","locateEn":"There's also evidence that this behavior is socially harmful.","locateCn":"也有证据表明，这种行为对社交是有害的。","signal":"提示证据的 evidence that 之后即结论。There's also evidence that this behavior is","num":19},{"prompt":"How did the participants in the new study respond regarding phone use during","translation":"新研究中的参与者对社交互动期间使用手机是如何回应的?","options":["They considered it inevitable.","They held a negative view towards it.","They were concerned with its effects.","They saw it as a sign of social evolution."],"answer":"B","qtype":"态度观点题","locateEn":"The participants had a negative view of phone use during social interactions.","locateCn":"参与者对社交互动中使用手机持负面看法。","signal":"主体 participants + 态度词 negative view。The participants had a negative view of","num":20},{"prompt":"What does the speaker say can result from the common behavior of using phones during","translation":"说话者说在面对面交谈时使用手机这种常见行为会导致什么?","options":["Elaborate forms of social contact.","Ill effects on one's sense of pride.","Poor relationships with others.","Vicious cycles of detachment."],"answer":"D","qtype":"细节题","locateEn":"This common behavior can create vicious cycles of detachment even as we try to connect with others.","locateCn":"即便我们试图与他人建立联系，这种常见行为也会造成疏离的恶性循环。","signal":"篇末 can create 引出最终后果。This common behavior can create vicious cycles of","num":21}]},{"kind":"lecture","segments":[{"speaker":"","en":"More and more people travel for a variety of reasons. Many are tourists, but many venture forth on personal or professional business. Whatever the reason for traveling, a common complaint of travelers is the impersonal accommodations they find. After spending five consecutive nights in five similar hotels, the business traveler may find it difficult to remember what happened from day to day, or even what towns were visited, and the tourist may get the mistaken impression that all cities are pretty much the same, at least as far as decoration, food and service are concerned.","cn":"越来越多的人因各种原因而旅行。许多人是游客,但也有许多人是为个人或职业事务而出行。无论旅行的原 因是什么,旅行者的一个普遍抱怨是他们所遇到的缺乏个性化的住宿。在连续五个晚上入住五家相似的酒店 后,商务旅行者可能会发现很难记起每天发生了什么,甚至记不清访问了哪些城镇,而游客可能会错误地认为 所有城市都大同小异,至少在装修、食物和服务方面是如此。"},{"speaker":"","en":"To combat this sense of impersonal sameness, travelers are taking advantage of in-home hospitality or Bed and Breakfast arrangements. B&Bs, I mean, Bed and Breakfast arrangements are private homes which offer lodging and breakfast in a very personalized, friendly setting. For decades, B&Bs have been the classic way to visit Europe, especially the British Isles. And in fact, they are not really a new idea in America. The tradition dates back to colonial times when inns were few and far between, and the weary traveler had to depend on the kindness of strangers for a meal and a bed. But the revival of B&Bs as desirable accommodations is a fairly recent phenomenon.","cn":"为了对抗这种缺乏个性的雷同感,旅行者正在利用家庭住宿或床位加早餐的安排。B&B,我是说,床位加早餐 安排是私人住宅,在非常个性化、友好的环境中提供住宿和早餐。几十年来,B&B一直是游览欧洲尤其是不 列颠群岛的经典方式。事实上,它们在美国并不是真正的新鲜事物。这一传统可以追溯到殖民时期,当时旅 店稀少,疲惫的旅行者不得不依靠陌生人的善意来获得一顿饭和一张床。但B&B作为理想住宿方式的复兴 是相当近期的现象。"},{"speaker":"","en":"If the idea of operating a B&B arouses your interest, there are several factors to consider before plunging into this business. The first consideration is your property, not only the building itself, but the location. If you live near a famous historical site or in a popular destination, such as New York City or Washington, D.C., your home can be fairly simple, yet still do well as a B&B. On the other hand, if your home is architecturally unique or has facilities for the traveler, such as a private entrance, private bath or swimming pool, people may be willing to go some distance to reach you. Another important factor is the lifestyle of you and your family. You must take into account whether all members of the family truly enjoy visitors, want to repeatedly discuss local sites and activities, and have the time and energy to handle the additional cooking, cleaning, laundry and the bookkeeping involved. The final consideration is a financial one, potential B&B hosts must be realistic about opportunities for income. While B&Bs usually have low initial costs, experts estimate it would take at least five rooms rented regularly for the host to earn a living from B&B.","cn":"如果经营B&B的想法引起了你的兴趣,在投身这项业务之前有几个因素需要考虑。首先要考虑的是你的房 产,不仅是建筑本身,还有位置。如果你住在著名历史遗迹附近或热门目的地,如纽约市或华盛顿特区,你的房 子可以相当简单,但仍然可以作为B&B经营得很好。另一方面,如果你的房子在建筑上独具特色或为旅行者 提供便利设施,如独立入口、独立浴室或游泳池,人们可能愿意走一段距离来找你。另一个重要因素是你和 你家人的生活方式。你必须考虑家庭所有成员是否真正喜欢访客,愿意反复讨论当地景点和活动,并有时间 和精力处理额外的烹饪、清洁、洗衣和记账工作。最后要考虑的是财务问题,潜在的B&B房东必须对收入 机会有现实的认识。虽然B&B通常初始成本较低,但专家估计至少需要五个房间定期出租,房东才能靠B&B 谋生。"}],"questions":[{"prompt":"What does the speaker say travelers commonly complain about?","translation":"说话者说旅行者通常抱怨什么？","options":["The ill treatment they get as tourists.","The nonprofessional business they see.","The impersonal accommodations.","The many adventures on their way."],"answer":"C","qtype":"细节题","locateEn":"Whatever the reason for traveling, a common complaint of travelers is the impersonal accommodations they find.","locateCn":"无论出行的理由是什么，旅行者们一个共同的抱怨就是他们遇到的那种缺乏人情味的住宿。","signal":"complaint 信号词直接引出。答案句里 a common complaint of travelers is 与题干","num":22},{"prompt":"What is said about Bed and Breakfast arrangements?","translation":"关于家庭旅馆安排说了什么？","options":["They have been the classic way to visit Europe.","They attract tourists with location and decoration.","They have long been competing with chain hotels.","They are in fact a completely new idea in America."],"answer":"A","qtype":"细节题","locateEn":"For decades, B&Bs have been the classic way to visit Europe, especially the British Isles. And in fact, they are not really a new idea in America.","locateCn":"几十年来，B&B 一直是游览欧洲、尤其是不列颠群岛的经典方式。而且事实上，它们在美 国也并非真正的新事物。","signal":"For decades 强调由来已久。For decades, B&Bs have been the classic way to visit","num":23},{"prompt":"What is the first thing you have to consider if you want to start a B&B business?","translation":"如果你想开办家庭旅馆生意，你首先必须考虑什么？","options":["Your financial status.","Your family's consent.","Your property.","Your personality."],"answer":"C","qtype":"细节题","locateEn":"The first consideration is your property, not only the building itself, but the location.","locateCn":"首先要考虑的是你的房产，不仅是建筑本身，还有它的地理位置。","signal":"The first consideration 排序信号。The first consideration is your property 用 The","num":24},{"prompt":"What does the speaker say potential B&B hosts must be realistic about?","translation":"说话者说潜在的家庭旅馆经营者必须对什么有现实认识？","options":["Costs for starting the business.","The number of guests to receive.","The facilities to provide.","Opportunities for income."],"answer":"D","qtype":"细节题","locateEn":"The final consideration is a financial one, potential B&B hosts must be realistic about opportunities for income.","locateCn":"最后一项考虑是财务方面的，准 B&B 房主必须对赚钱的机会抱有现实的预期。","signal":"realistic about 原词搭桥。答案句 must be realistic about opportunities for income 与","num":25}]}]}`),"2025-12-2":JSON.parse(`{"id":"2025-12-2","label":"2025年12月 · 第2套","writing":{"modelEssay":"It is believed that teachers can exert a profound influence on their students' academic pursuit and personal\\ndevelopment. Having spent years in classrooms, I firmly agree that a dedicated teacher shapes not only what\\nwe learn but also who we become.\\nOn the one hand, teachers guide our academic growth. My high-school chemistry teacher, Mr. Li, turned a\\nsubject I once dreaded into my favourite one. By designing vivid experiments and patiently answering my\\nendless questions, he inspired me to pursue science and eventually major in it at university. On the other hand,\\nteachers mould our character. Through his fairness and honesty, Mr. Li taught me to value integrity over easy\\nshortcuts, a lesson that still steers my decisions today.\\nIn conclusion, a good teacher enlightens the mind and cultivates the heart at the same time. Their influence,\\nthough quiet and gradual, reaches far beyond examinations and often lasts a whole lifetime.","modelCn":"人们普遍认为，教师能对学生的学业追求和人格发展产生深远的影响。在课堂里度过多年之后，我坚定地\\n赞同这一点：一位敬业的老师塑造的，不仅是我们学到了什么，更是我们成为了什么样的人。\\n一方面，教师引领我们的学业成长。我高中的化学老师李老师，把一门我曾经害怕的学科变成了我的最\\n爱。他设计生动的实验，耐心回答我层出不穷的问题，激励我去追求科学，最终让我在大学里选择了它作\\n为专业。另一方面，教师塑造我们的品格。凭借他的公正与诚实，李老师教会我看重正直、不走投机取巧\\n的捷径——这个道理至今仍在指引我的抉择。\\n总之，一位好老师同时启迪头脑、滋养心灵。他们的影响虽然安静而渐进，却远远超越考试，往往伴随人\\n的一生。"},"translation":{"source":"中华民族崇尚自强自立的精神，这一精神深植于中国文化之中，是民族生存与发展的重要支撑。改革开放以来，中国在自强自立的征程上，持续加大科研投入，在信息技术、人工智能、航天工程等领域不断取得新突破。 5G 网络覆盖全国，远程医疗发展迅速，电子支付的使用全球领先，嫦娥探月工程展现了航天领域引人注目的发展。自强自主精神成为推动国家现代化进程的强大动力，激励着中国人民为实现民族复兴  (rejuvenation) 的中国梦不断奋进。","reference":"The Chinese nation values the spirit of self-reliance and self-improvement, which is deeply rooted in Chinese culture and serves as a vital support for the survival and development of the nation. Since the reform and opening-up, China has continued to increase its investment in scientific research on its journey toward self-reliance, and has kept making new breakthroughs in such fields as information technology, artificial intelligence and aerospace engineering. For example, 5G networks now cover the whole country, telemedicine is developing rapidly, and electronic payment is used more widely than anywhere else in the world; the Chang'e lunar exploration program also demonstrates remarkable progress in China's aerospace field. The spirit of self-reliance and self-improvement has become a powerful driving force behind the country's modernization, inspiring the Chinese people to keep forging ahead toward the Chinese Dream of national rejuvenation."},"cloze":{"passage":"We humans love to believe we are special, but science and technology have repeatedly proved this conviction wrong. People __26__ thought that humans were the only animals to use tools, to form teams or to propagate culture, but science has shown that other animals do each of these things. Meanwhile, technology has quashed (使无效)，one by one, claims that __27__ tasks require a human brain. The first adding machine was invented in 1623. This past year, a computer-generated work won an art contest. I believe the moment when computers meet and __28__ human intelligence is on the horizon. How will human intelligence and creativity be valued when machines become smarter and more creative than the brightest people? There will likely be a spectrum. In some __29__ , people still value humans doing things, even if a computer can do it better. It’s been a quarter of a century since a computer beat world champion Garry Kasparov, but human chess hasn’t gone away. In other fields, human skill will seem costly and __30__ . Take illustration for example: most readers don’t care whether the graphic __31__ a magazine article was drawn by a person or a computer — they just want it to be relevant, new and perhaps __32__ . And, of course, this question isn’t black or white. Many fields will be a __33__ , where some humans find a lucky place, but most of the work is done by computers, like in manufacturing today, where much of the work is 4 https://zhenti.burningvocabulary.cn accomplished by robots, but some humans must be there to __34__ the machines. If history is any guide, it’s almost certain that advances in AI will cause more jobs to __35__ , that creative workers with human-only skills will become richer but fewer in number, and that those who own creative technology will become the new ultra-rich.","bank":{"A":"accompanying","B":"cognitive","C":"domains","D":"entertaining","E":"evoking","F":"hybrid","G":"impetus","H":"intuitive","I":"once","J":"oversee","K":"redundant","L":"stances","M":"surpass","N":"tentatively","O":"vanish"},"answers":{"26":{"letter":"I","word":"once","pos":"副词","explanation":"与 but 后的 has shown 构成今昔对比 People __(26)__ thought that humans were the only animals to use tools, to form teams or to propagate culture, but science has shown that other animals do each of these things. 前半句过去时 thought、后半句现在完成时 has shown，典型 \\"过去曾以为 / 如今已证明\\" 结构，填 once（曾经）正好咬合这条时间逻辑。"},"27":{"letter":"B","word":"cognitive","pos":"形容词","explanation":"与 \\"require a human brain\\" 同义呼应 claims that __(27)__ tasks require a human brain——能 require a human brain（需要 人脑）的任务，正是 cognitive tasks（认知性的任务、需要思维加工的任务）。下一句又 用 adding machine、computer-generated art、computer matches human intelligence 反复指向 \\"智力/认知\\"，B 与上下文构成最稳同义网。"},"28":{"letter":"M","word":"surpass","pos":"动词","explanation":"\\"匹敌并超越\\" 是 AI 论述的固定搭配 I believe the moment when computers meet and __(28)__ human intelligence is on the horizon.——meet（达到/匹敌）+ surpass（超越）是 AI 话题里最常见的递进搭配， 且呼应第三段 when machines become smarter and more creative than the brightest people（变得比最聪明的人更聪明、更有创造力），证实方向就是 \\"超越\\"。"},"29":{"letter":"C","word":"domains","pos":"名词","explanation":"\\"在某些领域里\\" 与下文 In other fields 形成对照 下一段开头 In other fields, human skill will seem costly and __(30)__. 用 In other fields 与本段 In some __(29)__ 形成 \\"在某些领域 / 在另一些领域\\" 的并列对照；domains（领 域）与 fields 同义，正好咬合这条段间对照逻辑。"},"30":{"letter":"K","word":"redundant","pos":"形容词","explanation":"\\"昂贵 + 多余\\" 共同描述被淘汰的人类技能 本段例 most readers don't care whether the graphic __(31)__ a magazine article was drawn by a person or a computer——读者并不在意是人画的还是机器画的，意味着人类 技能既贵又**没必要**，redundant（多余的、被裁掉的）正好把这层负面评价点透。"},"31":{"letter":"A","word":"accompanying","pos":"形容词","explanation":"\\"配文插图\\" 是固定搭配 the graphic __(31)__ a magazine article was drawn by a person or a computer—— graphic accompanying a magazine article 即 \\"配在杂志文章旁的插图\\"，accompany 与 graphic/article 是新闻出版中的常规搭配。"},"32":{"letter":"D","word":"entertaining","pos":"形容词","explanation":"读者期待 \\"贴题、新颖、有趣\\" 三件套 they just want it to be relevant, new and perhaps __(32)__.——读者作为大众，对杂志 插图的诉求是 relevant（与文章相关）、new（新鲜）、entertaining（有趣）这三件套， 构成同色彩并列；perhaps 又留了余地，正合 \\"有趣\\" 这种偏锦上添花的属性。"},"33":{"letter":"F","word":"hybrid","pos":"名词","explanation":"where 从句直接定义 \\"人机混合\\" Many fields will be a __(33)__, where some humans find a lucky place, but most of the work is done by computers, like in manufacturing today, where much of the work is accomplished by robots, but some humans must be there to __(34)__ the machines.——where 从句里 \\"some humans … but most of the work is done by computers\\" 把空名词定义成 \\"人机混合体\\"，hybrid 是唯一精准对应词。"},"34":{"letter":"J","word":"oversee","pos":"动词","explanation":"\\"机器为主、人来监管\\" 正是本段图景 much of the work is accomplished by robots, but some humans must be there to __(34)__ the machines. 转折 but 之后明确：活儿主要由机器人干，但仍要有人 \\"在 场\\"——\\"在场对机器\\" 干什么？最贴合的就是 \\"监督、监管\\" oversee，与制造业现实经验也 一致。"},"35":{"letter":"O","word":"vanish
